<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="../favicon.jpg">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATAFORCE - Airline Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#e8eaee; --surface:#fff; --border:#d8dde8; --navy:#0d1f3c;
    --text1:#0d1f3c; --text2:#41536c; --text3:#8391a8; --blue:#1a56db; --amber:#c97a06;
    --green:#548235; --green2:#a9d08e; --green3:#e2efda; --total:#d9d9d9;
    --content-width:1180px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; background:var(--bg); color:var(--text1); font-family:'Inter',sans-serif; font-size:12px; }
  button, select, input { font:inherit; }
  .app { min-height:100vh; padding:8px; }
  .header { background:var(--navy); border-radius:6px; padding:8px 16px; display:grid; grid-template-columns:minmax(180px,1fr) minmax(280px,1.4fr) minmax(250px,1fr); align-items:center; gap:10px; margin-bottom:8px; }
  .logo-link { color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:9px; width:max-content; }
  .df-mark { width:28px; height:28px; border:1px solid rgba(122,174,213,.7); border-radius:4px; display:grid; place-items:center; color:#7aaed5; font-weight:600; }
  .logo-word { display:flex; flex-direction:column; gap:1px; }
  .logo-main { font-size:18px; letter-spacing:.13em; font-weight:600; line-height:1; }
  .logo-sub { color:#7aaed5; font-size:9px; letter-spacing:.24em; text-transform:uppercase; }
  .hdr-mid { text-align:center; min-width:0; }
  .header-title { color:#7aaed5; letter-spacing:.12em; font-size:17px; font-weight:500; white-space:nowrap; }
  .header-right { color:#fff; display:flex; justify-content:flex-end; align-items:center; gap:12px; font-size:11px; min-width:0; }
  .status { color:#8fb5d7; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:99px; background:var(--amber); }
  .logout { border:1px solid #7aaed5; color:#7aaed5; background:transparent; border-radius:3px; padding:4px 10px; cursor:pointer; font-size:10px; }
  .panel { width:min(var(--content-width),100%); margin:0 auto 8px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label, .field-label { color:var(--text3); font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .field select, .field input { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 8px; background:#fff; color:var(--text1); }
  .tool-btn { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 14px; background:#fff; color:var(--text2); cursor:pointer; }
  .tool-btn.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  .stations { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:4px; padding:4px 8px; cursor:pointer; color:var(--text2); }
  .note { margin-top:8px; color:var(--text2); line-height:1.5; }
  .block-title { font-size:13px; font-weight:600; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--green); color:#fff; font-weight:500; padding:6px 8px; text-align:center; white-space:nowrap; }
  td { padding:4px 8px; border-bottom:1px solid #e6efe0; text-align:center; white-space:nowrap; }
  td.num, th.num { text-align:right; }
  td.day { background:var(--green2); color:#fff; font-weight:500; border-bottom:0; }
  td.st { background:var(--green3); border-bottom:0; }
  td.dest { background:var(--green3); }
  tr.total td { background:var(--total); font-weight:600; border-bottom:0; }
  tr.total td.label { text-align:left; }
  .empty { padding:18px; text-align:center; color:var(--text3); }
  .df-table th { background:#1a3360; color:#c8d8f0; font-size:9px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; padding:8px; }
  .df-table td { border-bottom:1px solid var(--border); padding:8px; font-size:11px; }
  .df-table tbody tr:nth-child(even) td { background:#f0f2f6; }
  .df-table tbody tr:hover td { background:#e4ecfb; }
  .hub { width:min(var(--content-width),100%); margin:18px auto 8px; }
  .hub h1 { font-size:20px; font-weight:600; }
  .hub-lead { color:var(--text2); margin:3px 0 16px; font-size:13px; }
  .airlines { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .airline { position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-height:132px; padding:18px 16px 14px; text-align:left; color:inherit; cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:12px; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .airline::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--blue); }
  .airline.pending::before { background:#c5cfe0; }
  @media (hover:hover) { .airline:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(13,31,60,.12); border-color:#c5cfe0; } }
  .airline-code { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; background:#eef3fb; color:var(--blue); font-weight:600; }
  .airline.pending .airline-code { background:#eef0f4; color:var(--text2); }
  .airline-name { font-size:13px; font-weight:600; }
  .airline-tag { margin-top:auto; font-size:10px; font-weight:500; padding:3px 8px; border-radius:4px; background:var(--green3); color:#3b5d24; }
  .airline.pending .airline-tag { background:#eef0f4; color:var(--text2); }
  .hub-note { min-height:18px; margin-top:12px; color:var(--text2); font-size:12px; }
  .report-head { width:min(var(--content-width),100%); margin:0 auto 8px; display:flex; align-items:center; gap:12px; }
  .report-head h1 { font-size:16px; font-weight:600; }
  /* Avianca: Seguimiento de Mercado (19 nov, cony), same layout as the Excel, in Avianca red */
  .av-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .av-bar .spacer { flex:1; }
  .av-red { color:#da291c; }
  .av-legend { display:flex; gap:12px; font-size:11px; color:var(--text2); margin-bottom:4px; }
  .av-legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  .av-chart svg { width:100%; height:auto; display:block; }
  .av-scroll { overflow-x:auto; border:1px solid #f1c4c0; border-radius:6px; }
  .av-print .av-scroll { overflow:visible; }
  .av-table { border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  .av-table th { background:#da291c; color:#fff; font-size:10px; font-weight:600; padding:6px 6px; text-align:right; }
  .av-table td { padding:4px 6px; border-bottom:1px solid #f6e3e1; text-align:right; font-size:11px; background:#fff; }
  .av-table tbody tr:nth-child(even) td { background:#fdf5f4; }
  .av-table .yr { position:sticky; left:0; z-index:1; width:44px; min-width:44px; text-align:left; color:var(--text2); }
  .av-table .lbl { position:sticky; left:44px; z-index:1; min-width:150px; text-align:left; font-weight:500; border-right:1px solid #f1c4c0; }
  .av-table th.yr, .av-table th.lbl { z-index:2; text-align:left; }
  .av-table .fl { text-align:left; min-width:96px; color:var(--text2); }
  .av-table tr.blank td { background:#fff !important; height:10px; padding:0; border-bottom:0; }
  .av-table tr.qt td { font-weight:600; }
  .av-table input { width:54px; height:22px; border:1px solid #ecc9c5; border-radius:4px; text-align:right; padding:0 4px; font-size:11px; background:#fffaf0; }
  .av-table td.fl input { width:38px; }
  .av-table input.saving { border-color:#f59e0b; } .av-table input.saved { border-color:#16a34a; } .av-table input.err { border-color:#dc2626; background:#fef2f2; }
  [hidden] { display:none !important; }
  @media (max-width:760px) {
    .header { grid-template-columns:1fr; }
    .hdr-mid { text-align:left; }
    .header-right { justify-content:flex-start; }
    .table-wrap { overflow-x:auto; }
  }
</style>

<div class="app">
  <div class="header">

      <span class="df-mark">DF</span>
      <span class="logo-word"><span class="logo-main">DATAFORCE</span><span class="logo-sub">GSA Force</span></span>
    </a>
    <div class="hdr-mid"><div class="header-title">AIRLINE REPORTS</div></div>
    <div class="header-right">
      <span id="userLabel"></span>
      <span class="status"><span class="dot"></span><span id="statusText">Loading</span></span>

<script src="../permission-guard.js"></script>
<script>
const API_BASE = "https://dataforce-api-test-911713216717.us-east1.run.app";
const API_KEY = "We1ykcoHgFV16LPduzqw7qGJlMBPGE06U5L7y5Hg_6I";

// The flight number is not in CargoSystem: only the flights given for each carrier.
const FLIGHTS = { ET: { EWR: "ET515", JFK: "ET513" } };
// AWB prefix each carrier opens with; its segments on other airlines' AWBs stay out until chosen.
const OWN_PREFIX = { ET: 71, LY: 805 };
// 6 nov, cony: El Al's report is last week's 805 AWBs flown on El Al, Monday to Sunday.
const PREVIOUS_WEEK = { LY: true };
// Stations that start unchecked; they can be added with their checkbox.
const UNCHECKED_STATIONS = { ET: ["LGG"] };
// 4 nov, cony: each airline has its own report format, so the module opens with
// one card per client airline. "ready" = its format is built; the others open
// once they have one.
const AIRLINES = [
  { code: "ET", name: "Ethiopian", ready: true },
  { code: "LY", name: "El Al", ready: true },
  { code: "CX", name: "Cathay" },
  { code: "5X", name: "UPS" },
  { code: "AV", name: "Avianca", ready: true },
  { code: "4X", name: "Mercury" },
];
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

let data = null;
let carrier = null;
let hiddenStations = new Set();
let requestSeq = 0;

const els = {
  prefix: document.getElementById("prefix"),
  dateFrom: document.getElementById("dateFrom"),
  dateTo: document.getElementById("dateTo"),
  day: document.getElementById("dayFilter"),
  stations: document.getElementById("stations"),
  note: document.getElementById("note"),
  report: document.getElementById("report"),
  status: document.getElementById("statusText"),
};

function user() {
  return getDataforceUser() || {};
}

function signOut() {
  sessionStorage.removeItem("df_user");
  sessionStorage.removeItem("df_permissions");
  window.location.href = "https://dataforce.gsaforce.com/";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function parseDay(text) {
  const [y, m, d] = String(text).slice(0, 10).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function number(value) {
  return Math.floor(Number(value || 0) + 0.5).toLocaleString("en-US");
}

function flightLabel(carrier, group) {
  const d = parseDay(group.flight_date);
  const date = `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
  const flight = (FLIGHTS[carrier] || {})[group.station];
  return flight ? `${date}-${flight}` : date;
}

function dayName(group) {
  return DAY_NAMES[parseDay(group.flight_date).getDay()];
}

// 19 nov, cony: no Friday/Monday report any more, only the calendar. The API
// is asked for Monday-to-Sunday weeks (they cover every day) and the page
// keeps exactly the days between From and To, in one table.
function baseBlocks() {
  if (!data) return [];
  const { from, to } = data.range;
  const groups = data.blocks.flatMap(block => block.groups)
    .filter(g => from <= String(g.flight_date).slice(0, 10) && String(g.flight_date).slice(0, 10) <= to);
  return [{ start: from, end: to, groups }];
}

function visibleBlocks() {
  const day = els.day.value;
  return baseBlocks()
    .filter(block => day === "ALL" || (block.start <= day && day <= block.end))
    .map(block => ({
      ...block,
      groups: block.groups.filter(g => !hiddenStations.has(g.station) && (day === "ALL" || String(g.flight_date).slice(0, 10) === day)),
    }));
}

function renderDays() {
  const selected = els.day.value;
  const options = [{ value: "ALL", label: "All days" }];
  baseBlocks().forEach(block => {
    for (let d = parseDay(block.start); iso(d) <= block.end; d.setDate(d.getDate() + 1)) {
      options.push({ value: iso(d), label: d.toLocaleDateString("en-US", { weekday: "long", month: "2-digit", day: "2-digit" }) });
    }
  });
  fillSelect(els.day, options, options.some(o => o.value === selected) ? selected : "ALL");
}

function blockTitle(block) {
  const f = d => parseDay(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  return `${f(block.start)} to ${f(block.end)}`;
}

function renderStations() {
  // El Al's report has no station filter: every gateway is always in it.
  const stations = data && !PREVIOUS_WEEK[data.carrier] ? data.stations : [];
  els.stations.innerHTML = stations.length
    ? `<span class="field-label">Station</span>` + stations.map(s =>
        `<label class="chip"><input type="checkbox" data-station="${esc(s)}" ${hiddenStations.has(s) ? "" : "checked"}>${esc(s)}</label>`).join("")
    : "";
}

function money(value) {
  return Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function usDate(text) {
  const d = parseDay(text);
  return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}/${d.getFullYear()}`;
}

// One line per El Al segment: the rate and the minimum are the ones entered in CargoSystem.
function elAlLines(block) {
  return block.groups.flatMap(group => group.rows.map(row => ({
    awb: row.awb,
    date: usDate(group.flight_date),
    gateway: group.station,
    destination: row.destination,
    chw: Number(row.kilos || 0),
    rate: row.rate == null ? "" : money(row.rate),
    minimum: Number(row.minimum) > 0 ? money(row.minimum) : "",
  })));
}

const EL_AL_COLUMNS = ["AWB", "Flight Date", "Gateway", "Destination", "CHW (Kg)", "Rate $/kg", "Min $"];

function renderElAl() {
  els.report.innerHTML = visibleBlocks().map(block => {
    const lines = elAlLines(block);
    if (!lines.length) {
      return `<section class="panel"><div class="block-title">${esc(blockTitle(block))}</div><div class="empty">No segments for these filters.</div></section>`;
    }
    const body = lines.map(l => `<tr>
        <td>${esc(l.awb)}</td><td>${esc(l.date)}</td><td>${esc(l.gateway)}</td><td>${esc(l.destination)}</td>
        <td class="num">${money(l.chw)}</td><td class="num">${esc(l.rate)}</td><td class="num">${esc(l.minimum)}</td>
      </tr>`).join("");
    return `<section class="panel">
      <div class="block-title">${esc(blockTitle(block))}</div>
      <div class="table-wrap"><table class="df-table">
        <thead><tr>${EL_AL_COLUMNS.map((c, i) => `<th${i > 3 ? ' class="num"' : ""}>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
  }).join("");
}

function renderReport() {
  if (data && data.carrier === "LY") return renderElAl();
  const carrier = data ? data.carrier : "";
  const blocks = visibleBlocks();
  const html = blocks.map(block => {
    let body = "";
    block.groups.forEach(group => {
      group.rows.forEach((row, i) => {
        const newDest = i === 0 || group.rows[i - 1].destination !== row.destination;
        body += `<tr>
          <td class="day">${i === 0 ? esc(dayName(group)) : ""}</td>
          <td class="st">${i === 0 ? esc(group.station) : ""}</td>
          <td>${i === 0 ? esc(flightLabel(carrier, group)) : ""}</td>
          <td class="dest">${newDest ? esc(row.destination) : ""}</td>
          <td>${esc(row.awb)}</td>
          <td>${esc(row.product)}</td>
          <td class="num">${number(row.kilos)}</td>
          <td class="num">$ ${number(row.revenue)}</td>
          <td></td>
        </tr>`;
      });
      body += `<tr class="total">
        <td class="day"></td>
        <td class="label" colspan="5">${esc(group.station)} Total</td>
        <td class="num">${number(group.kilos)}</td>
        <td class="num">$ ${number(group.revenue)}</td>
        <td class="num">${group.pmc}</td>
      </tr>`;
    });
    if (!block.groups.length) {
      return `<section class="panel"><div class="block-title">${esc(blockTitle(block))}</div><div class="empty">No segments for these filters.</div></section>`;
    }
    return `<section class="panel">
      <div class="block-title">${esc(blockTitle(block))}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Day of the week</th><th>Station</th><th>Flight/Date</th><th>Destination</th><th>AWB</th><th>PRODUCT</th><th class="num">Kilos</th><th class="num">REVENUE</th><th class="num">PMC</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
  }).join("");
  els.report.innerHTML = html;
}

function fillSelect(select, options, value) {
  select.innerHTML = options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
  select.value = String(value);
}

async function load() {
  const u = user();
  const seq = ++requestSeq;
  const params = new URLSearchParams({
    email: u.email,
    report_type: "monday",
    date_from: els.dateFrom.value,
    date_to: els.dateTo.value || els.dateFrom.value,
    carrier,
  });
  if (els.prefix.value !== "ALL" && els.prefix.value !== "") params.set("prefix", els.prefix.value);
  else if (els.prefix.value === "" && OWN_PREFIX[carrier]) params.set("prefix", OWN_PREFIX[carrier]);
  els.status.textContent = "Loading";
  try {
    const response = await fetch(`${API_BASE}/api/airline_reports?${params.toString()}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== requestSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    data = body;
    data.range = { from: params.get("date_from"), to: params.get("date_to") };
    fillSelect(els.prefix, [{ value: "ALL", label: "All" }].concat(body.prefixes.map(p => ({ value: p, label: String(p).padStart(3, "0") }))), body.prefix ?? "ALL");
    renderDays();
    renderStations();
    renderReport();
    if (body.carrier === "LY") {
      els.note.textContent = body.with_rates ? "" : "Rate and minimum will show once Seg_IntRate and Seg_IntMin reach the database.";
    } else {
      els.note.textContent = (FLIGHTS[body.carrier] ? "" : "CargoSystem has no flight number, so this carrier shows only the date. ");
    }
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== requestSeq) return;
    data = null;
    renderDays();
    renderStations();
    els.report.innerHTML = "";
    els.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function exportElAlExcel(book, sheet) {
  const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
  [16, 13, 10, 12, 12, 11, 10].forEach((width, i) => { sheet.getColumn(i + 1).width = width; });
  visibleBlocks().forEach(block => {
    const lines = elAlLines(block);
    if (!lines.length) return;
    sheet.addRow([blockTitle(block)]).font = { bold: true };
    const head = sheet.addRow(EL_AL_COLUMNS);
    head.eachCell(cell => { cell.fill = fill("FF4472C4"); cell.font = { color: { argb: "FFFFFFFF" }, bold: true }; cell.alignment = { horizontal: "center" }; });
    lines.forEach(l => {
      const r = sheet.addRow([l.awb, l.date, l.gateway, l.destination, l.chw, l.rate === "" ? null : Number(l.rate.replace(/,/g, "")), l.minimum === "" ? null : Number(l.minimum.replace(/,/g, ""))]);
      r.eachCell({ includeEmpty: true }, cell => { cell.fill = fill("FFDDEBF7"); cell.alignment = { horizontal: "center" }; });
      [5, 6, 7].forEach(i => { r.getCell(i).numFmt = "#,##0.00"; });
    });
    sheet.addRow([]);
  });
  const buffer = await book.xlsx.writeBuffer();
  downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), exportName("xlsx"));
}

async function exportExcel() {
  if (!data || !window.ExcelJS) return;
  const book = new ExcelJS.Workbook();
  const sheet = book.addWorksheet("Report");
  if (data.carrier === "LY") return exportElAlExcel(book, sheet);
  const columns = ["Day of the week", "Station", "Flight/Date", "Destination", "AWB", "PRODUCT", "Kilos", "REVENUE", "PMC"];
  [16, 9, 15, 12, 16, 24, 10, 12, 7].forEach((width, i) => { sheet.getColumn(i + 1).width = width; });
  const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
  const line = { bottom: { style: "thin", color: { argb: "FFE2EFDA" } } };
  visibleBlocks().forEach(block => {
    if (!block.groups.length) return;
    sheet.addRow([blockTitle(block)]).font = { bold: true };
    const head = sheet.addRow(columns);
    head.eachCell(cell => { cell.fill = fill("FF548235"); cell.font = { color: { argb: "FFFFFFFF" } }; cell.alignment = { horizontal: "center" }; });
    block.groups.forEach(group => {
      group.rows.forEach((row, i) => {
        const newDest = i === 0 || group.rows[i - 1].destination !== row.destination;
        const r = sheet.addRow([i === 0 ? dayName(group) : "", i === 0 ? group.station : "", i === 0 ? flightLabel(data.carrier, group) : "", newDest ? row.destination : "", row.awb, row.product, Number(row.kilos || 0), Number(row.revenue || 0), null]);
        r.eachCell({ includeEmpty: true }, cell => { cell.border = line; cell.alignment = { horizontal: "center" }; });
        r.getCell(1).fill = fill("FFA9D08E"); r.getCell(1).font = { color: { argb: "FFFFFFFF" } };
        r.getCell(2).fill = fill("FFE2EFDA"); r.getCell(4).fill = fill("FFE2EFDA");
        r.getCell(7).numFmt = "#,##0"; r.getCell(7).alignment = { horizontal: "right" };
        r.getCell(8).numFmt = '"$" #,##0'; r.getCell(8).alignment = { horizontal: "right" };
      });
      const t = sheet.addRow(["", `${group.station} Total`, "", "", "", "", group.kilos, group.revenue, group.pmc]);
      t.eachCell({ includeEmpty: true }, cell => { cell.fill = fill("FFD9D9D9"); cell.font = { bold: true }; });
      t.getCell(1).fill = fill("FFA9D08E");
      t.getCell(7).numFmt = "#,##0"; t.getCell(8).numFmt = '"$" #,##0';
    });
    sheet.addRow([]);
  });
  const buffer = await book.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = exportName("xlsx");
  a.click();
  URL.revokeObjectURL(url);
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function exportName(extension) {
  return `airline-report-${data.carrier}-${data.range.from}-to-${data.range.to}.${extension}`;
}

function exportCsv() {
  if (!data) return;
  const cell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const round = value => Math.floor(Number(value || 0) + 0.5);
  if (data.carrier === "LY") {
    const rows = [["Report", ...EL_AL_COLUMNS]];
    visibleBlocks().forEach(block => elAlLines(block).forEach(l =>
      rows.push([blockTitle(block), l.awb, l.date, l.gateway, l.destination, l.chw.toFixed(2), l.rate.replace(/,/g, ""), l.minimum.replace(/,/g, "")])));
    const csv = rows.map(line => line.map(cell).join(",")).join("\r\n");
    downloadBlob(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }), exportName("csv"));
    return;
  }
  const lines = [["Report", "Day of the week", "Station", "Flight/Date", "Destination", "AWB", "PRODUCT", "Kilos", "REVENUE", "PMC"]];
  visibleBlocks().forEach(block => {
    block.groups.forEach(group => {
      const start = [blockTitle(block), dayName(group), group.station, flightLabel(data.carrier, group)];
      group.rows.forEach(row => {
        lines.push([...start, row.destination, row.awb, row.product, round(row.kilos), round(row.revenue), ""]);
      });
      lines.push([...start, "", `${group.station} Total`, "", round(group.kilos), round(group.revenue), group.pmc]);
    });
  });
  const text = lines.map(line => line.map(cell).join(",")).join("\r\n");
  downloadBlob(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" }), exportName("csv"));
}

async function exportImage() {
  if (!data || !window.html2canvas) return;
  const canvas = await html2canvas(els.report, { backgroundColor: "#ffffff", scale: 2 });
  canvas.toBlob(blob => downloadBlob(blob, exportName("png")), "image/png");
}

// ---------------------------------------------------------------------------
// Avianca: Seguimiento de Mercado (19 nov, cony). The weekly report that is
// sent to Avianca, with the same content as the Excel/PDF built by hand: one
// table per year (lines x weeks) and the "GRAFICOS" part. It is a report, not
// an analysis. Data from the Isidora table (Chile origin, ISO weeks, tons);
// QT, general cargo and the flights of some carriers come from another
// report, so they are typed in here each week and saved for everyone.
// ---------------------------------------------------------------------------
const AV_RED = "#da291c";
let av = null;
let avSeq = 0;
const avEls = {
  view: document.getElementById("aviancaView"),
  year: document.getElementById("avYear"),
  week: document.getElementById("avWeek"),
  note: document.getElementById("avNote"),
  report: document.getElementById("avReport"),
};

function avLine(key) {
  return av.lines.find(l => l.key === key);
}

function avValue(values, year, week) {
  const v = ((values || {})[String(year)] || {})[String(week)];
  return v === undefined || v === null || v === "" ? null : Number(v);
}

// The report goes up to the chosen week (by default the last closed one, like "SeguimientoMercado W45").
function avReportWeek() {
  return av ? Number(avEls.week.value) || av.last_closed_week || av.last_week : 0;
}

function avWeeks() {
  return Array.from({ length: avReportWeek() }, (_, i) => i + 1);
}

function avFmt(v) {
  return v === null ? "" : Math.round(v).toLocaleString("en-US");
}

function avManualInput(key, year, week, value, label) {
  return `<input type="number" min="0" step="1" data-line="${esc(key)}" data-year="${year}" data-week="${week}" value="${value === null ? "" : value}" aria-label="${esc(label)} week ${week}">`;
}

// One table per year, the same rows and order as the Excel.
function avYearTable(year) {
  const weeks = avWeeks();
  const lastWeek = weeks[weeks.length - 1];
  const cols = weeks.length + 3;
  let body = "", section = 0;
  const blank = `<tr class="blank"><td colspan="${cols}"></td></tr>`;
  av.lines.forEach(line => {
    if (section && line.section !== section) body += blank;
    section = line.section;
    const flights = year === av.year && av.flight_lines.includes(line.key)
      ? avManualInput(`flights_${line.key}`, year, lastWeek, avValue(av.manual[`flights_${line.key}`], year, lastWeek), `${line.label} flights`) + " vuelos"
      : "";
    body += `<tr><td class="yr">${year}</td><td class="lbl">${esc(line.label)}</td>${weeks.map(w => `<td>${avFmt(avValue(line.values, year, w))}</td>`).join("")}<td class="fl">${flights}</td></tr>`;
    if (line.key === "tlv") {
      body += `<tr><td class="yr">${year}</td><td class="lbl">Carga General</td>${weeks.map(w => `<td>${avManualInput("carga_general", year, w, avValue(av.manual.carga_general, year, w), "Carga General")}</td>`).join("")}<td class="fl"></td></tr>`;
    }
  });
  if (year === av.year) body += blank + `<tr class="qt"><td class="yr"></td><td class="lbl">QT (ALL)</td>${weeks.map(w => `<td>${avManualInput("qt", year, w, avValue(av.manual.qt, year, w), "QT (ALL)")}</td>`).join("")}<td class="fl"></td></tr>`;
  return `<section class="panel"><div class="av-scroll"><table class="av-table">
    <thead><tr><th class="yr">Year</th><th class="lbl">Item</th>${weeks.map(w => `<th>${w}</th>`).join("")}<th class="fl"></th></tr></thead>
    <tbody>${body}</tbody></table></div></section>`;
}

function avProductRows(year) {
  const total = avLine("total"), salmon = avLine("salmon"), fruit = avLine("fruit");
  const otros = w => {
    const t = avValue(total.values, year, w);
    return t === null ? null : t - (avValue(salmon.values, year, w) || 0) - (avValue(fruit.values, year, w) || 0);
  };
  return [["Salmon", w => avValue(salmon.values, year, w)], ["Fruit", w => avValue(fruit.values, year, w)], ["Otros", otros]];
}

function avSalmonChart() {
  const weeks = avWeeks();
  const salmon = avLine("salmon");
  const cur = weeks.map(w => avValue(salmon.values, av.year, w)), prev = weeks.map(w => avValue(salmon.values, av.previous_year, w));
  const max = Math.max(1, ...cur.concat(prev).map(v => v || 0));
  const W = 1100, H = 260, L = 46, B = 26, T = 12, step = (W - L - 8) / Math.max(1, weeks.length), bw = Math.max(2, step / 2 - 1.5);
  const y = v => T + (H - T - B) * (1 - (v || 0) / max);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => Math.round(max * f / 100) * 100);
  let svg = ticks.map(t => `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="#eef1f6"/><text x="${L - 6}" y="${y(t) + 3}" font-size="10" text-anchor="end" fill="#8391a8">${t.toLocaleString("en-US")}</text>`).join("");
  weeks.forEach((w, i) => {
    const x = L + 4 + i * step;
    if (prev[i] !== null) svg += `<rect x="${x}" y="${y(prev[i])}" width="${bw}" height="${H - B - y(prev[i])}" fill="#9ca3af" rx="1.5"><title>Salmon ${av.previous_year} W${w}: ${avFmt(prev[i])}</title></rect>`;
    if (cur[i] !== null) svg += `<rect x="${x + bw + 1}" y="${y(cur[i])}" width="${bw}" height="${H - B - y(cur[i])}" fill="${AV_RED}" rx="1.5"><title>Salmon ${av.year} W${w}: ${avFmt(cur[i])}</title></rect>`;
    if (weeks.length <= 26 || w % 2 === 1) svg += `<text x="${x + bw}" y="${H - 8}" font-size="9" text-anchor="middle" fill="#8391a8">${w}</text>`;
  });
  return `<div class="av-legend"><span><i style="background:#9ca3af"></i>Salmon ${av.previous_year}</span><span><i style="background:${AV_RED}"></i>Salmon ${av.year}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Salmon per week">${svg}</svg>`;
}

// "GRAFICOS": total market per year, the products and the salmon chart.
function avGraficos() {
  const weeks = avWeeks();
  const total = avLine("total");
  const head = first => `<thead><tr><th class="yr">Year</th>${first ? `<th class="lbl">${first}</th>` : ""}${weeks.map(w => `<th>${w}</th>`).join("")}</tr></thead>`;
  const totals = [av.year, av.previous_year].map(y => `<tr><td class="yr">${y}</td>${weeks.map(w => `<td>${avFmt(avValue(total.values, y, w))}</td>`).join("")}</tr>`).join("");
  const products = [av.year, av.previous_year].map(y => avProductRows(y).map(([name, get]) =>
    `<tr><td class="yr">${y}</td><td class="lbl">${name}</td>${weeks.map(w => `<td>${avFmt(get(w))}</td>`).join("")}</tr>`).join("")).join("");
  return `<section class="panel"><div class="block-title av-red">GRAFICOS ${av.previous_year}-${av.year}</div>
    <div class="av-scroll"><table class="av-table">${head("")}<tbody>${totals}</tbody></table></div>
    <div class="av-scroll" style="margin-top:10px"><table class="av-table">${head("Product")}<tbody>${products}</tbody></table></div>
    <div class="av-chart" style="margin-top:14px">${avSalmonChart()}</div></section>`;
}

function renderAvianca() {
  if (!av) { avEls.report.innerHTML = ""; return; }
  avEls.report.innerHTML = avYearTable(av.year) + avYearTable(av.previous_year) + avGraficos();
  // Open the tables on the latest weeks, the ones people look at.
  avEls.report.querySelectorAll(".av-scroll").forEach(el => { el.scrollLeft = el.scrollWidth; });
}

async function loadAvianca() {
  const seq = ++avSeq;
  const year = avEls.year.value || "";
  avEls.note.textContent = "Loading the Isidora data…";
  els.status.textContent = "Loading";
  try {
    const params = new URLSearchParams({ email: user().email || "" });
    if (year) params.set("year", year);
    const response = await fetch(`${API_BASE}/api/airline_reports/avianca_market?${params}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== avSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    av = body;
    const thisYear = new Date().getFullYear();
    fillSelect(avEls.year, [thisYear, thisYear - 1].map(y => ({ value: y, label: y })), av.year);
    const weekOptions = Array.from({ length: av.last_week }, (_, i) => av.last_week - i)
      .map(w => ({ value: w, label: `W${w}${w > av.last_closed_week ? " (week still open)" : ""}` }));
    fillSelect(avEls.week, weekOptions, av.last_closed_week || av.last_week);
    avEls.note.textContent = "Isidora, Chile origin, weeks Monday to Sunday, tons. QT (ALL), Carga General and the flights come from another report: type them in and they are saved for everyone.";
    renderAvianca();
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== avSeq) return;
    av = null;
    renderAvianca();
    avEls.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function saveAviancaManual(input) {
  const raw = input.value.trim();
  const value = raw === "" ? null : Number(raw);
  if (value !== null && (!Number.isFinite(value) || value < 0)) { input.classList.add("err"); return; }
  input.classList.remove("saved", "err");
  input.classList.add("saving");
  try {
    const response = await fetch(`${API_BASE}/api/airline_reports/avianca_market/manual?email=${encodeURIComponent(user().email || "")}`, {
      method: "POST",
      headers: { "x-api-key": API_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ line: input.dataset.line, year: Number(input.dataset.year), week: Number(input.dataset.week), value }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || "Could not save");
    const years = (av.manual[input.dataset.line] = av.manual[input.dataset.line] || {});
    const weeks = (years[input.dataset.year] = years[input.dataset.year] || {});
    if (body.value === null) delete weeks[input.dataset.week]; else weeks[input.dataset.week] = body.value;
    input.classList.remove("saving");
    input.classList.add("saved");
  } catch (error) {
    input.classList.remove("saving");
    input.classList.add("err");
    avEls.note.textContent = error.message;
  }
}

function aviancaExportName(extension) {
  return `SeguimientoMercado W${avReportWeek()} ${av.year}.${extension}`;
}

async function exportAviancaExcel() {
  if (!av || !window.ExcelJS) return;
  const book = new ExcelJS.Workbook();
  const sheet = book.addWorksheet(`W${avReportWeek()}`);
  const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
  const weeks = avWeeks();
  const lastWeek = weeks[weeks.length - 1];
  sheet.getColumn(1).width = 7;
  sheet.getColumn(2).width = 22;
  weeks.forEach((_, i) => { sheet.getColumn(i + 3).width = 7; });
  sheet.getColumn(weeks.length + 3).width = 12;
  const header = first => {
    const r = sheet.addRow(["Year", first, ...weeks]);
    r.eachCell(cell => { cell.fill = fill("FFFF0000"); cell.font = { color: { argb: "FFFFFFFF" }, bold: true }; cell.alignment = { horizontal: "center" }; });
  };
  const numbers = r => { for (let i = 3; i <= weeks.length + 2; i++) r.getCell(i).numFmt = "#,##0"; };
  [av.year, av.previous_year].forEach(year => {
    header("Item");
    let section = 0;
    av.lines.forEach(line => {
      if (section && line.section !== section) sheet.addRow([year]);
      section = line.section;
      const flights = year === av.year && av.flight_lines.includes(line.key) ? avValue(av.manual[`flights_${line.key}`], year, lastWeek) : null;
      numbers(sheet.addRow([year, line.label, ...weeks.map(w => avValue(line.values, year, w)), flights === null ? null : `${String(flights).padStart(2, "0")} vuelos`]));
      if (line.key === "tlv") numbers(sheet.addRow([year, "Carga General", ...weeks.map(w => avValue(av.manual.carga_general, year, w))]));
    });
    sheet.addRow([]);
    if (year === av.year) {
      numbers(sheet.addRow(["", "QT (ALL)", ...weeks.map(w => avValue(av.manual.qt, year, w))]));
      sheet.addRow([]);
    }
  });
  sheet.addRow(["", `GRAFICOS ${av.previous_year}-${av.year}`]).font = { bold: true };
  header("");
  const total = avLine("total");
  [av.year, av.previous_year].forEach(y => numbers(sheet.addRow([y, "", ...weeks.map(w => avValue(total.values, y, w))])));
  header("Product");
  [av.year, av.previous_year].forEach(y => avProductRows(y).forEach(([name, get]) => numbers(sheet.addRow([y, name, ...weeks.map(get)]))));
  const buffer = await book.xlsx.writeBuffer();
  downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), aviancaExportName("xlsx"));
}

async function exportAviancaImage() {
  if (!av || !window.html2canvas) return;
  // The image shows every week, not only the part visible on screen.
  avEls.report.classList.add("av-print");
  try {
    const canvas = await html2canvas(avEls.report, { backgroundColor: "#ffffff", scale: 2 });
    canvas.toBlob(blob => downloadBlob(blob, aviancaExportName("png")), "image/png");
  } finally {
    avEls.report.classList.remove("av-print");
  }
}

avEls.year.addEventListener("change", () => { avEls.week.value = ""; loadAvianca(); });
avEls.week.addEventListener("change", renderAvianca);
avEls.report.addEventListener("change", event => { if (event.target.matches("input[data-line]")) saveAviancaManual(event.target); });
document.getElementById("avExcelBtn").addEventListener("click", exportAviancaExcel);
document.getElementById("avImageBtn").addEventListener("click", exportAviancaImage);

function renderAirlines() {
  document.getElementById("airlines").innerHTML = AIRLINES.map(a => `<button class="airline ${a.ready ? "" : "pending"}" type="button" data-airline="${esc(a.code)}">
      <span class="airline-code">${esc(a.code)}</span>
      <span class="airline-name">${esc(a.name)}</span>
      <span class="airline-tag">${a.ready ? "Report ready" : "Format pending"}</span>
    </button>`).join("");
}

// The chosen airline lives in the address (#ET), so the browser's back button works.
function showView() {
  const airline = AIRLINES.find(a => a.ready && a.code === window.location.hash.slice(1));
  document.getElementById("hub").hidden = !!airline;
  document.getElementById("reportView").hidden = !airline;
  document.getElementById("hubNote").textContent = "";
  if (!airline) {
    carrier = null;
    requestSeq++;
    els.status.textContent = "Ready";
    return;
  }
  carrier = airline.code;
  document.getElementById("reportTitle").textContent = `${airline.name} report`;
  // Avianca has its own report (Seguimiento de Mercado), not the flights one.
  const isAvianca = carrier === "AV";
  document.querySelector("#reportView > .panel").hidden = isAvianca;
  els.report.hidden = isAvianca;
  avEls.view.hidden = !isAvianca;
  if (isAvianca) {
    document.getElementById("reportTitle").textContent = "Avianca: Seguimiento de Mercado";
    requestSeq++;
    loadAvianca();
    return;
  }
  els.day.value = "ALL";
  setDefaults();
  reloadWithPrefixReset();
}

function setDefaults() {
  const d = new Date();
  if (PREVIOUS_WEEK[carrier]) {
    // El Al: last week, Monday to Sunday
    d.setDate(d.getDate() - 7 - ((d.getDay() + 6) % 7));
    els.dateFrom.value = iso(d);
    d.setDate(d.getDate() + 6);
    els.dateTo.value = iso(d);
    return;
  }
  const day = iso(d);
  els.dateFrom.value = day;
  els.dateTo.value = day;
}

function reloadWithPrefixReset() {
  hiddenStations = new Set(UNCHECKED_STATIONS[carrier] || []);
  els.prefix.innerHTML = "";
  load();
}

els.prefix.addEventListener("change", load);
els.dateFrom.addEventListener("change", () => {
  if (els.dateTo.value < els.dateFrom.value) els.dateTo.value = els.dateFrom.value;
  load();
});
els.dateTo.addEventListener("change", () => {
  if (els.dateTo.value && els.dateTo.value < els.dateFrom.value) els.dateFrom.value = els.dateTo.value;
  load();
});
els.day.addEventListener("change", renderReport);
els.stations.addEventListener("change", event => {
  const station = event.target.dataset.station;
  if (!station) return;
  if (event.target.checked) hiddenStations.delete(station);
  else hiddenStations.add(station);
  renderReport();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  els.day.value = "ALL";
  setDefaults();
  reloadWithPrefixReset();
});
document.getElementById("airlines").addEventListener("click", event => {
  const card = event.target.closest("[data-airline]");
  if (!card) return;
  const airline = AIRLINES.find(a => a.code === card.dataset.airline);
  if (airline.ready) window.location.hash = airline.code;
  else document.getElementById("hubNote").textContent = `${airline.name}: the report opens once its format is defined.`;
});
document.getElementById("backBtn").addEventListener("click", () => { window.location.hash = ""; });
window.addEventListener("hashchange", showView);
document.getElementById("exportBtn").addEventListener("click", exportExcel);
document.getElementById("csvBtn").addEventListener("click", exportCsv);
document.getElementById("imageBtn").addEventListener("click", exportImage);

async function checkAirlineReportsAccess(initFunction) {
  const u = user();
  const email = u && u.email ? u.email : "";
  if (!email) {
    window.location.href = "https://dataforce.gsaforce.com/";
    return;
  }
  try {
    const response = await fetch(`${API_BASE}/api/user_modules?email=${encodeURIComponent(email)}`, {
      headers: { "x-api-key": API_KEY }
    });
    if (!response.ok) throw new Error("Permission check failed");
    const access = await response.json();
    sessionStorage.setItem("df_permissions", JSON.stringify(access));
    const modules = (access.modules || []).map(m => String(m).toLowerCase().replace(/-/g, "_"));
    if (!modules.includes("airline_reports")) {
      showNoAccess("Your account is signed in, but this module has not been assigned to you.");
      return;
    }
    const label = document.getElementById("userLabel");
    if (label) label.textContent = u.name || email;
    initFunction();
  } catch (e) {
    console.error("Error checking access to airline_reports:", e);
    showNoAccess("We could not verify your access. Please try again or contact an administrator.");
  }
}

renderAirlines();
checkAirlineReportsAccess(showView);
