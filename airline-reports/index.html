      <div class="scl-stack">${prods.map(p => `<i style="width:${p.tons / totalP * 100}%;background:${pColors[p.name] || "#cf6fae"}"><span>${p.tons / totalP > 0.06 ? esc(p.name) : ""}</span></i>`).join("")}</div>
      <div class="scl-pcards">${prods.map(p => `<div class="scl-pcard" style="border-top-color:${pColors[p.name] || "#cf6fae"}"><span>${esc(p.name)}</span><b>${sclT(p.tons)}</b>
        <small>${sclPctTxt(p.share)} del mercado a MIA</small><small class="lbl">Avianca</small><em><b class="t-red">${sclPctTxt(p.avianca_share)}</b> · ${sclT(p.avianca)}</em>
        ${p.detail && p.detail.length ? `<small class="det">${p.detail.map(d => `${esc(d.name)} ${sclN(d.tons)}`).join(" · ")}</small>` : ""}</div>`).join("")}</div></div>
    <div class="scl-card"><div class="scl-kicker">¿Cómo se movieron las 7 grandes salmoneras?</div><h3>${sclTitle("salmon")}</h3>
      <div class="scl-legend"><span><i class="lg-prev"></i>Volumen W${pw}</span><span><i class="lg-now"></i>Volumen W${W}</span></div>
      <div class="scl-salmon">${sal.map(s => {
        const c = sclChg(s.tons, s.tons_prev), up = (s.share ?? 0) > (s.share_prev ?? 0);
        return `<div class="scl-scard"><b>${esc(s.name)}</b><small>${sclN(s.tons_prev)} → ${sclN(s.tons)} t (${sclSigned(c)})</small>
          <div class="scl-vbars"><i class="b-prev" style="height:${s.tons_prev / maxSal * 100}%"></i><i class="b-now" style="height:${s.tons / maxSal * 100}%"></i></div>
          <small class="lbl">Share Avianca</small><em>${sclPctTxt(s.share_prev)} → <b class="${up ? "t-green" : "t-red"}">${sclPctTxt(s.share)} ${up ? "▲" : "▼"}</b></em></div>`;
      }).join("")}</div></div>
    <div class="scl-card"><div class="scl-kicker">Fruta a MIA</div><h3>${sclTitle("fruit")}</h3>
      <div class="scl-three">
        <div><h4>Aerolíneas (prefijo)</h4><small class="sub">Toneladas · % de la fruta a MIA</small>${fr.airlines.map(a => `<div class="scl-lrow"><span class="${a.name === "Avianca" ? "t-red" : ""}">${esc(a.name)} <small>${String(a.prefix ?? "").padStart(3, "0")}</small></span><i style="width:${a.tons / maxFa * 100}%" class="${a.name === "Avianca" ? "red" : ""}"></i><b>${sclT(a.tons)}</b><em>${sclPctTxt(a.share)}</em></div>`).join("")}</div>
        <div><h4>Agencias</h4><small class="sub">Toneladas de fruta · share Avianca</small>${fr.agents.map(a => `<div class="scl-lrow"><span>${esc(a.name)}</span><i class="soft" style="width:${a.tons / maxFg * 100}%"></i><b>${sclT(a.tons)}</b><em class="${a.avianca_share ? "t-red" : ""}">${a.avianca_share ? sclPctTxt(a.avianca_share) : "0%"}</em></div>`).join("")}</div>
        <div><h4>Avianca: fruta por agencia</h4><small class="sub">Toneladas con Avianca · % de su fruta que va con Avianca</small>${fr.avianca_agents.map((a, i) => `<div class="scl-lrow"><span class="${i === 0 ? "t-green" : ""}">${esc(a.name)}</span><i style="width:${a.tons / maxFv * 100}%" class="${i === 0 ? "green" : "red"}"></i><b>${sclT(a.tons)}</b><em class="${i === 0 ? "t-green" : "t-red"}">${sclPctTxt(a.pct)}</em></div>`).join("")}</div>
      </div></div>
  </section>`;
}

function sclMarket(key, label) {
  const m = scl[key], pw = scl.prev_week;
  const c = sclChg(m.market, m.market_prev);
  const hasAv = key !== "asia";
  const head = hasAv
    ? `Mercado ${sclSigned(c)} (${sclN(m.market_prev)} → ${sclN(m.market)} t) · Avianca ${sclN(m.avianca_prev)} → ${sclN(m.avianca)} t, share ${sclPctTxt(m.share_prev)} → <b class="t-red">${sclPctTxt(m.share)}</b>`
    : `Mercado ${sclSigned(c)} (${sclN(m.market_prev)} → ${sclN(m.market)} t)${m.products[0] ? ` impulsado por ${{ Pescado: "el salmón", Fruta: "la fruta", Otros: "la carga seca" }[m.products[0].name]}` : ""}`;
  const maxS = Math.max(1, ...m.airlines.map(a => a.share || 0)), maxA = Math.max(1, ...m.agents.map(a => a.tons));
  return `<div class="scl-card scl-mk"><div class="scl-mkhead"><h2>${label}</h2><p>${head}</p></div>
    ${sclChart(m.series, { height: 200, share: hasAv })}
    <div class="scl-three mk">
      <div><div class="scl-kicker">Productos</div><div class="scl-mini">${m.products.map(p => { const pc = sclChg(p.tons, p.tons_prev); return `<div><span>${esc(p.name)}</span><b>${sclT(p.tons)}</b><small>W${pw}: ${sclT(p.tons_prev)} · <i class="${pc < 0 ? "t-red" : "t-green"}">${sclSigned(pc)}</i></small></div>`; }).join("")}</div></div>
      <div><div class="scl-kicker">Aerolíneas · market share</div>${m.airlines.map(a => `<div class="scl-lrow"><span class="${a.name === "Avianca" ? "t-red" : ""}">${esc(a.name)} <small>${String(a.prefix ?? "").padStart(3, "0")}</small></span><i class="${a.name === "Avianca" ? "red" : "soft"}" style="width:${(a.share || 0) / maxS * 100}%"></i><b>${sclPctTxt(a.share)}</b><em>W${pw}: ${a.share_prev ? sclPctTxt(a.share_prev) : "–"}</em></div>`).join("")}</div>
      <div><div class="scl-kicker">Agentes · toneladas</div>${m.agents.map(a => `<div class="scl-lrow"><span>${esc(a.name)}</span><i style="width:${a.tons / maxA * 100}%"></i><b>${sclT(a.tons)}</b><em>W${pw}: ${a.tons_prev ? sclT(a.tons_prev) : "–"}</em></div>`).join("")}</div>
    </div></div>`;
}

function sclPage2() {
  return `<section class="scl-page">${sclHeader(`Otros mercados · Semana ${scl.week}`)}
    <h2 class="scl-main">${sclTitle("others")}</h2>
    ${sclMarket("bog", "SCL–BOG")}${sclMarket("jfk", "SCL–JFK")}${sclMarket("asia", "SCL–ASIA")}
  </section>`;
}

function renderScl() {
  if (!scl) { sclEls.report.innerHTML = ""; return; }
  sclEls.report.innerHTML = sclPage1() + sclPage2();
}

async function loadScl(year, week) {
  const seq = ++sclSeq;
  sclEls.note.textContent = "Loading the Isidora data…";
  els.status.textContent = "Loading";
  try {
    const params = new URLSearchParams({ email: user().email || "" });
    if (year && week) { params.set("year", year); params.set("week", week); }
    const response = await fetch(`${API_BASE}/api/airline_reports/avianca_scl?${params}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== sclSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    scl = body;
    sclEls.context.value = scl.context || "";
    const wk = (scl.weeks || []).map(x => { const d = parseDay(x.start); return { value: `${x.year}-${x.week}`, label: `W${x.week} ${x.year} · ${d.getDate()} ${SCL_MONTHS[d.getMonth()].slice(0, 3)}` }; });
    if (!wk.some(o => o.value === `${scl.year}-${scl.week}`)) wk.unshift({ value: `${scl.year}-${scl.week}`, label: `W${scl.week} ${scl.year}` });
    fillSelect(sclEls.week, wk, `${scl.year}-${scl.week}`);
    sclEls.note.textContent = "Isidora export, Chile origin, Monday to Sunday, tons. Headlines are written from the data: click any of them to edit it before exporting.";
    renderScl();
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== sclSeq) return;
    scl = null;
    renderScl();
    sclEls.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function saveSclNotes(resetTitles = false) {
  if (!scl) return;
  if (resetTitles) scl.titles_edited = {};
  try {
    const response = await fetch(`${API_BASE}/api/airline_reports/avianca_scl/notes?email=${encodeURIComponent(user().email || "")}`, {
      method: "POST", headers: { "x-api-key": API_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ year: scl.year, week: scl.week, context: sclEls.context.value, titles: scl.titles_edited || {} }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || "Could not save");
    await loadScl(scl.year, scl.week);
    sclEls.note.textContent = resetTitles ? "Headlines back to the ones written from the data." : "Saved: context and headlines are kept for this week.";
  } catch (error) {
    sclEls.note.textContent = error.message;
  }
}

async function exportSclPdf() {
  if (!scl || !window.jspdf || !window.html2canvas) return;
  sclEls.note.textContent = "Building the PDF…";
  const pages = [...sclEls.report.querySelectorAll(".scl-page")];
  sclEls.report.classList.add("scl-printing");
  try {
    let doc = null;
    for (const page of pages) {
      const canvas = await html2canvas(page, { backgroundColor: "#140d11", scale: 2, useCORS: true, windowWidth: 1240 });
      const w = canvas.width / 2, h = canvas.height / 2;
      if (!doc) doc = new window.jspdf.jsPDF({ orientation: "portrait", unit: "px", format: [w, h], hotfixes: ["px_scaling"] });
      else doc.addPage([w, h], "portrait");
      doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, w, h);
    }
    doc.save(`Mercado_SCL_W${scl.week}.pdf`);
    sclEls.note.textContent = "PDF ready.";
  } finally {
    sclEls.report.classList.remove("scl-printing");
  }
}

sclEls.week.addEventListener("change", () => { const [y, w] = sclEls.week.value.split("-").map(Number); loadScl(y, w); });
document.getElementById("sclSaveBtn").addEventListener("click", () => saveSclNotes(false));
document.getElementById("sclResetBtn").addEventListener("click", () => saveSclNotes(true));
document.getElementById("sclPdfBtn").addEventListener("click", exportSclPdf);
sclEls.report.addEventListener("input", e => {
  const t = e.target.closest("[data-title]");
  if (t && scl) { scl.titles_edited = { ...(scl.titles_edited || {}), [t.dataset.title]: t.textContent.trim() }; sclEls.note.textContent = "Headline edited: click Save to keep it for this week."; }
});
sclEls.report.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.closest("[data-title]")) { e.preventDefault(); e.target.blur(); } });

function setAvMode(mode) {
  document.querySelectorAll("#avTabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  const isScl = mode === "scl";
  avEls.view.hidden = isScl;
  sclEls.view.hidden = !isScl;
  document.getElementById("reportTitle").textContent = isScl ? "Avianca: Mercado SCL" : "Avianca: Seguimiento de Mercado";
  if (isScl && !scl) loadScl();
  if (!isScl && !av) loadAvianca();
}
document.getElementById("avTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (!b) return;
  history.replaceState(null, "", b.dataset.mode === "scl" ? "#AV/SCL" : "#AV");
  setAvMode(b.dataset.mode);
});

// ---------------------------------------------------------------------------
// Avianca: Seguimiento de Mercado (19 nov, cony). The weekly report that is
// sent to Avianca, with the same content as the Excel/PDF built by hand: one
// table per year (lines x weeks) and the "GRAFICOS" part. It is a report, not
// an analysis. Data from the Isidora table (Chile origin, ISO weeks, tons);
// QT, general cargo and the flights of some carriers come from another
// report, so they are typed in here each week and saved for everyone.
// ---------------------------------------------------------------------------
const AV_RED = "#da291c";
let av = null;
let avSeq = 0;
const avEls = {
  view: document.getElementById("aviancaView"),
  year: document.getElementById("avYear"),
  week: document.getElementById("avWeek"),
  note: document.getElementById("avNote"),
  report: document.getElementById("avReport"),
};

function avLine(key) {
  return av.lines.find(l => l.key === key);
}

function avValue(values, year, week) {
  const v = ((values || {})[String(year)] || {})[String(week)];
  return v === undefined || v === null || v === "" ? null : Number(v);
}

// The report goes up to the chosen week (by default the last closed one, like "SeguimientoMercado W45").
function avReportWeek() {
  return av ? Number(avEls.week.value) || av.last_closed_week || av.last_week : 0;
}

function avWeeks() {
  return Array.from({ length: avReportWeek() }, (_, i) => i + 1);
}

function avFmt(v) {
  return v === null ? "" : Math.round(v).toLocaleString("es-CL");
}

// A number cell: blank shows "–", the report week is highlighted.
function avCell(v, week) {
  const cls = [week === avReportWeek() ? "now" : "", v === null ? "nil" : ""].filter(Boolean).join(" ");
  return `<td${cls ? ` class="${cls}"` : ""}>${v === null ? "–" : avFmt(v)}</td>`;
}

const AV_SECTIONS = { 1: ["Mercado", "#a3197e"], 2: ["Aerolíneas y MIA", "#d0123c"], 3: ["Asia", "#7c3a8f"], 4: ["Tel Aviv y carga general", "#b4547f"] };

function avDocHead(subtitle) {
  return `<header class="avdoc-head"><div><h2>Seguimiento de Mercado · W${avReportWeek()} ${av.year}</h2><p>${esc(subtitle)}</p></div>
    <div class="logos"><img src="img/avianca-cargo.png" alt="Avianca Cargo"><span></span><img src="img/gsa-force.png" alt="GSA Force"></div></header>`;
}

// 19 nov, cony: only the report week is typed in; the weeks before show what
// was already entered (the history came from the W45 PDF).
function avManualInput(key, year, week, value, label) {
  if (year !== av.year || week !== avReportWeek()) return avFmt(value);
  return `<input type="number" min="0" step="1" data-line="${esc(key)}" data-year="${year}" data-week="${week}" value="${value === null ? "" : value}" aria-label="${esc(label)} week ${week}">`;
}

// One table per year, the same rows and order as the Excel, with named sections.
function avYearTable(year) {
  const weeks = avWeeks();
  const lastWeek = weeks[weeks.length - 1];
  const cols = weeks.length + 3;
  const head = `<thead><tr><th class="yr">Year</th><th class="lbl">Item</th>${weeks.map(w => `<th class="${w === lastWeek ? "now" : ""}">${w}</th>`).join("")}<th class="fl">${year === av.year ? `Vuelos W${lastWeek}` : ""}</th></tr></thead>`;
  let body = "", section = 0;
  const sec = n => { const [name, color] = AV_SECTIONS[n] || ["", "#a3197e"]; return `<tr class="sec" style="--sec:${color}"><td class="yr"></td><td class="lbl">${esc(name)}</td><td colspan="${cols - 2}"></td></tr>`; };
  av.lines.forEach(line => {
    if (line.section !== section) { section = line.section; body += sec(section); }
    const color = (AV_SECTIONS[line.section] || [])[1] || "#a3197e";
    let flights = "";
    if (year === av.year && av.flight_lines.includes(line.key)) {
      const v = avValue(av.manual[`flights_${line.key}`], year, lastWeek);
      const input = avManualInput(`flights_${line.key}`, year, lastWeek, v, `${line.label} flights`);
      flights = input.startsWith("<input") ? `${input} vuelos` : (v === null ? "" : `<span class="chip">${String(v).padStart(2, "0")} vuelos</span>`);
    }
    body += `<tr class="row" style="--sec:${color}"><td class="yr">${year}</td><td class="lbl">${esc(line.label)}</td>${weeks.map(w => avCell(avValue(line.values, year, w), w)).join("")}<td class="fl">${flights}</td></tr>`;
    if (line.key === "tlv") {
      body += `<tr class="row" style="--sec:${color}"><td class="yr">${year}</td><td class="lbl">Carga General</td>${weeks.map(w => {
        const v = avValue(av.manual.carga_general, year, w);
        const html = avManualInput("carga_general", year, w, v, "Carga General");
        return html.startsWith("<input") ? `<td class="now">${html}</td>` : avCell(v, w);
      }).join("")}<td class="fl"></td></tr>`;
    }
  });
  if (year === av.year) {
    body += `<tr class="sec" style="--sec:#2a1620"><td class="yr"></td><td class="lbl">QT</td><td colspan="${cols - 2}"></td></tr>`;
    body += `<tr class="row qt" style="--sec:#2a1620"><td class="yr"></td><td class="lbl">QT (ALL)</td>${weeks.map(w => {
      const v = avValue(av.manual.qt, year, w);
      const html = avManualInput("qt", year, w, v, "QT (ALL)");
      return html.startsWith("<input") ? `<td class="now">${html}</td>` : avCell(v, w);
    }).join("")}<td class="fl"></td></tr>`;
  }
  const isCur = year === av.year;
  return `<section class="avdoc-sec"><div class="avdoc-title"><h3>${year}</h3><span>Toneladas por semana · weeks 1 to ${lastWeek}</span>${isCur ? `<span class="tag">W${lastWeek} highlighted</span>` : ""}</div>
    <div class="av-scroll"><table class="av-table">${head}<tbody>${body}</tbody></table></div></section>`;
}

function avProductRows(year) {
  const total = avLine("total"), salmon = avLine("salmon"), fruit = avLine("fruit");
  const otros = w => {
    const t = avValue(total.values, year, w);
    return t === null ? null : t - (avValue(salmon.values, year, w) || 0) - (avValue(fruit.values, year, w) || 0);
  };
  return [["Salmon", w => avValue(salmon.values, year, w)], ["Fruit", w => avValue(fruit.values, year, w)], ["Otros", otros]];
}

function avSalmonChart() {
  const weeks = avWeeks();
  const salmon = avLine("salmon");
  const cur = weeks.map(w => avValue(salmon.values, av.year, w)), prev = weeks.map(w => avValue(salmon.values, av.previous_year, w));
  const max = Math.max(1, ...cur.concat(prev).map(v => v || 0));
  const top = Math.ceil(max / 1000) * 1000;
  const W = 1100, H = 280, L = 52, B = 30, T = 16, step = (W - L - 8) / Math.max(1, weeks.length), bw = Math.max(2, step / 2 - 2);
  const y = v => T + (H - T - B) * (1 - (v || 0) / top);
  let svg = "";
  for (let t = 0; t <= top; t += 1000) svg += `<line x1="${L}" x2="${W - 4}" y1="${y(t)}" y2="${y(t)}" stroke="#f1e7ec" ${t ? 'stroke-dasharray="3 4"' : ""}/><text x="${L - 8}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#9b8590" font-family="DM Sans,sans-serif">${t.toLocaleString("es-CL")}</text>`;
  weeks.forEach((w, i) => {
    const x = L + 4 + i * step;
    if (prev[i] !== null) svg += `<rect x="${x}" y="${y(prev[i])}" width="${bw}" height="${H - B - y(prev[i])}" fill="#dcc3cf" rx="2"><title>Salmon ${av.previous_year} W${w}: ${avFmt(prev[i])} t</title></rect>`;
    if (cur[i] !== null) svg += `<rect x="${x + bw + 1.5}" y="${y(cur[i])}" width="${bw}" height="${H - B - y(cur[i])}" fill="${w === avReportWeek() ? "#e30613" : "#a3197e"}" rx="2"><title>Salmon ${av.year} W${w}: ${avFmt(cur[i])} t</title></rect>`;
    if (weeks.length <= 26 || w % 2 === 1 || w === avReportWeek()) svg += `<text x="${x + bw}" y="${H - 10}" font-size="10" text-anchor="middle" fill="${w === avReportWeek() ? "#a3197e" : "#9b8590"}" font-weight="${w === avReportWeek() ? 700 : 400}" font-family="DM Sans,sans-serif">${w}</text>`;
  });
  const last = cur[cur.length - 1];
  return `<div class="av-legend"><span><i style="background:#dcc3cf"></i>Salmon ${av.previous_year}</span><span><i style="background:#a3197e"></i>Salmon ${av.year}</span>${last !== null ? `<span style="margin-left:auto;color:#a3197e;font-weight:700">W${avReportWeek()}: ${avFmt(last)} t</span>` : ""}</div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Salmon per week">${svg}</svg>`;
}

// "GRAFICOS": total market per year, the products and the salmon chart.
function avGraficos() {
  const weeks = avWeeks();
  const lastWeek = weeks[weeks.length - 1];
  const total = avLine("total");
  const head = first => `<thead><tr><th class="yr">Year</th><th class="lbl">${first}</th>${weeks.map(w => `<th class="${w === lastWeek ? "now" : ""}">${w}</th>`).join("")}</tr></thead>`;
  const colors = { Salmon: "#a3197e", Fruit: "#d0123c", Otros: "#7c3a8f" };
  const totals = [av.year, av.previous_year].map(y => `<tr class="row" style="--sec:${y === av.year ? "#a3197e" : "#dcc3cf"}"><td class="yr">${y}</td><td class="lbl">Total Mercado</td>${weeks.map(w => avCell(avValue(total.values, y, w), w)).join("")}</tr>`).join("");
  const products = [av.year, av.previous_year].map(y => avProductRows(y).map(([name, get]) =>
    `<tr class="row" style="--sec:${colors[name]}"><td class="yr">${y}</td><td class="lbl">${name}</td>${weeks.map(w => avCell(get(w), w)).join("")}</tr>`).join("")).join("");
  return `<section class="avdoc-sec"><div class="avdoc-title"><h3>Gráficos ${av.previous_year}–${av.year}</h3><span>Total del mercado y productos por semana</span></div>
    <div class="av-scroll"><table class="av-table">${head("Item")}<tbody>${totals}</tbody></table></div>
    <div class="av-scroll" style="margin-top:12px"><table class="av-table">${head("Product")}<tbody>${products}</tbody></table></div>
    <div class="av-chart" style="margin:18px 0 10px">${avSalmonChart()}</div></section>`;
}

function renderAvianca() {
  if (!av) { avEls.report.innerHTML = ""; return; }
  avEls.report.innerHTML = `<div class="avdoc">${avDocHead("Mercado de exportación Chile · toneladas por semana · Isidora")}${avYearTable(av.year)}${avYearTable(av.previous_year)}${avGraficos()}</div>`;
  // Open the tables on the latest weeks, the ones people look at.
  avEls.report.querySelectorAll(".av-scroll").forEach(el => { el.scrollLeft = el.scrollWidth; });
}

async function loadAvianca() {
  const seq = ++avSeq;
  const year = avEls.year.value || "";
  avEls.note.textContent = "Loading the Isidora data…";
  els.status.textContent = "Loading";
  try {
    const params = new URLSearchParams({ email: user().email || "" });
    if (year) params.set("year", year);
    const response = await fetch(`${API_BASE}/api/airline_reports/avianca_market?${params}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== avSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    av = body;
    const thisYear = new Date().getFullYear();
    fillSelect(avEls.year, [thisYear, thisYear - 1].map(y => ({ value: y, label: y })), av.year);
    const weekOptions = Array.from({ length: av.last_week }, (_, i) => av.last_week - i)
      .map(w => ({ value: w, label: `W${w}${w > av.last_closed_week ? " (week still open)" : ""}` }));
    fillSelect(avEls.week, weekOptions, av.last_closed_week || av.last_week);
    avEls.note.textContent = "Isidora, Chile origin, weeks Monday to Sunday, tons. QT (ALL), Carga General and the flights come from another report: type them in and they are saved for everyone.";
    renderAvianca();
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== avSeq) return;
    av = null;
    renderAvianca();
    avEls.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function saveAviancaManual(input) {
  const raw = input.value.trim();
  const value = raw === "" ? null : Number(raw);
  if (value !== null && (!Number.isFinite(value) || value < 0)) { input.classList.add("err"); return; }
  input.classList.remove("saved", "err");
  input.classList.add("saving");
  try {
    const response = await fetch(`${API_BASE}/api/airline_reports/avianca_market/manual?email=${encodeURIComponent(user().email || "")}`, {
      method: "POST",
      headers: { "x-api-key": API_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ line: input.dataset.line, year: Number(input.dataset.year), week: Number(input.dataset.week), value }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || "Could not save");
    const years = (av.manual[input.dataset.line] = av.manual[input.dataset.line] || {});
    const weeks = (years[input.dataset.year] = years[input.dataset.year] || {});
    if (body.value === null) delete weeks[input.dataset.week]; else weeks[input.dataset.week] = body.value;
    input.classList.remove("saving");
    input.classList.add("saved");
  } catch (error) {
    input.classList.remove("saving");
    input.classList.add("err");
    avEls.note.textContent = error.message;
  }
}

function aviancaExportName(extension) {
  return `SeguimientoMercado W${avReportWeek()} ${av.year}.${extension}`;
}

async function exportAviancaExcel() {
  if (!av || !window.ExcelJS) return;
  const book = new ExcelJS.Workbook();
  const sheet = book.addWorksheet(`W${avReportWeek()}`);
  const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
  const weeks = avWeeks();
  const lastWeek = weeks[weeks.length - 1];
  sheet.getColumn(1).width = 7;
  sheet.getColumn(2).width = 22;
  weeks.forEach((_, i) => { sheet.getColumn(i + 3).width = 7; });
  sheet.getColumn(weeks.length + 3).width = 12;
  const header = first => {
    const r = sheet.addRow(["Year", first, ...weeks]);
    r.eachCell(cell => { cell.fill = fill("FFFF0000"); cell.font = { color: { argb: "FFFFFFFF" }, bold: true }; cell.alignment = { horizontal: "center" }; });
  };
  const numbers = r => { for (let i = 3; i <= weeks.length + 2; i++) r.getCell(i).numFmt = "#,##0"; };
  [av.year, av.previous_year].forEach(year => {
    header("Item");
    let section = 0;
    av.lines.forEach(line => {
      if (section && line.section !== section) sheet.addRow([year]);
      section = line.section;
      const flights = year === av.year && av.flight_lines.includes(line.key) ? avValue(av.manual[`flights_${line.key}`], year, lastWeek) : null;
      numbers(sheet.addRow([year, line.label, ...weeks.map(w => avValue(line.values, year, w)), flights === null ? null : `${String(flights).padStart(2, "0")} vuelos`]));
      if (line.key === "tlv") numbers(sheet.addRow([year, "Carga General", ...weeks.map(w => avValue(av.manual.carga_general, year, w))]));
    });
    sheet.addRow([]);
    if (year === av.year) {
      numbers(sheet.addRow(["", "QT (ALL)", ...weeks.map(w => avValue(av.manual.qt, year, w))]));
      sheet.addRow([]);
    }
  });
  sheet.addRow(["", `GRAFICOS ${av.previous_year}-${av.year}`]).font = { bold: true };
  header("");
  const total = avLine("total");
  [av.year, av.previous_year].forEach(y => numbers(sheet.addRow([y, "", ...weeks.map(w => avValue(total.values, y, w))])));
  header("Product");
  [av.year, av.previous_year].forEach(y => avProductRows(y).forEach(([name, get]) => numbers(sheet.addRow([y, name, ...weeks.map(get)]))));
  const buffer = await book.xlsx.writeBuffer();
  downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), aviancaExportName("xlsx"));
}

// 19 nov, cony: "Export PDF" instead of the screenshot. The PDF is built as a
// report (A3 landscape, one table per page, red headers, the salmon chart
// drawn in the PDF), with the same content as the Excel/PDF sent to Avianca.
function avPdfYearRows(year) {
  const weeks = avWeeks();
  const lastWeek = weeks[weeks.length - 1];
  const rows = [];
  let section = 0;
  av.lines.forEach(line => {
    if (line.section !== section) { section = line.section; rows.push({ section: (AV_SECTIONS[section] || [""])[0], color: (AV_SECTIONS[section] || [])[1] }); }
    const flights = year === av.year && av.flight_lines.includes(line.key) ? avValue(av.manual[`flights_${line.key}`], year, lastWeek) : null;
    rows.push({ color: (AV_SECTIONS[line.section] || [])[1], cells: [String(year), line.label, ...weeks.map(w => avPdfNum(avValue(line.values, year, w))), flights === null ? "" : `${String(flights).padStart(2, "0")} vuelos`] });
    if (line.key === "tlv") rows.push({ color: (AV_SECTIONS[line.section] || [])[1], cells: [String(year), "Carga General", ...weeks.map(w => avPdfNum(avValue(av.manual.carga_general, year, w))), ""] });
  });
  if (year === av.year) {
    rows.push({ section: "QT", color: "#2a1620" });
    rows.push({ bold: true, color: "#2a1620", cells: ["", "QT (ALL)", ...weeks.map(w => avPdfNum(avValue(av.manual.qt, year, w))), ""] });
  }
  return rows;
}

function avPdfNum(v) { return v === null ? "–" : avFmt(v); }
function avRgb(hex) { const n = parseInt(hex.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function avPdfTable(doc, startY, head, rows, withFlights) {
  const weeks = avWeeks();
  const nowCol = weeks.length + 1;  // the report week column
  const pageWidth = doc.internal.pageSize.getWidth();
  const usable = pageWidth - 20 - 11 - 33 - (withFlights ? 17 : 0);
  const weekWidth = usable / Math.max(1, weeks.length);
  const columnStyles = { 0: { cellWidth: 11, halign: "left", textColor: [155, 133, 144] }, 1: { cellWidth: 33, halign: "left", fontStyle: "bold" } };
  weeks.forEach((_, i) => { columnStyles[i + 2] = { cellWidth: weekWidth, halign: "right" }; });
  if (withFlights) columnStyles[weeks.length + 2] = { cellWidth: 17, halign: "left", textColor: [163, 25, 126], fontStyle: "bold" };
  let zebra = 0;
  doc.autoTable({
    startY,
    head: [head],
    body: rows.map(r => r.section !== undefined ? [r.section, ...head.slice(1).map(() => "")] : r.cells),
    margin: { left: 10, right: 10 },
    theme: "plain",
    styles: { font: "helvetica", fontSize: weeks.length > 40 ? 6.8 : 7.6, cellPadding: { top: 2.1, bottom: 2.1, left: 0.8, right: 0.8 }, textColor: [43, 32, 38], lineColor: [244, 236, 240], lineWidth: { bottom: 0.15 } },
    headStyles: { fillColor: [42, 22, 32], textColor: [243, 230, 236], fontStyle: "bold", halign: "right" },
    columnStyles,
    didParseCell: data => {
      if (data.section === "head") {
        if (data.column.index < 2) data.cell.styles.halign = "left";
        if (data.column.index === nowCol) data.cell.styles.fillColor = [163, 25, 126];
        return;
      }
      const row = rows[data.row.index];
      if (row.section !== undefined) {
        data.cell.styles.fillColor = [253, 246, 249];
        data.cell.styles.textColor = avRgb(row.color || "#a3197e");
        data.cell.styles.fontStyle = "bold";
        data.cell.styles.fontSize = 6.6;
        if (data.column.index === 0) { data.cell.colSpan = head.length; data.cell.text = [String(row.section).toUpperCase()]; }
        return;
      }
      if (data.column.index === 0) zebra = data.row.index;
      if (row.bold) data.cell.styles.fontStyle = "bold";
      if (data.cell.raw === "–") data.cell.styles.textColor = [203, 188, 196];
      if (data.column.index === nowCol) { data.cell.styles.fillColor = [251, 238, 245]; data.cell.styles.textColor = [122, 18, 82]; data.cell.styles.fontStyle = "bold"; }
      else if (data.row.index % 2 === 1) data.cell.styles.fillColor = [252, 249, 251];
    },
    didDrawCell: data => {
      const row = rows[data.row.index];
      if (data.section === "body" && data.column.index === 1 && row && row.section === undefined) {
        doc.setFillColor(...avRgb(row.color || "#a3197e"));
        doc.rect(data.cell.x, data.cell.y + 0.6, 0.8, data.cell.height - 1.2, "F");
      }
    },
  });
  return doc.lastAutoTable.finalY;
}

const avPdfImages = {};
async function avPdfLoadImages() {
  for (const [key, src] of [["av", "img/avianca-cargo.png"], ["gsa", "img/gsa-force.png"]]) {
    if (avPdfImages[key]) continue;
    try {
      const blob = await (await fetch(src)).blob();
      if (!blob.type.startsWith("image/")) throw new Error("not an image");
      avPdfImages[key] = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
    } catch (_) { avPdfImages[key] = null; }
  }
}

function avPdfHeader(doc, subtitle) {
  const w = doc.internal.pageSize.getWidth();
  // red -> magenta band, like the Avianca reports
  const from = [227, 6, 19], to = [163, 25, 126], steps = 60;
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    doc.setFillColor(...from.map((c, k) => Math.round(c + (to[k] - c) * t)));
    doc.rect(w * i / steps, 0, w / steps + 0.4, 22, "F");
  }
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(17);
  doc.text(`Seguimiento de Mercado · W${avReportWeek()} ${av.year}`, 12, 11.5);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(9.5);
  doc.text(subtitle, 12, 17.5);
  if (avPdfImages.av) doc.addImage(avPdfImages.av, "PNG", w - 66, 3.5, 22.5, 15.3);
  if (avPdfImages.gsa) doc.addImage(avPdfImages.gsa, "PNG", w - 34, 4, 22, 14.6);
  doc.setDrawColor(255, 255, 255); doc.setLineWidth(0.2); doc.line(w - 39, 5, w - 39, 17);
  return 30;
}

function avPdfSectionTitle(doc, y, title, sub) {
  doc.setTextColor(29, 20, 24);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(13);
  doc.text(title, 10, y);
  if (sub) {
    const x = 10 + doc.getTextWidth(title) + 4;
    doc.setFont("helvetica", "normal");
    doc.setFontSize(8.5);
    doc.setTextColor(138, 116, 128);
    doc.text(sub, x, y);
  }
  return y + 4;
}

function avPdfSalmonChart(doc, x, y, width, height) {
  const weeks = avWeeks();
  const salmon = avLine("salmon");
  const cur = weeks.map(w => avValue(salmon.values, av.year, w)), prev = weeks.map(w => avValue(salmon.values, av.previous_year, w));
  const max = Math.max(1, ...cur.concat(prev).map(v => v || 0));
  const top = Math.ceil(max / 1000) * 1000;
  const L = 14, B = 8;
  const plotW = width - L, plotH = height - B - 8;
  const yOf = v => y + 8 + plotH * (1 - (v || 0) / top);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9);
  doc.setTextColor(15, 23, 42);
  doc.text("Salmon per week (tons)", x, y + 3);
  doc.setFont("helvetica", "normal");
  doc.setFontSize(7.5);
  [[av.previous_year, [220, 195, 207]], [av.year, [163, 25, 126]]].forEach(([label, color], i) => {
    const lx = x + width - 46 + i * 23;
    doc.setFillColor(...color);
    doc.rect(lx, y, 3, 3, "F");
    doc.setTextColor(65, 83, 108);
    doc.text(`Salmon ${label}`, lx + 4.5, y + 2.6);
  });
  for (let t = 0; t <= top; t += 1000) {
    doc.setDrawColor(238, 241, 246);
    doc.setLineWidth(0.2);
    doc.line(x + L, yOf(t), x + width, yOf(t));
    doc.setTextColor(131, 145, 168);
    doc.setFontSize(6.5);
    doc.text(t.toLocaleString("en-US"), x + L - 2, yOf(t) + 1, { align: "right" });
  }
  const step = plotW / Math.max(1, weeks.length);
  const bw = Math.max(0.6, step / 2 - 0.5);
  weeks.forEach((w, i) => {
    const bx = x + L + i * step + 0.4;
    if (prev[i] !== null) { doc.setFillColor(220, 195, 207); doc.rect(bx, yOf(prev[i]), bw, yOf(0) - yOf(prev[i]), "F"); }
    if (cur[i] !== null) { doc.setFillColor(...(w === avReportWeek() ? [227, 6, 19] : [163, 25, 126])); doc.rect(bx + bw + 0.3, yOf(cur[i]), bw, yOf(0) - yOf(cur[i]), "F"); }
    doc.setTextColor(131, 145, 168);
    doc.setFontSize(6);
    doc.text(String(w), bx + bw, yOf(0) + 4, { align: "center" });
  });
}

function avPdfFooters(doc) {
  const pages = doc.getNumberOfPages();
  const w = doc.internal.pageSize.getWidth(), h = doc.internal.pageSize.getHeight();
  const made = new Date().toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  for (let p = 1; p <= pages; p++) {
    doc.setPage(p);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    doc.setTextColor(131, 145, 168);
    doc.text(`Source: Isidora, Chile origin, weeks Monday to Sunday, tons. QT (ALL), Carga General and flights from another report.  ·  DATAFORCE · ${made}`, 10, h - 6);
    doc.text(`${p} / ${pages}`, w - 10, h - 6, { align: "right" });
  }
}

  const totalRows = [av.year, av.previous_year].map(yr => ({ color: yr === av.year ? "#a3197e" : "#dcc3cf", cells: [String(yr), "Total Mercado", ...weeks.map(w => avPdfNum(avValue(total.values, yr, w)))] }));
  y = avPdfTable(doc, y, head("Year", "Item"), totalRows, false) + 6;

  y = avPdfTable(doc, y, head("Year", "Product"), productRows, false) + 8;
  const pageH = doc.internal.pageSize.getHeight(), pageW = doc.internal.pageSize.getWidth();
  avPdfSalmonChart(doc, 10, y, pageW - 20, Math.min(120, pageH - y - 14));
  avPdfFooters(doc);
  doc.save(aviancaExportName("pdf"));

// ---------------------------------------------------------------------------
// UPS Weekly Report (23 nov, cony). The report that is sent every Monday or
// Tuesday and used in the weekly meeting, with the same content as the Excel
// it was made in (5X Mexico: GDL, NLU, MTY, QRO; 5X Puerto Rico: SJU), in a
// new design. The API sends the AWB segments (no 502, ISO weeks, chargeable
// kilos, segment cost as sales, customer short names); the tables are built
// here.
// ---------------------------------------------------------------------------
let ups = null;
// 24 nov, cony: a selector to see Mexico + PR (the weekly report), Mexico,
// Puerto Rico or Chile. The PDF and the Excel export what is on screen.
const UPS_REGIONS = [
  { key: "MX", label: "Mexico", name: "5X Mexico", origins: () => ups.mexico || [], order: ["des", "customer"], perOrigin: true },
  { key: "PR", label: "Puerto Rico", name: "5X Puerto Rico", origins: () => ups.puerto_rico || [], order: ["customer", "des"], perOrigin: false },
  { key: "CL", label: "Chile", name: "5X Chile", origins: () => ups.chile || [], order: ["des", "customer"], perOrigin: true },
];
let upsRegion = "ALL";
// "Mexico + PR" is the weekly report as it always was; Chile is only seen on its own.
function upsShownRegions() { return UPS_REGIONS.filter(r => upsRegion === "ALL" ? r.key !== "CL" : r.key === upsRegion); }
function upsFileName(ext) {
  const reg = upsRegion === "ALL" ? "" : `_${UPS_REGIONS.find(r => r.key === upsRegion).label.replace(/ /g, "_")}`;
  return `UPS_Weekly_Report${reg}_W${ups.week}_${ups.year}.${ext}`;
}
let upsSeq = 0;
const upsEls = {
  view: document.getElementById("upsView"),
  week: document.getElementById("upsWeek"),
  note: document.getElementById("upsNote"),
  report: document.getElementById("upsReport"),
};
const UPS_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

function upsN(v, dec = 0) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  return Number(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function upsT(kg) { return upsN(kg / 1000, 2); }
function upsMoney(v) { return `$${upsN(v)}`; }
function upsPerKg(sales, kg) { return kg ? `$${upsN(sales / kg, 2)}` : "–"; }
function upsSum(rows, f = "kg") { return rows.reduce((a, r) => a + (r[f] || 0), 0); }
function upsAwbs(rows) { return new Set(rows.map(r => r.awb)).size; }
function upsVar(now, before) {
  if (!before) return "";
  const v = (now - before) / before * 100;
  return `<span class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "+" : "−"}${upsN(Math.abs(v))}%</span>`;
}
function upsDate(iso) { const d = parseDay(iso); return `${d.getDate()} ${UPS_MONTHS[d.getMonth()]}`; }
function upsOriLabel(o) { return o; }

// Rows of one year up to the report week (the "YTD" of the Excel).
function upsYtd(year, filter = () => true) {
  return ups.rows.filter(r => r.year === year && r.week <= ups.week && filter(r));
}
function upsWeekRows(filter = () => true) {
  return ups.rows.filter(r => r.year === ups.year && r.week === ups.week && filter(r));
}
function upsGroup(rows, key, f = "kg") {
  const m = new Map();
  rows.forEach(r => m.set(r[key], (m.get(r[key]) || 0) + (r[f] || 0)));
  return [...m.entries()].map(([name, v]) => ({ name, v })).sort((a, b) => b.v - a.v);
}
function upsWeeksIn(year) { return new Date(Date.UTC(year, 11, 28)).getUTCDay() === 4 || new Date(Date.UTC(year, 0, 1)).getUTCDay() === 4 ? 53 : 52; }
function upsSeries(year, filter, f = "kg", upTo = null) {
  const n = upTo || upsWeeksIn(year), out = new Array(n).fill(0);
  ups.rows.forEach(r => { if (r.year === year && r.week <= n && filter(r)) out[r.week - 1] += r[f] || 0; });
  return out;
}

function upsHead(region, title) {
  const a = parseDay(ups.start), b = parseDay(ups.end);
  return `<header class="ups-head"><div><h1>UPS Weekly Report · <span>${esc(region)}</span></h1>
      <p>${esc(title)} · Week ${ups.week} · ${a.getDate()} ${UPS_MONTHS[a.getMonth()]} – ${b.getDate()} ${UPS_MONTHS[b.getMonth()]} ${b.getFullYear()}</p></div>
    <div class="logos"><img class="ups-logo" src="img/ups.png" alt="UPS"><i></i><img src="img/gsa-force.png" alt="GSA Force"></div></header>`;
}
function upsFoot(page) {
  return `<div class="ups-foot"><span>Source: CargoSystem · UPS (5X), prefix 502 left out · chargeable kg · sales = cost to UPS</span><span>${page}</span></div>`;
}

// Weekly line chart, last year against this year (this year up to the report week).
function upsChart(filter, f = "kg", opts = {}) {
  const W = opts.width || 1100, H = opts.height || 230, L = 56, R = 18, T = 26, B = 28;
  const prev = upsSeries(ups.year - 1, filter, f), now = upsSeries(ups.year, filter, f, ups.week);
  const n = Math.max(prev.length, upsWeeksIn(ups.year));
  const scale = f === "kg" ? 1000 : 1;
  const maxV = Math.max(1, ...prev, ...now) / scale;
  const ticks = sclNiceTicks(maxV);
  const top = ticks[ticks.length - 1];
  const x = i => L + (W - L - R) * (i / (n - 1));
  const y = v => T + (H - T - B) * (1 - v / scale / top);
  let g = ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v * scale)}" y2="${y(v * scale)}" class="grid"/><text x="${L - 8}" y="${y(v * scale) + 4}" class="axis" text-anchor="end">${f === "kg" ? upsN(v, v < 10 && top < 10 ? 1 : 0) : "$" + upsN(v)}</text>`).join("");
  for (let i = 0; i < n; i += 1) if ((i + 1) % 4 === 1 || i === n - 1) g += `<text x="${x(i)}" y="${H - B + 17}" class="axis" text-anchor="middle">${i + 1}</text>`;
  const pts = s => s.map((v, i) => `${x(i)},${y(v)}`).join(" ");
  g += `<polyline points="${pts(prev)}" class="l-prev"/>`;
  if (now.length) {
    g += `<polygon points="${x(0)},${y(0)} ${pts(now)} ${x(now.length - 1)},${y(0)}" class="a-now"/>`;
    g += `<polyline points="${pts(now)}" class="l-now"/>`;
    const li = now.length - 1;
    g += `<line x1="${x(li)}" x2="${x(li)}" y1="${T - 6}" y2="${H - B}" class="wk"/>`;
    g += `<circle cx="${x(li)}" cy="${y(now[li])}" r="5" class="d-now"/>`;
    const lab = f === "kg" ? `W${ups.week}: ${upsT(now[li])} t` : `W${ups.week}: ${upsMoney(now[li])}`;
    const lx = Math.min(x(li) + 8, W - R - 110);
    g += `<text x="${lx}" y="${T + 6}" class="lab">${esc(lab)}</text>`;
  }
  return `<div class="ups-legend"><span><i style="background:#b9a79b"></i>${ups.year - 1}</span><span><i style="background:#f5a400"></i>${ups.year}</span><span>${f === "kg" ? "tons per week" : "sales (USD) per week"}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="ups-chart">${g}</svg>`;
}

function upsRanking(items, fmt, limit = 10) {
  const list = items.slice(0, limit);
  if (!list.length) return `<div class="ups-empty">No shipments this year.</div>`;
  const maxV = Math.max(...list.map(i => i.v), 1);
  return list.map((it, i) => `<div class="ups-rank"><span>${i + 1}</span><span class="n" title="${esc(it.name)}">${esc(it.name)}</span>
      <i style="width:${Math.max(2, it.v / maxV * 100)}%"></i><b>${fmt(it.v)}</b></div>`).join("");
}

// Last 5 weeks of this year for the top names of those weeks (tons), like the Excel.
function upsLast5(filter, key) {
  const weeks = [];
  for (let w = Math.max(1, ups.week - 4); w <= ups.week; w += 1) weeks.push(w);
  const rows = ups.rows.filter(r => r.year === ups.year && weeks.includes(r.week) && filter(r));
  const names = upsGroup(rows, key).slice(0, 10);
  if (!names.length) return `<div class="ups-empty">No shipments in weeks ${weeks[0]}–${ups.week}.</div>`;
  const cell = (name, w) => upsSum(rows.filter(r => r[key] === name && r.week === w));
  const head = `<tr><th class="l">${key === "customer" ? "Customer" : "Destination"}</th>${weeks.map(w => `<th class="${w === ups.week ? "now" : ""}">W${w}</th>`).join("")}<th>Total</th></tr>`;
  const body = names.map(n => `<tr><td class="l name" title="${esc(n.name)}">${esc(n.name)}</td>${weeks.map(w => { const v = cell(n.name, w); return `<td class="${w === ups.week ? "now" : v ? "" : "nil"}">${v ? upsT(v) : "–"}</td>`; }).join("")}<td><b>${upsT(n.v)}</b></td></tr>`).join("");
  return `<table class="ups-t"><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

function upsDayTable(origins) {
  const rows = upsWeekRows(r => origins.includes(r.ori));
  const days = [...new Set(rows.map(r => r.date))].sort();
  const cols = origins;
  if (!days.length) return `<div class="ups-empty">No flights in week ${ups.week}.</div>`;
  const head = `<tr><th class="l">Day</th>${cols.map(o => `<th>${esc(upsOriLabel(o))}</th>`).join("")}<th>Total</th></tr>`;
  const body = days.map(d => {
    const dr = rows.filter(r => r.date === d), dn = parseDay(d).toLocaleDateString("en-US", { weekday: "long" });
    return `<tr><td class="l">${dn} <span style="color:#8a7468">${upsDate(d)}</span></td>${cols.map(o => { const v = upsSum(dr.filter(r => r.ori === o)); return `<td class="${v ? "" : "nil"}">${v ? upsT(v) : "–"}</td>`; }).join("")}<td><b>${upsT(upsSum(dr))}</b></td></tr>`;
  }).join("");
  const tot = `<tr class="tot"><td class="l">Total</td>${cols.map(o => `<td>${upsT(upsSum(rows.filter(r => r.ori === o)))}</td>`).join("")}<td>${upsT(upsSum(rows))}</td></tr>`;
  return `<table class="ups-t"><thead>${head}</thead><tbody>${body}${tot}</tbody></table>`;
}

// Last week by origin > destination > customer (Mexico) or origin > customer > destination (Puerto Rico).
function upsDetail(origins, order) {
  const rows = upsWeekRows(r => origins.includes(r.ori));
  if (!rows.length) return `<div class="ups-empty">No flights in week ${ups.week}.</div>`;
  const [k1, k2] = order;
  const line = (cells, rs, cls = "") => `<tr class="${cls}">${cells}<td>${upsN(upsSum(rs))}</td><td>${upsAwbs(rs)}</td><td>${upsMoney(upsSum(rs, "sales"))}</td><td>${upsPerKg(upsSum(rs, "sales"), upsSum(rs))}</td></tr>`;
  let body = "";
  origins.forEach(o => {
    const ro = rows.filter(r => r.ori === o);
    if (!ro.length) return;
    let first = true;
    upsGroup(ro, k1).forEach(g1 => {
      const r1 = ro.filter(r => r[k1] === g1.name);
      const subs = upsGroup(r1, k2);
      subs.forEach((g2, i) => {
        const r2 = r1.filter(r => r[k2] === g2.name);
        body += line(`<td class="l ori">${first ? esc(upsOriLabel(o)) : ""}</td><td class="l name">${i === 0 ? esc(g1.name) : ""}</td><td class="l name">${esc(g2.name)}</td>`, r2);
        first = false;
      });
      if (k1 === "customer" && subs.length > 1) body += line(`<td></td><td class="l" colspan="2">Total ${esc(g1.name)}</td>`, r1, "sub");
    });
    body += line(`<td class="l" colspan="3">Total ${esc(upsOriLabel(o))}</td>`, ro, "sub");
  });
  body += line(`<td class="l" colspan="3">Total week ${ups.week}</td>`, rows, "tot");
  const names = { des: "Destination", customer: "Customer" };
  return `<table class="ups-t"><thead><tr><th class="l">Origin</th><th class="l">${names[k1]}</th><th class="l">${names[k2]}</th><th>CHW (kg)</th><th>AWB #</th><th>Sales</th><th>Sales/kg</th></tr></thead><tbody>${body}</tbody></table>`;
}

function upsOverview(region, origins, page) {
  const f = r => origins.includes(r.ori);
  const now = upsSum(upsYtd(ups.year, f)), before = upsSum(upsYtd(ups.year - 1, f));
  const wk = upsSum(upsWeekRows(f)), prevWk = upsSum(ups.rows.filter(r => r.year === ups.year && r.week === ups.week - 1 && f(r)));
  const oris = origins.length > 1 ? `<div class="ups-oris">${origins.map(o => {
    const y = upsSum(upsYtd(ups.year, r => r.ori === o)), w = upsSum(upsWeekRows(r => r.ori === o));
    return `<div class="ups-ori"><em>${esc(o)}</em><div>YTD ${ups.year}<b>${upsT(y)} t</b>W${ups.week}: ${upsT(w)} t</div></div>`;
  }).join("")}</div>` : "";
  return `<section class="ups-page">${upsHead(region, "Tons moved by week")}<div class="ups-body">
    <div class="ups-kpis">
      <div class="ups-kpi dark"><span>YTD ${ups.year}</span><b>${upsT(now)} t</b><small>weeks 1–${ups.week}</small></div>
      <div class="ups-kpi"><span>YTD ${ups.year - 1}</span><b>${upsT(before)} t</b><small>same weeks</small></div>
      <div class="ups-kpi"><span>% Var</span><b>${upsVar(now, before) || "–"}</b><small>${ups.year} vs ${ups.year - 1}</small></div>
      <div class="ups-kpi"><span>Flown week ${ups.week}</span><b>${upsT(wk)} t</b><small>W${ups.week - 1}: ${upsT(prevWk)} t${prevWk ? ` (${upsVar(wk, prevWk)})` : ""}</small></div>
    </div>${oris}
    <div class="ups-card"><h3>Tons moved by week <small>${esc(origins.map(upsOriLabel).join(" · "))}</small></h3>${upsChart(f)}</div>
    <div class="ups-card"><h3>Tons flown last week <small>week ${ups.week}, by flight day</small></h3>${upsDayTable(origins)}</div>
  </div>${upsFoot(page)}</section>`;
}

function upsOriginPage(o, page, region = "5X Mexico") {
  const f = r => r.ori === o;
  const ytd = upsYtd(ups.year, f);
  return `<section class="ups-page">${upsHead(`${region} (ex ${o})`, "Customers and destinations")}<div class="ups-body">
    <div class="ups-split"><div class="ups-card"><h3>YTD top 10 customers <small>tons ${ups.year}</small></h3>${upsRanking(upsGroup(ytd, "customer"), v => `${upsT(v)} t`)}</div>
      <div class="ups-card"><h3>Customers · last 5 weeks <small>tons</small></h3>${upsLast5(f, "customer")}</div></div>
    <div class="ups-split"><div class="ups-card"><h3>YTD top 10 destinations <small>tons ${ups.year}</small></h3>${upsRanking(upsGroup(ytd, "des"), v => `${upsT(v)} t`)}</div>
      <div class="ups-card"><h3>Destinations · last 5 weeks <small>tons</small></h3>${upsLast5(f, "des")}</div></div>
    <div class="ups-card"><h3>Tons by week from ${esc(upsOriLabel(o))}</h3>${upsChart(f, "kg", { height: 190 })}</div>
  </div>${upsFoot(page)}</section>`;
}

function upsDetailPage(region, origins, order, page) {
  const f = r => origins.includes(r.ori);
  const ytd = upsYtd(ups.year, f);
  return `<section class="ups-page">${upsHead(region, "Last week detail")}<div class="ups-body">
    <div class="ups-card"><h3>Week ${ups.week} <small>chargeable kg, AWBs, sales and sales per kg</small></h3>${upsDetail(origins, order)}</div>
    <div class="ups-two"><div class="ups-card"><h3>Top 10 customers YTD <small>CHW kg ${ups.year}</small></h3>${upsRanking(upsGroup(ytd, "customer"), v => upsN(v))}</div>
      <div class="ups-card"><h3>Top 10 customers YTD <small>sales ${ups.year}</small></h3>${upsRanking(upsGroup(ytd, "customer", "sales"), upsMoney)}</div></div>
    <div class="ups-card"><h3>Sales by week <small>${ups.year} vs ${ups.year - 1}</small></h3>${upsChart(f, "sales", { height: 190 })}</div>
  </div>${upsFoot(page)}</section>`;
}

function renderUps() {
  if (!ups) { upsEls.report.innerHTML = ""; return; }
  const pages = [];
  upsShownRegions().forEach(reg => {
    const origins = reg.origins();
    if (!origins.length) return;
    // An origin with no flights this year or last year gets no page (QRO today).
    const oris = reg.perOrigin ? ["NLU", "GDL", "MTY", "QRO", ...origins].filter((o, i, a) => a.indexOf(o) === i && origins.includes(o) && ups.rows.some(r => r.ori === o && r.week <= ups.week)) : [];
    pages.push(p => upsOverview(reg.name, origins, p));
    oris.forEach(o => pages.push(p => upsOriginPage(o, p, reg.name)));
    pages.push(p => upsDetailPage(reg.name, origins, reg.order, p));
  });
  upsEls.report.innerHTML = pages.map((fn, i) => fn(`Page ${i + 1} of ${pages.length}`)).join("");
}

async function loadUps(year, week) {
  const seq = ++upsSeq;
  upsEls.note.textContent = "Loading the UPS flights from CargoSystem…";
  els.status.textContent = "Loading";
  try {
    const params = new URLSearchParams({ email: user().email || "" });
    if (year && week) { params.set("year", year); params.set("week", week); }
    const response = await fetch(`${API_BASE}/api/airline_reports/ups?${params}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== upsSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    ups = body;
    const wk = (ups.weeks || []).map(x => ({ value: `${x.year}-${x.week}`, label: `W${x.week} ${x.year} · ${upsDate(x.start)} – ${upsDate(x.end)}` }));
    if (!wk.some(o => o.value === `${ups.year}-${ups.week}`)) wk.unshift({ value: `${ups.year}-${ups.week}`, label: `W${ups.week} ${ups.year}` });
    fillSelect(upsEls.week, wk, `${ups.year}-${ups.week}`);
    upsEls.note.textContent = `UPS (5X), prefix 502 left out, Monday to Sunday by flight date. ${ups.closed ? "" : "This week is not over yet: it only has the flights so far."}`;
    renderUps();
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== upsSeq) return;
    ups = null;
    renderUps();
    upsEls.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function exportUpsPdf() {
  if (!ups || !window.jspdf || !window.html2canvas) return;
  upsEls.note.textContent = "Building the PDF…";
  const pages = [...upsEls.report.querySelectorAll(".ups-page")];
  upsEls.report.classList.add("ups-printing");
  try {
    let doc = null;
    for (const page of pages) {
      const canvas = await html2canvas(page, { backgroundColor: "#ffffff", scale: 2, useCORS: true, windowWidth: 1300 });
      const w = canvas.width / 2, h = canvas.height / 2;
      if (!doc) doc = new window.jspdf.jsPDF({ orientation: "landscape", unit: "px", format: [w, h], hotfixes: ["px_scaling"] });
      else doc.addPage([w, h], "landscape");
      doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, w, h);
    }
    doc.save(upsFileName("pdf"));
    upsEls.note.textContent = "PDF ready.";
  } finally {
    upsEls.report.classList.remove("ups-printing");
  }
}

async function exportUpsExcel() {
  if (!ups || !window.ExcelJS) return;
  const book = new ExcelJS.Workbook();
  const brown = "FF351C15", gold = "FFFFB500";
  const sheet = (name, cols, rows) => {
    const s = book.addWorksheet(name, { views: [{ state: "frozen", ySplit: 1 }] });
    s.columns = cols.map(c => ({ header: c.h, key: c.k, width: c.w || 14, style: c.fmt ? { numFmt: c.fmt } : {} }));
    rows.forEach(r => s.addRow(r));
    s.getRow(1).eachCell(c => { c.font = { bold: true, color: { argb: "FFFFFFFF" } }; c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: brown } }; });
    return s;
  };
  const regions = upsShownRegions().map(r => [r.label, r.origins()]).filter(([, o]) => o.length);
  regions.forEach(([name, origins]) => {
    const f = r => origins.includes(r.ori);
    const prev = upsSeries(ups.year - 1, f), now = upsSeries(ups.year, f, "kg", ups.week);
    const ps = upsSeries(ups.year - 1, f, "sales"), ns = upsSeries(ups.year, f, "sales", ups.week);
    sheet(`${name} by week`, [{ h: "Week", k: "w", w: 8 }, { h: `Kg ${ups.year - 1}`, k: "a", fmt: "#,##0" }, { h: `Kg ${ups.year}`, k: "b", fmt: "#,##0" }, { h: `Sales ${ups.year - 1}`, k: "c", fmt: "$#,##0" }, { h: `Sales ${ups.year}`, k: "d", fmt: "$#,##0" }],
      prev.map((v, i) => ({ w: i + 1, a: v, b: i < now.length ? now[i] : null, c: ps[i], d: i < ns.length ? ns[i] : null })));
    const wk = upsWeekRows(f);
    const groups = new Map();
    wk.forEach(r => { const k = `${r.ori}|${r.des}|${r.customer}`; const g = groups.get(k) || { ori: r.ori, des: r.des, customer: r.customer, kg: 0, sales: 0, awbs: new Set() }; g.kg += r.kg; g.sales += r.sales; g.awbs.add(r.awb); groups.set(k, g); });
    sheet(`${name} W${ups.week}`, [{ h: "Origin", k: "ori", w: 9 }, { h: "Destination", k: "des", w: 12 }, { h: "Customer", k: "customer", w: 40 }, { h: "CHW (kg)", k: "kg", fmt: "#,##0" }, { h: "AWB #", k: "n", w: 8 }, { h: "Sales", k: "sales", fmt: "$#,##0" }, { h: "Sales/kg", k: "pk", fmt: "$0.00" }],
      [...groups.values()].sort((a, b) => a.ori.localeCompare(b.ori) || b.kg - a.kg).map(g => ({ ...g, n: g.awbs.size, pk: g.kg ? g.sales / g.kg : null })));
    const ytd = upsYtd(ups.year, f);
    const kg = upsGroup(ytd, "customer"), sales = new Map(upsGroup(ytd, "customer", "sales").map(x => [x.name, x.v]));
    sheet(`${name} customers YTD`, [{ h: "Customer", k: "name", w: 40 }, { h: `CHW ${ups.year} (kg)`, k: "kg", fmt: "#,##0" }, { h: "Sales", k: "s", fmt: "$#,##0" }, { h: "Sales/kg", k: "pk", fmt: "$0.00" }],
      kg.map(x => ({ name: x.name, kg: x.v, s: sales.get(x.name) || 0, pk: x.v ? (sales.get(x.name) || 0) / x.v : null })));
  });
  sheet("AWBs", [{ h: "AWB", k: "awb", w: 14 }, { h: "Flight date", k: "date", w: 12 }, { h: "Year", k: "year", w: 7 }, { h: "Week", k: "week", w: 7 }, { h: "Origin", k: "ori", w: 8 }, { h: "Destination", k: "des", w: 11 }, { h: "Customer", k: "customer", w: 40 }, { h: "CHW (kg)", k: "kg", fmt: "#,##0.0" }, { h: "Sales", k: "sales", fmt: "$#,##0.00" }, { h: "Status", k: "status", w: 10 }],
    ups.rows.filter(r => r.year === ups.year && regions.some(([, o]) => o.includes(r.ori))));
  book.worksheets.forEach(s => s.getRow(1).eachCell(c => { c.border = { bottom: { style: "medium", color: { argb: gold } } }; }));
  const buffer = await book.xlsx.writeBuffer();
  downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), upsFileName("xlsx"));
}

document.getElementById("upsRegions").addEventListener("click", e => {
  const b = e.target.closest("button[data-region]");
  if (!b) return;
  upsRegion = b.dataset.region;
  document.querySelectorAll("#upsRegions button").forEach(x => x.classList.toggle("on", x === b));
  renderUps();
});
upsEls.week.addEventListener("change", () => { const [y, w] = upsEls.week.value.split("-").map(Number); loadUps(y, w); });
document.getElementById("upsPdfBtn").addEventListener("click", exportUpsPdf);
document.getElementById("upsExcelBtn").addEventListener("click", exportUpsExcel);

// ---------------------------------------------------------------------------
// Cathay: "Reporte Semanal SCL - Asia" (23 nov, cony). The API computes every
// number from Isidora (Chile to Asia, Cathay = prefix 160, ISO weeks); this
// draws the one-page report she approved and exports it to PDF and Excel.
// ---------------------------------------------------------------------------
let cx = null;
let cxSeq = 0;
const cxEls = {
  view: document.getElementById("cxView"),
  week: document.getElementById("cxWeek"),
  note: document.getElementById("cxNote"),
  report: document.getElementById("cxReport"),
};
const CX_MONTHS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

function cxN(v, dec = 0) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  return Number(v).toLocaleString("es-CL", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function cxPct(part, total) { return total ? part / total * 100 : null; }
function cxDelta(now, before) {
  if (!before) return "";
  const v = (now - before) / before * 100;
  return `<em class="${v >= 0 ? "up" : "down"}">${v >= 0 ? "▲" : "▼"} ${cxN(Math.abs(v))}% vs sem. ant.</em>`;
}
function cxPp(now, before) {
  if (now === null || before === null) return "";
  const d = now - before;
  return `<em class="${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${cxN(Math.abs(d), 1)} pp</em>`;
}
function cxRange(start, end) {
  const a = parseDay(start), b = parseDay(end);
  const left = a.getMonth() === b.getMonth() ? `${a.getDate()}` : `${a.getDate()} de ${CX_MONTHS[a.getMonth()]}`;
  return `${left} al ${b.getDate()} de ${CX_MONTHS[b.getMonth()]} de ${b.getFullYear()}`;
}

function cxKpis() {
  const k = cx.kpi;
  const share = cxPct(k.cx, k.market), shareP = cxPct(k.cx_prev, k.market_prev);
  const rank = k.rank ? `#${k.rank}` : "–";
  const rankD = k.rank && k.rank_prev
    ? `<em class="${k.rank <= k.rank_prev ? "up" : "down"}">${k.rank === k.rank_prev ? "=" : (k.rank < k.rank_prev ? "▲" : "▼")} sem. ant. #${k.rank_prev}</em>` : "";
  const cards = [
    ["Mercado Asia", `${cxN(k.market)} t`, cxDelta(k.market, k.market_prev), `${k.dests} destinos`],
    ["Volumen Cathay", `${cxN(k.cx)} t`, cxDelta(k.cx, k.cx_prev), `${k.dests_cx} destinos con Cathay`],
    ["Share Cathay", `${cxN(share, 1)}%`, cxPp(share, shareP), "sobre el total a Asia"],
    ["Ranking Cathay", rank, rankD, `de ${k.airlines} aerolíneas`],
    ["Agentes con Cathay", `${k.agents_cx} de ${k.agents}`, `<em class="${k.agents_cx >= k.agents_cx_prev ? "up" : "down"}">sem. ant. ${k.agents_cx_prev}</em>`, "agentes activos a Asia"],
  ];
  return `<div class="cx-kpis">${cards.map(([a, b, c, d], i) => `<div class="cx-kpi${i === 2 ? " hi" : ""}"><span>${a}</span><b>${b}</b><div class="d">${c}</div><small>${d}</small></div>`).join("")}</div>`;
}

function cxTrend() {
  const t = cx.trend.filter(x => x.share !== null);
  if (t.length < 2) return `<div class="cx-empty">Sin semanas suficientes</div>`;
  const W = 600, H = 230, L = 34, R = 44, T = 18, B = 26;
  const vals = t.flatMap(x => [x.share, x.fruit_share]).filter(v => v !== null);
  const mx = Math.max(5, Math.ceil(Math.max(...vals) * 1.15 / 5) * 5);
  const X = i => L + i * (W - L - R) / (t.length - 1), Y = v => T + (1 - v / mx) * (H - T - B);
  const vmax = Math.max(...t.map(x => x.tons)) || 1, bw = (W - L - R) / t.length * 0.46;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="cx-ch">`;
  for (let g = 0; g <= mx; g += 5) s += `<line x1="${L}" x2="${W - R}" y1="${Y(g)}" y2="${Y(g)}" class="gr"/><text x="${L - 6}" y="${Y(g) + 4}" class="ax" text-anchor="end">${g}%</text>`;
  t.forEach((x, i) => {
    const h = x.tons / vmax * (H - T - B) * 0.42;
    s += `<rect x="${X(i) - bw / 2}" y="${H - B - h}" width="${bw}" height="${h}" rx="2" class="vol"><title>Mercado ${cxN(x.tons)} t</title></rect>`;
    s += `<text x="${X(i)}" y="${H - 8}" class="ax" text-anchor="middle">S${x.week}</text>`;
  });
  const line = (key, cls) => `<polyline class="${cls}" points="${t.map((x, i) => x[key] === null ? "" : `${X(i)},${Y(x[key])}`).filter(Boolean).join(" ")}"/>`;
  s += line("fruit_share", "lf") + line("share", "lt");
  const i = t.length - 1, last = t[i];
  s += `<circle cx="${X(i)}" cy="${Y(last.share)}" r="4.5" class="dt"/><text x="${X(i) + 8}" y="${Y(last.share) + 4}" class="lb">${cxN(last.share, 1)}%</text>`;
  if (last.fruit_share !== null) {
    let yf = Y(last.fruit_share) + 4;
    if (Math.abs(yf - (Y(last.share) + 4)) < 14) yf = Y(last.share) + 4 + (last.fruit_share <= last.share ? 14 : -14);
    s += `<text x="${X(i) + 8}" y="${yf}" class="lb2">${cxN(last.fruit_share, 1)}%</text>`;
  }
  return s + "</svg>";
}

function cxProducts() {
  const k = cx.kpi, top = Math.max(...cx.products.map(p => p.tons)) || 1;
  return cx.products.map(p => {
    const sh = cxPct(p.cx, p.tons), shP = cxPct(p.cx_prev, p.tons_prev);
    return `<div class="cx-prow"><div class="pn"><b>${p.name}</b><small>${cxN(p.tons)} t · ${cxN(cxPct(p.tons, k.market), 1)}% del mercado</small></div>
      <div class="cx-pbar"><i style="width:${p.tons / top * 100}%"><u style="width:${sh || 0}%"></u></i></div>
      <div class="pv"><b>${cxN(sh, 1)}%</b>${cxPp(sh, shP)}<small>${cxN(p.cx)} t Cathay</small></div></div>`;
  }).join("");
}

// Fruit share by airline as standing columns, like the original report (cony, 24 nov):
// the page already has several horizontal bar lists.
function cxAirlines() {
  if (!cx.airlines.length) return `<div class="cx-empty">Sin fruta a Asia esta semana</div>`;
  const fm = cx.fruit_tons;
  const max = cxPct(cx.airlines[0].tons, fm) || 1;
  return `<div class="cx-cols">${cx.airlines.map(a => {
    const sh = cxPct(a.tons, fm);
    return `<div class="col${a.name === "Cathay" ? " cx" : ""}"><b>${cxN(sh, 1)}%</b>
      <span class="bar"><i style="height:${sh / max * 100}%"></i></span>
      <span class="n" title="${esc(a.name)}">${esc(a.name)}</span><small>${cxN(a.tons)} t</small></div>`;
  }).join("")}</div>`;
}

// Fruit destinations as rings (cony, 24 nov): the Cathay share of each destination,
// biggest market first, with the destination tons under the ring.
function cxDests() {
  if (!cx.dests.length) return `<div class="cx-empty">Sin fruta a Asia esta semana</div>`;
  const R = 27, C = 2 * Math.PI * R;
  return `<div class="cx-rings">${cx.dests.map(d => {
    const p = Math.min((cxPct(d.cx, d.tons) || 0) / 100, 1);
    return `<div class="ring${d.cx >= 0.5 ? "" : " z"}"><svg viewBox="0 0 70 70" width="70" height="70">
        <circle cx="35" cy="35" r="${R}" class="bg"/>
        ${p > 0 ? `<circle cx="35" cy="35" r="${R}" class="fg" stroke-dasharray="${(C * p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 35 35)"/>` : ""}
        <text x="35" y="40" text-anchor="middle">${d.cx >= 0.5 ? `${cxN(p * 100)}%` : "–"}</text></svg>
      <b>${esc(d.code)} <span>${esc(d.city)}</span></b><small>${cxN(d.tons)} t${d.cx >= 0.5 ? ` · CX ${cxN(d.cx)} t` : ""}</small></div>`;
  }).join("")}</div>`;
}

// China / Resto de Asia, like the original report: the region's share, its 10
// main agencies with the Cathay part, their main airline and their Cathay share.
function cxRegion(name, r) {
  const codes = r.codes.slice(0, 7).join(" · ") + (r.codes.length > 7 ? ` +${r.codes.length - 7}` : "");
  const max = Math.max(...r.agents.map(a => a.tons), 1);
  const rows = r.agents.map(a => {
    const sh = cxPct(a.cx, a.tons);
    return `<div class="cx-rrow"><span class="n">${esc(a.name)}</span>
      <span class="bar"><i style="width:${a.tons / max * 80}%"><u style="width:${sh || 0}%"></u></i><b>${cxN(a.tons)} t</b></span>
      <span class="air${a.top === "Cathay" ? " cx" : ""}">${esc(a.top)}</span><span class="v">${cxN(a.top_tons)} t</span>
      <span class="sh${a.cx >= 0.5 ? "" : " z"}">${cxN(sh)}% CX</span></div>`;
  }).join("");
  return `<div class="cx-rg"><div class="rh"><div><h4>${name} <span>${esc(codes || "–")}</span></h4>
      <p>${cxN(r.tons)} t · ${cxN(cxPct(r.tons, cx.fruit_tons))}% de la fruta a Asia</p></div>
      <div class="big"><b>${cxN(cxPct(r.cx, r.tons), 1)}%</b><small>share Cathay · ${cxN(r.cx)} t</small></div></div>
    <h5>Agencias principales</h5>
    <div class="cx-rrow hd"><span></span><span><i></i>parte Cathay</span><span>Principal aerolínea</span><span></span><span>Share CX</span></div>
    ${rows || `<div class="cx-empty">Sin fruta esta semana</div>`}</div>`;
}

// Airlines of one agent, Cathay first (CX 62 · ET 207 · 5Y 145 …), like the original.
function cxAirTags(a) {
  const list = [...a.airlines.filter(x => x.name === "Cathay"), ...a.airlines.filter(x => x.name !== "Cathay")];
  return list.slice(0, 6).map(x => x.name === "Cathay"
      ? `<span class="tag cx">CX ${cxN(x.tons)}</span>`
      : `<span class="tag" title="${esc(x.name)}"><b>${esc(x.code || x.name)}</b> ${cxN(x.tons)}</span>`).join("")
    + (list.length > 6 ? `<span class="more">+${list.length - 6}</span>` : "");
}

function cxAgents() {
  if (!cx.agents.length) return `<div class="cx-empty">Sin fruta a Asia esta semana</div>`;
  const rows = cx.agents.map(a => {
    const pill = a.cx >= 0.5 ? `<span class="cx-pill">${cxN(a.cx)} t · ${cxN(cxPct(a.cx, a.tons))}%</span>` : `<span class="nil">–</span>`;
    const dests = a.dests.slice(0, 6).map(d => `${esc(d.code)} ${cxN(d.tons)}`).join(" · ") + (a.dests.length > 6 ? ` +${a.dests.length - 6}` : "");
    return `<tr><td class="l"><b>${esc(a.name)}</b></td><td class="tot">${cxN(a.tons)} t</td><td class="l">${pill}</td>
      <td class="l dst">${dests}</td><td class="l air">${cxAirTags(a)}</td></tr>`;
  }).join("");
  return `<table class="cx-t cx-det"><thead><tr><th class="l">Agente</th><th>Total</th><th class="l">Cathay</th><th class="l">Destinos principales</th><th class="l">Aerolíneas</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function loadCx(year, week) {
  const seq = ++cxSeq;
  cxEls.note.textContent = "Loading the Isidora exports to Asia…";
  els.status.textContent = "Loading";
  try {
    const params = new URLSearchParams({ email: user().email || "" });
    if (year && week) { params.set("year", year); params.set("week", week); }
    const response = await fetch(`${API_BASE}/api/airline_reports/cathay_scl?${params}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== cxSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    cx = body;
    const short = iso => { const d = parseDay(iso); return `${d.getDate()} ${CX_MONTHS[d.getMonth()].slice(0, 3)}`; };
    const wk = (cx.weeks || []).map(x => ({ value: `${x.year}-${x.week}`, label: `W${x.week} ${x.year} · ${short(x.start)} – ${short(x.end)}` }));
    if (!wk.some(o => o.value === `${cx.year}-${cx.week}`)) wk.unshift({ value: `${cx.year}-${cx.week}`, label: `W${cx.week} ${cx.year}` });
    fillSelect(cxEls.week, wk, `${cx.year}-${cx.week}`);
    cxEls.note.textContent = `Isidora: exports from Chile to Asia, Monday to Sunday, Cathay = prefix 160. ${cx.closed ? "" : "This week is not over yet: it only has the AWBs so far."}`;
    renderCx();
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== cxSeq) return;
    cx = null;
    renderCx();
    cxEls.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function exportCxPdf() {
  const page = cxEls.report.querySelector(".cx-page");
  if (!cx || !page || !window.jspdf || !window.html2canvas) return;
  cxEls.note.textContent = "Building the PDF…";
  cxEls.report.classList.add("cx-printing");
  try {
    // Scale 1.5 and JPEG 0.85 keep one page near 1 MB and still sharp.
    const canvas = await html2canvas(page, { backgroundColor: "#ffffff", scale: 1.5, useCORS: true, windowWidth: 1300 });
    const w = canvas.width / 1.5, h = canvas.height / 1.5;
    const doc = new window.jspdf.jsPDF({ orientation: h > w ? "portrait" : "landscape", unit: "px", format: [w, h], hotfixes: ["px_scaling"] });
    doc.addImage(canvas.toDataURL("image/jpeg", 0.85), "JPEG", 0, 0, w, h);
    doc.save(`Reporte_Semanal_Cathay_Cargo_Chile_W${cx.week}_${cx.year}.pdf`);
    cxEls.note.textContent = "PDF ready.";
  } finally {
    cxEls.report.classList.remove("cx-printing");
  }
}

  sheet("Productos", [{ h: "Producto", k: "name", w: 12 }, { h: "Toneladas", k: "tons", fmt: t }, { h: "Cathay (t)", k: "cx", fmt: t }, { h: "Share Cathay", k: "sh", fmt: p }, { h: "Share sem. ant.", k: "shp", fmt: p }],
    cx.products.map(x => ({ ...x, sh: x.tons ? x.cx / x.tons : null, shp: x.tons_prev ? x.cx_prev / x.tons_prev : null })));
  sheet("Fruta aerolíneas", [{ h: "Aerolínea", k: "name", w: 18 }, { h: "Toneladas", k: "tons", fmt: t }, { h: "Share", k: "sh", fmt: p }, { h: "Share sem. ant.", k: "shp", fmt: p }],
    cx.airlines.map(x => ({ ...x, sh: x.tons / cx.fruit_tons, shp: cx.fruit_tons_prev ? x.tons_prev / cx.fruit_tons_prev : null })));
  sheet("Fruta destinos", [{ h: "Destino", k: "code", w: 9 }, { h: "Ciudad", k: "city", w: 16 }, { h: "Toneladas", k: "tons", fmt: t }, { h: "Cathay (t)", k: "cx", fmt: t }, { h: "Share Cathay", k: "sh", fmt: p }],
    cx.dests.map(x => ({ ...x, sh: x.tons ? x.cx / x.tons : null })));
  sheet("Fruta agentes", [{ h: "Agente", k: "name", w: 18 }, { h: "Total (t)", k: "tons", fmt: t }, { h: "Cathay (t)", k: "cx", fmt: t }, { h: "Share Cathay", k: "sh", fmt: p }, { h: "Destinos", k: "des", w: 60 }, { h: "Aerolíneas", k: "air", w: 60 }],
    cx.agents.map(a => ({ name: a.name, tons: a.tons, cx: a.cx, sh: a.tons ? a.cx / a.tons : null,
      des: a.dests.map(x => `${x.code} ${cxN(x.tons)}`).join(" · "), air: a.airlines.map(x => `${x.code || x.name} ${cxN(x.tons)}`).join(" · ") })));
  [["China", cx.regions.china], ["Resto de Asia", cx.regions.rest]].forEach(([name, r]) =>
    sheet(`${name} agencias`, [{ h: "Agencia", k: "name", w: 18 }, { h: "Toneladas", k: "tons", fmt: t }, { h: "Cathay (t)", k: "cx", fmt: t }, { h: "Share CX", k: "sh", fmt: p }, { h: "Principal aerolínea", k: "top", w: 20 }, { h: "Toneladas principal", k: "top_tons", fmt: t }],
      r.agents.map(a => ({ ...a, sh: a.tons ? a.cx / a.tons : null }))));

  const buffer = await book.xlsx.writeBuffer();
  downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `Reporte_Semanal_Cathay_Cargo_Chile_W${cx.week}_${cx.year}.xlsx`);

// ---------------------------------------------------------------------------
// Cathay CX Offline weekly report (25 nov, cony; rules from Sharon's sheet
// "CX-OFF Report"). Every CX-OFF AWB that flew on Cathay and was not sent yet
// shows up here, also from earlier weeks, so none is skipped. SPOT, COST and
// REMARKS come filled from the spot reference and can be fixed before sending.
// AWBs still BOOKED cannot go: they are fixed in CargoSystem or left out.
// The email leaves from the Gmail of the user who sends it, and the API keeps
// which AWBs went in which report.
// ---------------------------------------------------------------------------
const cxoEls = {
  view: document.getElementById("cxoView"),
  week: document.getElementById("cxoWeek"),
  note: document.getElementById("cxoNote"),
  check: document.getElementById("cxoCheck"),
  preview: document.getElementById("cxoPreview"),
  history: document.getElementById("cxoHistory"),
  send: document.getElementById("cxoSendBtn"),
  dialog: document.getElementById("cxoDialog"),
};
const CXO_LOGO = "https://dataforce.gsaforce.com/airline-reports/img/cathay-cargo-white.png";
let cxo = null;
let cxoSeq = 0;
let cxoEdits = {};

function setCxMode(mode) {
  document.querySelectorAll("#cxTabs button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  const off = mode === "off";
  cxEls.view.hidden = off;
  cxoEls.view.hidden = !off;
  document.getElementById("reportTitle").textContent = off ? "Cathay · CX Offline weekly report" : "Cathay · Reporte Semanal SCL – Asia";
  if (off && !cxo) loadCxo();
  if (!off && !cx) loadCx();
}
document.getElementById("cxTabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (!b) return;
  history.replaceState(null, "", b.dataset.mode === "off" ? "#CX/OFF" : "#CX");
  setCxMode(b.dataset.mode);
});

// "BOXER FREIGHT 0014 CXOFF" -> "BOXER FREIGHT"; "CUSTOMER TEMPORAL - GFCXOFF *COD*" -> "CUSTOMER TEMPORAL"
function cxoCustomer(name) {
  let n = String(name || "").toUpperCase().replace(/\*+\s*COD\s*\*+/g, " ");
  for (let i = 0; i < 3; i++) n = n.replace(/[\s\-\/.,]+(GF-?CX-?OFF|CX-?OFF|\d{2,5})\s*$/g, "").trim();
  return n.replace(/[\s\-]+$/, "") || String(name || "");
}
const cxoN = (v, dec = 0) => v === null || v === undefined || Number.isNaN(v) ? "–" : Number(v).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
const cxoWeekName = () => `W${cxo.week}-${cxo.year}`;
function cxoDate(iso) {
  const d = parseDay(iso);
  return `${String(d.getDate()).padStart(2, "0")}-${["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()]}-${String(d.getFullYear()).slice(2)}`;
}
function cxoRow(r) {
  const e = cxoEdits[r.awb] || {};
  return { ...r, include: e.include !== false, spot: e.spot ?? r.spot, cost: e.cost ?? r.cost, remarks: e.remarks ?? r.remarks };
}
const cxoRows = () => (cxo ? cxo.rows.map(cxoRow) : []);
const cxoIncluded = () => cxoRows().filter(r => r.include);
const cxoNeedsFix = r => !r.spot || !r.cost;

function cxoProblems() {
  const inc = cxoIncluded();
  const booked = inc.filter(r => r.status === "BOOKED");
  const fix = inc.filter(cxoNeedsFix);
  return { inc, booked, fix, blocked: !inc.length || booked.length > 0 || fix.length > 0 };
}

async function loadCxo(year, week) {
  const seq = ++cxoSeq;
  cxoEls.note.textContent = "Loading the CX-OFF AWBs from CargoSystem…";
  els.status.textContent = "Loading";
  try {
    const params = new URLSearchParams({ email: user().email || "" });
    if (year && week) { params.set("year", year); params.set("week", week); }
    const response = await fetch(`${API_BASE}/api/airline_reports/cx_offline?${params}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== cxoSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    cxo = body;
    cxoEdits = {};
    const short = iso => { const d = parseDay(iso); return `${d.getDate()} ${CX_MONTHS[d.getMonth()].slice(0, 3)}`; };
    fillSelect(cxoEls.week, (cxo.weeks || []).map(x => ({ value: `${x.year}-${x.week}`, label: `W${x.week} ${x.year} · ${short(x.start)} – ${short(x.end)}` })), `${cxo.year}-${cxo.week}`);
    cxoEls.note.textContent = `CargoSystem, GSA GF-CXOFF, prefix 160, first Cathay segment. Every AWB that flew up to ${cxoWeekName()} and was not sent to Cathay yet.${cxo.closed ? "" : " This week is not over yet."}`;
    renderCxo();
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== cxoSeq) return;
    cxo = null;
    renderCxo();
    cxoEls.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

function renderCxo() {
  if (!cxo) { cxoEls.check.innerHTML = ""; cxoEls.preview.innerHTML = ""; cxoEls.history.innerHTML = ""; cxoEls.send.disabled = true; return; }
  const rows = cxoRows();
  const p = cxoProblems();
  const notes = [];
  if (!rows.length) notes.push(`<div class="ok">Nothing pending: every CX-OFF AWB up to ${cxoWeekName()} was already sent to Cathay.</div>`);
  if (p.booked.length) notes.push(`<div class="bad"><b>${p.booked.length} AWB${p.booked.length > 1 ? "s are" : " is"} still BOOKED</b> (${p.booked.map(r => r.awb).join(", ")}). Update the flight in CargoSystem or cancel the AWB, then press Refresh. You can also untick it: it stays pending for the next report.</div>`);
  if (p.fix.length) notes.push(`<div class="warn"><b>${p.fix.length} AWB${p.fix.length > 1 ? "s" : ""} without SPOT or COST</b>: the spot reference is not written as "ATTACHED …" or "CONTRACT RATE …". Fill them in the table.</div>`);
  if (rows.length && !p.blocked) notes.push(`<div class="ok">Ready to send: ${p.inc.length} AWB${p.inc.length > 1 ? "s" : ""}, ${cxoN(p.inc.reduce((s, r) => s + r.chw, 0), 1)} kg.</div>`);

    <div class="cxo-blockers">${notes.join("")}</div>

      <th></th><th>AWB</th><th>Customer</th><th class="r">CHW</th><th>Booking</th><th>CX origin · flight</th><th>Seg status</th><th>Truck GSAF</th>

}

    ...(pcs ? [td(r.pcs ?? "", i, "text-align:right;")] : []),
    td(cxoN(r.chw, 1), i, "text-align:right;"), td(`${esc(r.bkg_ori)} → ${esc(r.bkg_des)}`, i), td(`<b>${esc(r.cx_ori)}</b>`, i),
    td(esc(cxoDate(r.date)), i), td(r.week, i, "text-align:right;"), td(yn(r.truck), i), td(yn(r.spot), i), td(esc(r.cost), i), td(esc(r.remarks), i),
  ].join("")}</tr>`).join("");
  return `<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f8f8;border-collapse:collapse;">
    <tr><td style="background:#006564;padding:18px 26px;border-bottom:4px solid #00857d;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
        <td style="${font}color:#ffffff;text-align:left;"><div style="font-size:22px;font-weight:bold;">CX-OFF weekly report · ${cxoWeekName()}</div>

        <td align="right" style="vertical-align:middle;"><img src="${CXO_LOGO}" alt="Cathay Cargo" height="28" style="display:block;border:0;"></td>
      </tr></table></td></tr>

      <table role="presentation" width="100%" cellpadding="0" cellspacing="8" style="border-collapse:separate;"><tr>
        ${kpi("AWBs flown", rows.length, `${cxoN(kg / 1000, 1)} tons chargeable`)}

function cxoEmailText(rows) {
  const lines = rows.map(r => [r.awb, cxoCustomer(r.customer), cxo.pcs_available ? r.pcs ?? "" : null, cxoN(r.chw, 1), r.bkg_ori, r.bkg_des, r.cx_ori, cxoDate(r.date), r.week, r.truck, r.spot, r.cost, r.remarks].filter(v => v !== null).join(" | "));
  return `Lane/Region: CX-Offline\nWeek: ${cxoWeekName()}\nKilos: ${cxoN(rows.reduce((s, r) => s + r.chw, 0), 1)} kg\n\n${lines.join("\n")}\n`;
}
