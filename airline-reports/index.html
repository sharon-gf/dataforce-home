<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="../favicon.jpg">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATAFORCE - Airline Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#e8eaee; --surface:#fff; --border:#d8dde8; --navy:#0d1f3c;
    --text1:#0d1f3c; --text2:#41536c; --text3:#8391a8; --blue:#1a56db; --amber:#c97a06;
    --green:#548235; --green2:#a9d08e; --green3:#e2efda; --total:#d9d9d9;
    --content-width:1180px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; background:var(--bg); color:var(--text1); font-family:'Inter',sans-serif; font-size:12px; }
  button, select, input { font:inherit; }
  .app { min-height:100vh; padding:8px; }
  .header { background:var(--navy); border-radius:6px; padding:8px 16px; display:grid; grid-template-columns:minmax(180px,1fr) minmax(280px,1.4fr) minmax(250px,1fr); align-items:center; gap:10px; margin-bottom:8px; }
  .logo-link { color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:9px; width:max-content; }
  .df-mark { width:28px; height:28px; border:1px solid rgba(122,174,213,.7); border-radius:4px; display:grid; place-items:center; color:#7aaed5; font-weight:600; }
  .logo-word { display:flex; flex-direction:column; gap:1px; }
  .logo-main { font-size:18px; letter-spacing:.13em; font-weight:600; line-height:1; }
  .logo-sub { color:#7aaed5; font-size:9px; letter-spacing:.24em; text-transform:uppercase; }
  .hdr-mid { text-align:center; min-width:0; }
  .header-title { color:#7aaed5; letter-spacing:.12em; font-size:17px; font-weight:500; white-space:nowrap; }
  .header-right { color:#fff; display:flex; justify-content:flex-end; align-items:center; gap:12px; font-size:11px; min-width:0; }
  .status { color:#8fb5d7; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:99px; background:var(--amber); }
  .logout { border:1px solid #7aaed5; color:#7aaed5; background:transparent; border-radius:3px; padding:4px 10px; cursor:pointer; font-size:10px; }
  .panel { width:min(var(--content-width),100%); margin:0 auto 8px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label, .field-label { color:var(--text3); font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .field select, .field input { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 8px; background:#fff; color:var(--text1); }
  .tool-btn { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 14px; background:#fff; color:var(--text2); cursor:pointer; }
  .tool-btn.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  .stations { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:4px; padding:4px 8px; cursor:pointer; color:var(--text2); }
  .note { margin-top:8px; color:var(--text2); line-height:1.5; }
  .block-title { font-size:13px; font-weight:600; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--green); color:#fff; font-weight:500; padding:6px 8px; text-align:center; white-space:nowrap; }
  td { padding:4px 8px; border-bottom:1px solid #e6efe0; text-align:center; white-space:nowrap; }
  td.num, th.num { text-align:right; }
  td.day { background:var(--green2); color:#fff; font-weight:500; border-bottom:0; }
  td.st { background:var(--green3); border-bottom:0; }
  td.dest { background:var(--green3); }
  tr.total td { background:var(--total); font-weight:600; border-bottom:0; }
  tr.total td.label { text-align:left; }
  .empty { padding:18px; text-align:center; color:var(--text3); }
  @media (max-width:760px) {
    .header { grid-template-columns:1fr; }
    .hdr-mid { text-align:left; }
    .header-right { justify-content:flex-start; }
    .table-wrap { overflow-x:auto; }
  }
</style>
<script>window.DATAFORCE_SHELL = {"title":"Airline Reports","userNameId":"userLabel"};</script>
<link rel="stylesheet" href="../dataforce-shell.css">
<script src="../dataforce-shell.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div class="app">
  <div class="header">
    <a class="logo-link" href="https://dataforce.gsaforce.com/">
      <span class="df-mark">DF</span>
      <span class="logo-word"><span class="logo-main">DATAFORCE</span><span class="logo-sub">GSA Force</span></span>
    </a>
    <div class="hdr-mid"><div class="header-title">AIRLINE REPORTS</div></div>
    <div class="header-right">
      <span id="userLabel"></span>
      <span class="status"><span class="dot"></span><span id="statusText">Loading</span></span>
      <button class="logout" type="button" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <section class="panel">
    <div class="filters">
      <div class="field"><label for="carrier">Carrier</label><select id="carrier"></select></div>
      <div class="field"><label for="prefix">AWB prefix</label><select id="prefix"></select></div>
      <div class="field"><label for="reportType">Report</label>
        <select id="reportType">
          <option value="friday">Friday (Friday to Tuesday)</option>
          <option value="monday">Monday (Monday to Sunday)</option>
        </select>
      </div>
      <div class="field"><label for="dateFrom">From</label><input type="date" id="dateFrom"></div>
      <div class="field"><label for="dateTo">To</label><input type="date" id="dateTo"></div>
      <button class="tool-btn" id="resetBtn" type="button">Reset</button>
      <button class="tool-btn primary" id="exportBtn" type="button">Export Excel</button>
      <button class="tool-btn" id="csvBtn" type="button">Export CSV</button>
      <button class="tool-btn" id="imageBtn" type="button">Export image</button>
    </div>
    <div class="stations" id="stations"></div>
    <div class="note" id="note"></div>
  </section>

  <div id="report"></div>
</div>

<script src="../permission-guard.js"></script>
<script>
const API_BASE = "https://dataforce-api-test-911713216717.us-east1.run.app";
const API_KEY = "We1ykcoHgFV16LPduzqw7qGJlMBPGE06U5L7y5Hg_6I";

// The flight number is not in CargoSystem: only the flights given for each carrier.
const FLIGHTS = { ET: { EWR: "ET515", JFK: "ET513" } };
// AWB prefix each carrier opens with; its segments on other airlines' AWBs stay out until chosen.
const OWN_PREFIX = { ET: 71 };
// Stations that start unchecked; they can be added with their checkbox.
const UNCHECKED_STATIONS = { ET: ["LGG"] };
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

let data = null;
let hiddenStations = new Set(UNCHECKED_STATIONS.ET);
let requestSeq = 0;

const els = {
  carrier: document.getElementById("carrier"),
  prefix: document.getElementById("prefix"),
  reportType: document.getElementById("reportType"),
  dateFrom: document.getElementById("dateFrom"),
  dateTo: document.getElementById("dateTo"),
  stations: document.getElementById("stations"),
  note: document.getElementById("note"),
  report: document.getElementById("report"),
  status: document.getElementById("statusText"),
};

function user() {
  return getDataforceUser() || {};
}

function signOut() {
  sessionStorage.removeItem("df_user");
  sessionStorage.removeItem("df_permissions");
  window.location.href = "https://dataforce.gsaforce.com/";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function parseDay(text) {
  const [y, m, d] = String(text).slice(0, 10).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function number(value) {
  return Math.floor(Number(value || 0) + 0.5).toLocaleString("en-US");
}

function flightLabel(carrier, group) {
  const d = parseDay(group.flight_date);
  const date = `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
  const flight = (FLIGHTS[carrier] || {})[group.station];
  return flight ? `${date}-${flight}` : date;
}

function dayName(group) {
  return DAY_NAMES[parseDay(group.flight_date).getDay()];
}

function visibleBlocks() {
  return (data ? data.blocks : []).map(block => ({
    ...block,
    groups: block.groups.filter(g => !hiddenStations.has(g.station)),
  }));
}

function blockTitle(block) {
  const f = d => parseDay(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  return `${f(block.start)} to ${f(block.end)}`;
}

function renderStations() {
  const stations = data ? data.stations : [];
  els.stations.innerHTML = stations.length
    ? `<span class="field-label">Station</span>` + stations.map(s =>
        `<label class="chip"><input type="checkbox" data-station="${esc(s)}" ${hiddenStations.has(s) ? "" : "checked"}>${esc(s)}</label>`).join("")
    : "";
}

function renderReport() {
  const carrier = data ? data.carrier : "";
  const blocks = visibleBlocks();
  const html = blocks.map(block => {
    let body = "";
    block.groups.forEach(group => {
      group.rows.forEach((row, i) => {
        const newDest = i === 0 || group.rows[i - 1].destination !== row.destination;
        body += `<tr>
          <td class="day">${i === 0 ? esc(dayName(group)) : ""}</td>
          <td class="st">${i === 0 ? esc(group.station) : ""}</td>
          <td>${i === 0 ? esc(flightLabel(carrier, group)) : ""}</td>
          <td class="dest">${newDest ? esc(row.destination) : ""}</td>
          <td>${esc(row.awb)}</td>
          <td>${esc(row.product)}</td>
          <td class="num">${number(row.kilos)}</td>
          <td class="num">$ ${number(row.revenue)}</td>
          <td></td>
        </tr>`;
      });
      body += `<tr class="total">
        <td class="day"></td>
        <td class="label" colspan="5">${esc(group.station)} Total</td>
        <td class="num">${number(group.kilos)}</td>
        <td class="num">$ ${number(group.revenue)}</td>
        <td class="num">${group.pmc}</td>
      </tr>`;
    });
    if (!block.groups.length) {
      return `<section class="panel"><div class="block-title">${esc(blockTitle(block))}</div><div class="empty">No segments for these filters.</div></section>`;
    }
    return `<section class="panel">
      <div class="block-title">${esc(blockTitle(block))}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Day of the week</th><th>Station</th><th>Flight/Date</th><th>Destination</th><th>AWB</th><th>PRODUCT</th><th class="num">Kilos</th><th class="num">REVENUE</th><th class="num">PMC</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
  }).join("");
  els.report.innerHTML = html;
}

function fillSelect(select, options, value) {
  select.innerHTML = options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
  select.value = String(value);
}

async function load() {
  const u = user();
  const seq = ++requestSeq;
  const carrier = els.carrier.value || "ET";
  const params = new URLSearchParams({
    email: u.email,
    report_type: els.reportType.value,
    date_from: els.dateFrom.value,
    date_to: els.dateTo.value || els.dateFrom.value,
    carrier,
  });
  if (els.prefix.value !== "ALL" && els.prefix.value !== "") params.set("prefix", els.prefix.value);
  else if (els.prefix.value === "" && OWN_PREFIX[carrier]) params.set("prefix", OWN_PREFIX[carrier]);
  els.status.textContent = "Loading";
  try {
    const response = await fetch(`${API_BASE}/api/airline_reports?${params.toString()}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== requestSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    data = body;
    const carriers = body.carriers.map(c => ({ value: c.code, label: c.name || c.code }));
    if (!carriers.some(c => c.value === body.carrier)) carriers.unshift({ value: body.carrier, label: body.carrier });
    fillSelect(els.carrier, carriers, body.carrier);
    fillSelect(els.prefix, [{ value: "ALL", label: "All" }].concat(body.prefixes.map(p => ({ value: p, label: String(p).padStart(3, "0") }))), body.prefix ?? "ALL");
    renderStations();
    renderReport();
    els.note.textContent = (FLIGHTS[body.carrier] ? "" : "CargoSystem has no flight number, so this carrier shows only the date. ");
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== requestSeq) return;
    data = null;
    renderStations();
    els.report.innerHTML = "";
    els.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

async function exportExcel() {
  if (!data || !window.ExcelJS) return;
  const book = new ExcelJS.Workbook();
  const sheet = book.addWorksheet("Report");
  const columns = ["Day of the week", "Station", "Flight/Date", "Destination", "AWB", "PRODUCT", "Kilos", "REVENUE", "PMC"];
  [16, 9, 15, 12, 16, 24, 10, 12, 7].forEach((width, i) => { sheet.getColumn(i + 1).width = width; });
  const fill = argb => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
  const line = { bottom: { style: "thin", color: { argb: "FFE2EFDA" } } };
  visibleBlocks().forEach(block => {
    if (!block.groups.length) return;
    sheet.addRow([blockTitle(block)]).font = { bold: true };
    const head = sheet.addRow(columns);
    head.eachCell(cell => { cell.fill = fill("FF548235"); cell.font = { color: { argb: "FFFFFFFF" } }; cell.alignment = { horizontal: "center" }; });
    block.groups.forEach(group => {
      group.rows.forEach((row, i) => {
        const newDest = i === 0 || group.rows[i - 1].destination !== row.destination;
        const r = sheet.addRow([i === 0 ? dayName(group) : "", i === 0 ? group.station : "", i === 0 ? flightLabel(data.carrier, group) : "", newDest ? row.destination : "", row.awb, row.product, Number(row.kilos || 0), Number(row.revenue || 0), null]);
        r.eachCell({ includeEmpty: true }, cell => { cell.border = line; cell.alignment = { horizontal: "center" }; });
        r.getCell(1).fill = fill("FFA9D08E"); r.getCell(1).font = { color: { argb: "FFFFFFFF" } };
        r.getCell(2).fill = fill("FFE2EFDA"); r.getCell(4).fill = fill("FFE2EFDA");
        r.getCell(7).numFmt = "#,##0"; r.getCell(7).alignment = { horizontal: "right" };
        r.getCell(8).numFmt = '"$" #,##0'; r.getCell(8).alignment = { horizontal: "right" };
      });
      const t = sheet.addRow(["", `${group.station} Total`, "", "", "", "", group.kilos, group.revenue, group.pmc]);
      t.eachCell({ includeEmpty: true }, cell => { cell.fill = fill("FFD9D9D9"); cell.font = { bold: true }; });
      t.getCell(1).fill = fill("FFA9D08E");
      t.getCell(7).numFmt = "#,##0"; t.getCell(8).numFmt = '"$" #,##0';
    });
    sheet.addRow([]);
  });
  const buffer = await book.xlsx.writeBuffer();
  const url = URL.createObjectURL(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `airline-report-${data.carrier}-${data.report_type}-${els.dateFrom.value}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

function exportName(extension) {
  return `airline-report-${data.carrier}-${data.report_type}-${els.dateFrom.value}.${extension}`;
}

function exportCsv() {
  if (!data) return;
  const cell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;
  const round = value => Math.floor(Number(value || 0) + 0.5);
  const lines = [["Report", "Day of the week", "Station", "Flight/Date", "Destination", "AWB", "PRODUCT", "Kilos", "REVENUE", "PMC"]];
  visibleBlocks().forEach(block => {
    block.groups.forEach(group => {
      const start = [blockTitle(block), dayName(group), group.station, flightLabel(data.carrier, group)];
      group.rows.forEach(row => {
        lines.push([...start, row.destination, row.awb, row.product, round(row.kilos), round(row.revenue), ""]);
      });
      lines.push([...start, "", `${group.station} Total`, "", round(group.kilos), round(group.revenue), group.pmc]);
    });
  });
  const text = lines.map(line => line.map(cell).join(",")).join("\r\n");
  downloadBlob(new Blob(["﻿" + text], { type: "text/csv;charset=utf-8" }), exportName("csv"));
}

async function exportImage() {
  if (!data || !window.html2canvas) return;
  const canvas = await html2canvas(els.report, { backgroundColor: "#ffffff", scale: 2 });
  canvas.toBlob(blob => downloadBlob(blob, exportName("png")), "image/png");
}

function setDefaults() {
  const day = iso(new Date());
  els.dateFrom.value = day;
  els.dateTo.value = day;
}

function reloadWithPrefixReset() {
  hiddenStations = new Set(UNCHECKED_STATIONS[els.carrier.value || "ET"] || []);
  els.prefix.innerHTML = "";
  load();
}

els.carrier.addEventListener("change", reloadWithPrefixReset);
els.prefix.addEventListener("change", load);
els.reportType.addEventListener("change", () => { setDefaults(); load(); });
els.dateFrom.addEventListener("change", () => {
  if (els.dateTo.value < els.dateFrom.value) els.dateTo.value = els.dateFrom.value;
  load();
});
els.dateTo.addEventListener("change", () => {
  if (els.dateTo.value && els.dateTo.value < els.dateFrom.value) els.dateFrom.value = els.dateTo.value;
  load();
});
els.stations.addEventListener("change", event => {
  const station = event.target.dataset.station;
  if (!station) return;
  if (event.target.checked) hiddenStations.delete(station);
  else hiddenStations.add(station);
  renderReport();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  els.carrier.innerHTML = "";
  els.reportType.value = "friday";
  setDefaults();
  reloadWithPrefixReset();
});
document.getElementById("exportBtn").addEventListener("click", exportExcel);
document.getElementById("csvBtn").addEventListener("click", exportCsv);
document.getElementById("imageBtn").addEventListener("click", exportImage);

async function checkAirlineReportsAccess(initFunction) {
  const u = user();
  const email = u && u.email ? u.email : "";
  if (!email) {
    window.location.href = "https://dataforce.gsaforce.com/";
    return;
  }
  try {
    const response = await fetch(`${API_BASE}/api/user_modules?email=${encodeURIComponent(email)}`, {
      headers: { "x-api-key": API_KEY }
    });
    if (!response.ok) throw new Error("Permission check failed");
    const access = await response.json();
    sessionStorage.setItem("df_permissions", JSON.stringify(access));
    const modules = (access.modules || []).map(m => String(m).toLowerCase().replace(/-/g, "_"));
    if (!modules.includes("airline_reports")) {
      showNoAccess("Your account is signed in, but this module has not been assigned to you.");
      return;
    }
    const label = document.getElementById("userLabel");
    if (label) label.textContent = u.name || email;
    initFunction();
  } catch (e) {
    console.error("Error checking access to airline_reports:", e);
    showNoAccess("We could not verify your access. Please try again or contact an administrator.");
  }
}

setDefaults();
checkAirlineReportsAccess(load);
</script>
</body>
</html>
