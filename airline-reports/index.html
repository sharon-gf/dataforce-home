// Gmail of the signed-in user (same as AWB Recovery): Google asks once for permission to send.
const CXO_CLIENT_ID = "911713216717-0434lgkd25hk5jf62jam67go19h78vsg.apps.googleusercontent.com";
const CXO_SCOPE = "https://www.googleapis.com/auth/gmail.send";
let cxoToken = null;
function cxoGmailAccess() {
  if (cxoToken && cxoToken.expires > Date.now() + 60000) return Promise.resolve(cxoToken.value);
  return new Promise((resolve, reject) => {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { reject(new Error("Google sign-in did not load; reload the page")); return; }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: CXO_CLIENT_ID, scope: CXO_SCOPE, hint: user().email,
      callback: r => {
        if (r.error || !r.access_token) { reject(new Error(r.error_description || r.error || "Permission was not given")); return; }
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, CXO_SCOPE)) { reject(new Error("Permission to send email was not given")); return; }
        cxoToken = { value: r.access_token, expires: Date.now() + (Number(r.expires_in) || 3600) * 1000 };
        resolve(cxoToken.value);
      },
      error_callback: e => reject(new Error(e && e.type === "popup_closed" ? "The Google window was closed" : "Google did not open the permission window (check pop-ups)"))
    });
    client.requestAccessToken({ prompt: "" });
  });
}
function cxoB64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function cxoMime(to, cc, subject, html, text) {
  const boundary = "df" + Math.random().toString(36).slice(2);
  const wrap = v => cxoB64(v).replace(/.{1,76}/g, "$&\r\n");
  return [`To: ${to.join(", ")}`, cc.length ? `Cc: ${cc.join(", ")}` : null, `Subject: =?UTF-8?B?${cxoB64(subject)}?=`, "MIME-Version: 1.0",
    `Content-Type: multipart/alternative; boundary="${boundary}"`, "",
    `--${boundary}`, "Content-Type: text/plain; charset=UTF-8", "Content-Transfer-Encoding: base64", "", wrap(text),
    `--${boundary}`, "Content-Type: text/html; charset=UTF-8", "Content-Transfer-Encoding: base64", "", wrap(html),
    `--${boundary}--`, ""].filter(v => v !== null).join("\r\n");
}
const cxoAddresses = v => [...new Set(String(v || "").replace(/"[^"]*"/g, " ").split(/[,;\s]+/).map(x => x.replace(/^[<(\[]+|[>)\].:]+$/g, "").trim().toLowerCase()).filter(Boolean))];
const cxoGoodAddress = a => /^[^@\s<>"(),;:]+@[^@\s<>"(),;:]+\.[a-z]{2,}$/i.test(a);
function cxoMsg(text, kind = "") { const m = document.getElementById("cxoMailMsg"); m.textContent = text; m.className = `msg ${kind}`; }

cxoEls.send.addEventListener("click", () => {
  const p = cxoProblems();
  if (p.blocked) return;
  document.getElementById("cxoTo").value = (cxo.to || []).join(", ");
  document.getElementById("cxoCc").value = (cxo.cc || []).join(", ");
  document.getElementById("cxoSubject").value = `${cxoWeekName()} report CX-OFF`;
  document.getElementById("cxoSum").innerHTML = `<b>${p.inc.length} AWB${p.inc.length > 1 ? "s" : ""}</b> · ${cxoN(p.inc.reduce((s, r) => s + r.chw, 0), 1)} kg · from <b>${esc(user().email || "")}</b>. After sending, these AWBs are marked as sent and do not show up again.`;
  cxoMsg("");
  document.getElementById("cxoMailSend").disabled = false;
  cxoEls.dialog.showModal();
});
document.getElementById("cxoMailCancel").addEventListener("click", () => cxoEls.dialog.close());
document.getElementById("cxoMailSend").addEventListener("click", async () => {
  const to = cxoAddresses(document.getElementById("cxoTo").value);
  const cc = cxoAddresses(document.getElementById("cxoCc").value).filter(a => !to.includes(a));
  const subject = document.getElementById("cxoSubject").value.replace(/[\r\n]+/g, " ").trim();
  const p = cxoProblems();
  if (!to.length) { cxoMsg("Add at least one recipient in To.", "err"); return; }
  const bad = [...to, ...cc].filter(a => !cxoGoodAddress(a));
  if (bad.length) { cxoMsg(`Check these addresses: ${bad.join(", ")}`, "err"); return; }
  if (!subject) { cxoMsg("The subject is empty.", "err"); return; }
  if (p.blocked) { cxoMsg("Some AWBs are still BOOKED or without SPOT/COST.", "err"); return; }
  const btn = document.getElementById("cxoMailSend");
  btn.disabled = true;
  cxoMsg("Waiting for Google…");
  try {
    const token = await cxoGmailAccess();
    cxoMsg("Sending…");
    const html = `<div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#1b2a2e;margin-bottom:12px;">Dear team,<br><br>Please find below the CX-OFF report for week ${cxoWeekName()}.</div><div style="max-width:940px;">${cxoEmailHtml(p.inc)}</div>`;
    const raw = cxoB64(cxoMime(to, cc, subject, html, `Dear team,\n\nPlease find below the CX-OFF report for week ${cxoWeekName()}.\n\n${cxoEmailText(p.inc)}`)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    const response = await fetch("https://gmail.googleapis.com/gmail/v1/users/me/messages/send", {
      method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify({ raw })
    });
    const sent = await response.json().catch(() => ({}));
    if (response.status === 401) { cxoToken = null; throw new Error("The Google permission expired. Press Send again."); }
    if (!response.ok) throw new Error((sent.error && sent.error.message) || `Gmail answered with an error (${response.status})`);
    cxoMsg("Sent. Saving which AWBs went…");
    const rec = await fetch(`${API_BASE}/api/airline_reports/cx_offline/sent?email=${encodeURIComponent(user().email || "")}`, {
      method: "POST", headers: { "x-api-key": API_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ year: cxo.year, week: cxo.week, subject, to, cc, rows: p.inc.map(r => ({ awb: r.awb, spot: r.spot, cost: r.cost, remarks: r.remarks })) })
    });
    const recBody = await rec.json().catch(() => ({}));
    if (!rec.ok) { cxoMsg(`The email was sent, but the AWBs could not be marked as sent (${recBody.detail || rec.status}). Tell an admin before sending again.`, "err"); return; }
    cxoMsg(`Sent from ${user().email} to ${to.join(", ")}.`, "ok");
    setTimeout(() => { cxoEls.dialog.close(); loadCxo(cxo.year, cxo.week); }, 1400);
  } catch (error) {
    cxoMsg(error.message, "err");
    btn.disabled = false;
  }
});

async function exportCxoExcel() {
  if (!cxo || !window.ExcelJS) return;
  const rows = cxoRows();
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(cxoWeekName());
  const head = ["Send", "Bkg_Pfx", "Bkg_AWBNmr", "Cust_Name", ...(cxo.pcs_available ? ["Bkg_pcs"] : []), "AWB_CHW", "Bkg_Ori", "Bkg_Des", "CX_Ori", "CX_FlightDate", "Seg_St", "WEEK", "TRUCK GSAF", "SPOT", "COST", "REMARKS", "CS Sales", "CS Cost", "Spot"];
  ws.addRow(head);
  rows.forEach(r => ws.addRow([r.include ? "Y" : "N", r.pfx, r.number, cxoCustomer(r.customer), ...(cxo.pcs_available ? [r.pcs] : []), r.chw, r.bkg_ori, r.bkg_des, r.cx_ori, parseDay(r.date), r.status, r.week, r.truck, r.spot, r.cost, r.remarks, r.cs_sales, r.cs_cost, r.ref]));
  ws.getRow(1).font = { bold: true, color: { argb: "FFFFFFFF" } };
  ws.getRow(1).fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF006564" } };
  ws.columns.forEach((c, i) => { c.width = [6, 8, 12, 30][i] || 12; });
  ws.getColumn(head.indexOf("CX_FlightDate") + 1).numFmt = "dd-mmm-yy";
  ws.views = [{ state: "frozen", ySplit: 1 }];
  downloadBlob(new Blob([await wb.xlsx.writeBuffer()], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `CX-OFF_Report_${cxoWeekName()}.xlsx`);
}

// The chosen airline lives in the address (#ET), so the browser's back button works.
function showView() {
  const [code, mode] = window.location.hash.slice(1).split("/");
  const airline = AIRLINES.find(a => a.ready && a.code === code);
  document.getElementById("hub").hidden = !!airline;
  document.getElementById("reportView").hidden = !airline;
  document.getElementById("hubNote").textContent = "";
  if (!airline) {
    carrier = null;
    requestSeq++;
    els.status.textContent = "Ready";
    return;
  }
  carrier = airline.code;
  document.getElementById("reportTitle").textContent = `${airline.name} report`;
  // Ethiopian also has the POS (payload) report, in its own tab.
  etEls.tabs.hidden = carrier !== "ET";
  etEls.view.hidden = true;
  // Avianca has its own report (Seguimiento de Mercado), not the flights one.
  const isAvianca = carrier === "AV";
  // UPS has its own weekly report too (23 nov).
  const isUps = carrier === "5X";
  // Cathay too: its weekly SCL - Asia report from Isidora (23 nov).
  const isCathay = carrier === "CX";
  document.querySelector("#reportView > .panel").hidden = isAvianca || isUps || isCathay;
  els.report.hidden = isAvianca || isUps || isCathay;
  upsEls.view.hidden = !isUps;
  cxEls.view.hidden = !isCathay;
  document.getElementById("cxTabs").hidden = !isCathay;
  cxoEls.view.hidden = true;
  avEls.view.hidden = !isAvianca;
  document.getElementById("avTabs").hidden = !isAvianca;
  sclEls.view.hidden = true;
  if (isAvianca) {
    requestSeq++;
    setAvMode(mode === "SCL" ? "scl" : "seguimiento");
    return;
  }
  if (isUps) {
    requestSeq++;
    document.getElementById("reportTitle").textContent = "UPS Weekly Report";
    if (!ups) loadUps();
    return;
  }
  if (isCathay) {
    requestSeq++;
    setCxMode(mode === "OFF" ? "off" : "scl");
    return;
  }
  els.day.value = "ALL";
  setDefaults();
  reloadWithPrefixReset();
  if (carrier === "ET") setEtMode(mode === "POS" ? "pos" : "flights");
}

function setDefaults() {
  const d = new Date();
  if (PREVIOUS_WEEK[carrier]) {
    // El Al: last week, Monday to Sunday
    d.setDate(d.getDate() - 7 - ((d.getDay() + 6) % 7));
    els.dateFrom.value = iso(d);
    d.setDate(d.getDate() + 6);
    els.dateTo.value = iso(d);
    return;
  }
  const day = iso(d);
  els.dateFrom.value = day;
  els.dateTo.value = day;
}

function reloadWithPrefixReset() {
  hiddenStations = new Set(UNCHECKED_STATIONS[carrier] || []);
  els.prefix.innerHTML = "";
  load();
}

els.prefix.addEventListener("change", load);
els.dateFrom.addEventListener("change", () => {
  if (els.dateTo.value < els.dateFrom.value) els.dateTo.value = els.dateFrom.value;
  load();
});
els.dateTo.addEventListener("change", () => {
  if (els.dateTo.value && els.dateTo.value < els.dateFrom.value) els.dateFrom.value = els.dateTo.value;
  load();
});
els.day.addEventListener("change", renderReport);
els.stations.addEventListener("change", event => {
  const station = event.target.dataset.station;
  if (!station) return;
  if (event.target.checked) hiddenStations.delete(station);
  else hiddenStations.add(station);
  renderReport();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  els.day.value = "ALL";

  reloadWithPrefixReset();
});

async function checkAirlineReportsAccess(initFunction) {
  const u = user();
  const email = u && u.email ? u.email : "";
  if (!email) {
    window.location.href = "https://dataforce.gsaforce.com/";
    return;
  }
  try {
    const response = await fetch(`${API_BASE}/api/user_modules?email=${encodeURIComponent(email)}`, {
      headers: { "x-api-key": API_KEY }
    });
    if (!response.ok) throw new Error("Permission check failed");
    const access = await response.json();
    sessionStorage.setItem("df_permissions", JSON.stringify(access));
    const modules = (access.modules || []).map(m => String(m).toLowerCase().replace(/-/g, "_"));
    if (!modules.includes("airline_reports")) {
      showNoAccess("Your account is signed in, but this module has not been assigned to you.");
      return;
    }
    const label = document.getElementById("userLabel");
    if (label) label.textContent = u.name || email;
    initFunction();
  } catch (e) {
    console.error("Error checking access to airline_reports:", e);
    showNoAccess("We could not verify your access. Please try again or contact an administrator.");
  }
}

renderAirlines();
checkAirlineReportsAccess(showView);
