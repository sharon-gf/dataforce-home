<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/jpeg" href="../favicon.jpg">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DATAFORCE - Airline Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#e8eaee; --surface:#fff; --border:#d8dde8; --navy:#0d1f3c;
    --text1:#0d1f3c; --text2:#41536c; --text3:#8391a8; --blue:#1a56db; --amber:#c97a06;
    --green:#548235; --green2:#a9d08e; --green3:#e2efda; --total:#d9d9d9;
    --content-width:1180px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { min-height:100%; background:var(--bg); color:var(--text1); font-family:'Inter',sans-serif; font-size:12px; }
  button, select, input { font:inherit; }
  .app { min-height:100vh; padding:8px; }
  .header { background:var(--navy); border-radius:6px; padding:8px 16px; display:grid; grid-template-columns:minmax(180px,1fr) minmax(280px,1.4fr) minmax(250px,1fr); align-items:center; gap:10px; margin-bottom:8px; }
  .logo-link { color:#fff; text-decoration:none; display:inline-flex; align-items:center; gap:9px; width:max-content; }
  .df-mark { width:28px; height:28px; border:1px solid rgba(122,174,213,.7); border-radius:4px; display:grid; place-items:center; color:#7aaed5; font-weight:600; }
  .logo-word { display:flex; flex-direction:column; gap:1px; }
  .logo-main { font-size:18px; letter-spacing:.13em; font-weight:600; line-height:1; }
  .logo-sub { color:#7aaed5; font-size:9px; letter-spacing:.24em; text-transform:uppercase; }
  .hdr-mid { text-align:center; min-width:0; }
  .header-title { color:#7aaed5; letter-spacing:.12em; font-size:17px; font-weight:500; white-space:nowrap; }
  .header-right { color:#fff; display:flex; justify-content:flex-end; align-items:center; gap:12px; font-size:11px; min-width:0; }
  .status { color:#8fb5d7; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:99px; background:var(--amber); }
  .logout { border:1px solid #7aaed5; color:#7aaed5; background:transparent; border-radius:3px; padding:4px 10px; cursor:pointer; font-size:10px; }
  .panel { width:min(var(--content-width),100%); margin:0 auto 8px; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:12px; }
  .filters { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field label, .field-label { color:var(--text3); font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .field select, .field input { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 8px; background:#fff; color:var(--text1); }
  .tool-btn { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 14px; background:#fff; color:var(--text2); cursor:pointer; }
  .tool-btn.primary { background:var(--navy); border-color:var(--navy); color:#fff; }
  .stations { margin-top:10px; display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border); border-radius:4px; padding:4px 8px; cursor:pointer; color:var(--text2); }
  .note { margin-top:8px; color:var(--text2); line-height:1.5; }
  .block-title { font-size:13px; font-weight:600; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; }
  th { background:var(--green); color:#fff; font-weight:500; padding:6px 8px; text-align:center; white-space:nowrap; }
  td { padding:4px 8px; border-bottom:1px solid #e6efe0; text-align:center; white-space:nowrap; }
  td.num, th.num { text-align:right; }
  td.day { background:var(--green2); color:#fff; font-weight:500; border-bottom:0; }
  td.st { background:var(--green3); border-bottom:0; }
  td.dest { background:var(--green3); }
  tr.total td { background:var(--total); font-weight:600; border-bottom:0; }
  tr.total td.label { text-align:left; }
  .empty { padding:18px; text-align:center; color:var(--text3); }
  /* Ethiopian POS (payload) per flight (19 nov, cony) */
  .et-tabs { width:min(var(--content-width),100%); margin:0 auto 8px; display:flex; gap:6px; }
  .et-tabs button { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 14px; background:#fff; color:var(--text2); cursor:pointer; }
  .et-tabs button.on { background:var(--green); border-color:var(--green); color:#fff; }
  .et-top { display:grid; grid-template-columns:minmax(280px,1fr) auto; gap:14px; align-items:center; }
  .et-drop { display:flex; align-items:center; gap:14px; padding:14px 18px; border:1.5px dashed #b9c3d6; border-radius:10px; background:#f7f9fc; cursor:pointer; transition:background .15s, border-color .15s; }
  .et-drop:hover, .et-drop.over { background:#eef6ea; border-color:var(--green); }
  .et-drop input { display:none; }
  .et-drop-icon { width:46px; height:46px; border-radius:10px; display:grid; place-items:center; background:#e2efda; color:var(--green); flex:none; }
  .et-drop-text { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--text2); }
  .et-drop-text b { font-size:13px; color:var(--text1); }
  .et-drop.busy { pointer-events:none; opacity:.75; }
  .et-drop.busy .et-drop-icon { animation:etPulse 1s ease-in-out infinite; }
  @keyframes etPulse { 50% { opacity:.35; } }
  .et-actions { display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; justify-content:flex-end; }
  .et-note { grid-column:1 / -1; margin-top:0; }
  .et-note:empty { display:none; }
  .et-kpis { width:min(var(--content-width),100%); margin:0 auto 8px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:8px; }
  .et-kpis:empty { display:none; }
  .et-kpi { background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--green); border-radius:8px; padding:10px 12px; }
  .et-kpi span { display:block; font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text3); }
  .et-kpi b { display:block; font-size:20px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums; }
  .et-kpi small { color:var(--text3); font-size:10px; }
  .et-kpi.red { border-left-color:#dc2626; }
  .et-table-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .et-table-head small { color:var(--text3); }
  .et-table { table-layout:auto; font-variant-numeric:tabular-nums; }
  .et-table th { white-space:normal; line-height:1.25; vertical-align:bottom; padding:8px 6px; font-size:8.5px; }
  .et-table td { white-space:nowrap; padding:7px 6px; }
  .et-table td.num, .et-table th.num { text-align:right; }
  .et-table td.c, .et-table th.c { text-align:center; }
  .et-table tbody tr { cursor:pointer; }
  .et-table tbody tr:hover td { background:#e9f3e3 !important; }
  .et-table td.strong { font-weight:600; }
  .et-table .wk { display:inline-block; min-width:30px; padding:1px 6px; border-radius:10px; background:#eef0f4; color:var(--text2); font-size:10px; font-weight:600; }
  .et-table tr.et-cancel td { color:#b91c1c; background:#fff5f5 !important; }
  .et-table .tag-cancel { display:inline-block; padding:1px 7px; border-radius:10px; background:#fee2e2; color:#b91c1c; font-size:10px; font-weight:600; }
  .et-table td.comment { white-space:normal; min-width:120px; max-width:220px; color:var(--text2); }
  .et-head { margin-bottom:10px; }
  .et-head input { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 8px; }
  .et-sum { display:flex; flex-wrap:wrap; gap:18px; padding:8px 12px; background:var(--green3); border-radius:6px; margin-bottom:10px; font-size:12px; }
  .et-sum b { font-size:14px; }
  .et-grid { display:grid; grid-template-columns:minmax(260px,1fr) minmax(520px,2.2fr); gap:14px; align-items:start; }
  .et-grid .df-table input { height:24px; border:1px solid var(--border); border-radius:3px; padding:0 4px; width:70px; text-align:right; font-variant-numeric:tabular-nums; }
  .et-grid .df-table input[type="text"] { text-align:left; width:110px; }
  .et-grid .tool-btn { margin-top:6px; height:26px; }
  .et-grid .et-x { margin:0; height:22px; padding:0 7px; }
  .et-missing td { background:#fff7ed !important; }
  .et-st { font-size:11px; line-height:1.35; white-space:normal; min-width:150px; max-width:260px; }
  .et-ok { color:#15803d; font-weight:600; }
  .et-fix { color:#1d4ed8; }
  .et-chk { color:#c2410c; }
  .et-warn { background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:6px; padding:8px 10px; margin-bottom:10px; line-height:1.5; }
  .et-file { font-weight:400; color:var(--text3); font-size:11px; margin-left:6px; }
  @media (max-width:900px) { .et-grid { grid-template-columns:1fr; } }
  .df-table th { background:#1a3360; color:#c8d8f0; font-size:9px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; padding:8px; }
  .df-table td { border-bottom:1px solid var(--border); padding:8px; font-size:11px; }
  .df-table tbody tr:nth-child(even) td { background:#f0f2f6; }
  .df-table tbody tr:hover td { background:#e4ecfb; }
  .hub { width:min(var(--content-width),100%); margin:18px auto 8px; }
  .hub h1 { font-size:20px; font-weight:600; }
  .hub-lead { color:var(--text2); margin:3px 0 16px; font-size:13px; }
  .airlines { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .airline { position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-height:132px; padding:18px 16px 14px; text-align:left; color:inherit; cursor:pointer; background:var(--surface); border:1px solid var(--border); border-radius:12px; transition:transform .15s, box-shadow .15s, border-color .15s; }
  .airline::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--blue); }
  .airline.pending::before { background:#c5cfe0; }
  @media (hover:hover) { .airline:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(13,31,60,.12); border-color:#c5cfe0; } }
  .airline-code { width:36px; height:36px; border-radius:8px; display:grid; place-items:center; background:#eef3fb; color:var(--blue); font-weight:600; }
  .airline.pending .airline-code { background:#eef0f4; color:var(--text2); }
  .airline-name { font-size:13px; font-weight:600; }
  .airline-tag { margin-top:auto; font-size:10px; font-weight:500; padding:3px 8px; border-radius:4px; background:var(--green3); color:#3b5d24; }
  .airline.pending .airline-tag { background:#eef0f4; color:var(--text2); }
  .hub-note { min-height:18px; margin-top:12px; color:var(--text2); font-size:12px; }
  .report-head { width:min(var(--content-width),100%); margin:0 auto 8px; display:flex; align-items:center; gap:12px; }
  .report-head h1 { font-size:16px; font-weight:600; }
  /* Avianca: Seguimiento de Mercado (19-20 nov, cony): same tables as the Excel, redesigned:
     branded header, named sections, report week highlighted, cleaner chart and PDF */
  .av-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .av-bar .spacer { flex:1; }
  .avdoc { width:min(var(--content-width),100%); margin:0 auto 10px; background:#fff; border:1px solid #eadde4; border-radius:12px; overflow:hidden;
    font-family:'DM Sans',Inter,sans-serif; color:#1d1418; box-shadow:0 6px 22px rgba(60,20,40,.06); }
  .avdoc-head { display:flex; justify-content:space-between; align-items:center; padding:18px 26px; background:linear-gradient(90deg,#e30613 0%,#d0123c 45%,#a3197e 100%); color:#fff; }
  .avdoc-head h2 { font-size:24px; font-weight:700; letter-spacing:-.01em; }
  .avdoc-head p { font-size:13px; opacity:.88; margin-top:2px; }
  .avdoc-head .logos { display:flex; align-items:center; gap:14px; }
  .avdoc-head .logos img { height:44px; } .avdoc-head .logos span { width:1px; height:38px; background:rgba(255,255,255,.55); }
  .avdoc-sec { padding:18px 26px 6px; }
  .avdoc-sec + .avdoc-sec { border-top:1px solid #f1e7ec; }
  .avdoc-title { display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
  .avdoc-title h3 { font-size:17px; font-weight:700; }
  .avdoc-title span { font-size:12px; color:#8a7480; }
  .avdoc-title .tag { margin-left:auto; font-size:11px; font-weight:600; color:#a3197e; background:#fbeef5; border-radius:20px; padding:3px 10px; }
  .av-legend { display:flex; gap:14px; font-size:12px; color:#6f5a65; margin-bottom:6px; }
  .av-legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-2px; }
  .av-chart svg { width:100%; height:auto; display:block; }
  .av-scroll { overflow-x:auto; border:1px solid #eadde4; border-radius:10px; }
  .av-table { border-collapse:separate; border-spacing:0; width:max-content; table-layout:fixed; font-variant-numeric:tabular-nums; font-family:'DM Sans',Inter,sans-serif; }
  .av-table th, .av-table td { width:52px; min-width:52px; max-width:52px; height:26px; box-sizing:border-box; overflow:hidden; }
  .av-table th { background:#2a1620; color:#f3e6ec; font-size:10.5px; font-weight:600; padding:7px 6px; text-align:right; }
  .av-table th.now { background:#a3197e; color:#fff; }
  .av-table td { padding:0 8px; border-bottom:1px solid #f4ecf0; text-align:right; font-size:11.5px; line-height:26px; background:#fff; white-space:nowrap; color:#2b2026; }
  .av-table tbody tr.row:nth-of-type(even) td { background:#fcf9fb; }
  .av-table tbody tr.row:hover td { background:#f8eef3; }
  .av-table td.now { background:#fbeef5 !important; font-weight:700; color:#7a1252; }
  .av-table td.nil { color:#cbbcc4; }
  .av-table .yr { position:sticky; left:0; z-index:1; width:46px; min-width:46px; max-width:46px; text-align:left; color:#9b8590; font-size:10.5px; }
  .av-table .lbl { position:sticky; left:46px; z-index:1; width:158px; min-width:158px; max-width:158px; text-align:left; font-weight:600; color:#1d1418; border-right:1px solid #eadde4; box-shadow:inset 3px 0 0 var(--sec,#a3197e); }
  .av-table th.yr, .av-table th.lbl { z-index:2; text-align:left; color:#fff; box-shadow:none; }
  .av-table .fl { text-align:left; width:100px; min-width:100px; max-width:100px; color:#6f5a65; }
  .av-table tr.sec td { height:24px; line-height:24px; background:#fdf6f9 !important; color:var(--sec,#a3197e); font-size:9.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; border-bottom:1px solid #f1e3ea; }
  .av-table tr.sec td.lbl { color:var(--sec,#a3197e); }
  .av-table tr.qt td { font-weight:700; }
  .av-table .chip { display:inline-block; padding:0 8px; height:19px; line-height:19px; border-radius:10px; background:#fbeef5; color:#a3197e; font-size:10.5px; font-weight:600; }
  .av-table input { width:100%; height:19px; margin:0; border:1px solid #e7c6d6; border-radius:5px; text-align:right; padding:0 4px; font-size:11.5px; line-height:17px; background:#fff; vertical-align:middle; font-variant-numeric:tabular-nums; font-family:inherit; -moz-appearance:textfield; }
  .av-table input:focus { outline:none; border-color:#a3197e; box-shadow:0 0 0 3px rgba(163,25,126,.15); }
  .av-table input::-webkit-outer-spin-button, .av-table input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .av-table td.fl input { width:36px; margin-right:4px; }
  .av-table td:has(input) { padding:0 3px; }
  .av-table input.saving { border-color:#f59e0b; } .av-table input.saved { border-color:#16a34a; } .av-table input.err { border-color:#dc2626; background:#fef2f2; }
  /* Avianca "Mercado SCL" (19 nov, cony): same design as the PDF sent to Avianca */
  .av-tabs { width:min(var(--content-width),100%); margin:0 auto 8px; display:flex; gap:6px; }
  .av-tabs button { height:30px; border:1px solid var(--border); border-radius:4px; padding:0 14px; background:#fff; color:var(--text2); cursor:pointer; }
  .av-tabs button.on { background:#da291c; border-color:#da291c; color:#fff; }
  .scl-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .scl-bar .grow { flex:1; min-width:220px; }
  .scl-bar .grow input { width:100%; }
  .scl-wrap { overflow-x:auto; padding-bottom:6px; }
  #sclReport { width:1240px; margin:0 auto; }
  .scl-page { --bg:#140d11; --card:#1f161b; --line:#33262d; --mag:#a3197e; --prev:#6e4f61; --red:#e30613; --pink:#e85aa7; --green:#34c47c; --txt:#f6eff3; --mut:#a8949f;
    background:var(--bg); color:var(--txt); font-family:'DM Sans',Inter,sans-serif; font-size:14px; padding:0 0 26px; margin-bottom:18px; border-radius:6px; overflow:hidden; }
  .scl-head { display:flex; justify-content:space-between; align-items:center; padding:22px 34px; background:linear-gradient(90deg,#e30613 0%,#d0123c 45%,#a3197e 100%); }
  .scl-head h1 { font-size:30px; font-weight:700; letter-spacing:-.01em; color:#fff; }
  .scl-head p { font-size:15px; color:rgba(255,255,255,.85); margin-top:3px; }
  .scl-logos { display:flex; align-items:center; gap:16px; }
  .scl-logos img { height:54px; }
  .scl-logos span { width:1px; height:46px; background:rgba(255,255,255,.55); }
  .scl-main { font-size:23px; font-weight:700; margin:22px 34px 16px; line-height:1.3; }
  .scl-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:0 34px 14px; }
  .scl-kpi { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--mag); border-radius:10px; padding:14px 18px; }
  .scl-kpi span { font-size:13px; color:var(--mut); }
  .scl-kpi b { display:block; font-size:32px; font-weight:700; margin:2px 0; letter-spacing:-.01em; }
  .scl-kpi small { font-size:12.5px; color:var(--mut); }
  .scl-card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; margin:0 34px 14px; }
  .scl-kicker { font-size:12.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--pink); }
  .scl-card h3 { font-size:19px; font-weight:600; margin:4px 0 12px; }
  .scl-two { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:0 34px 14px; }
  .scl-two .scl-card { margin:0; }
  .scl-legend { display:flex; align-items:center; gap:16px; font-size:12px; color:var(--mut); margin-bottom:6px; }
  .scl-legend b { margin-left:auto; color:var(--pink); font-weight:700; font-size:13px; }
  .scl-legend i { display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:5px; vertical-align:-1px; }
  .lg-bar, .lg-prev { background:var(--prev); } .lg-now { background:var(--mag); }
  .lg-line { height:2px !important; width:16px !important; background:var(--red); vertical-align:3px !important; }
  .scl-chart { width:100%; height:auto; display:block; }
  .scl-chart .grid { stroke:#33262d; stroke-width:1; }
  .scl-chart .axis { fill:#a8949f; font-size:11px; font-family:'DM Sans',sans-serif; }
  .scl-chart .axis.red { fill:#ff6b7a; }
  .scl-chart .bar { fill:#5c4351; } .scl-chart .bar.prev { fill:#c49ab0; } .scl-chart .bar.now { fill:#a3197e; }
  .scl-chart .line { fill:none; stroke:#e30613; stroke-width:2.2; stroke-linejoin:round; }
  .scl-chart .dot { fill:#e30613; stroke:#fff; stroke-width:1.5; }
  .scl-brow { display:grid; grid-template-columns:150px 1fr 150px; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line); }
  .scl-brow:last-child { border-bottom:0; }
  .scl-bname { display:flex; align-items:center; gap:10px; font-size:15px; }
  .scl-bname small { display:block; color:var(--mut); font-size:11.5px; }
  .rk { width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; background:#33262d; font-size:12.5px; font-weight:700; }
  .rk.av { background:var(--red); }
  .scl-bbars > div { display:flex; align-items:center; gap:7px; height:19px; }
  .scl-bbars i { display:block; height:15px; border-radius:2px; }
  .scl-bbars em { font-style:normal; color:var(--mut); font-size:12px; white-space:nowrap; } .scl-bbars b { font-size:13px; white-space:nowrap; }

<script>
const API_BASE = "https://dataforce-api-test-911713216717.us-east1.run.app";
const API_KEY = "We1ykcoHgFV16LPduzqw7qGJlMBPGE06U5L7y5Hg_6I";

// The flight number is not in CargoSystem: only the flights given for each carrier.
const FLIGHTS = { ET: { EWR: "ET515", JFK: "ET513" } };
// AWB prefix each carrier opens with; its segments on other airlines' AWBs stay out until chosen.
const OWN_PREFIX = { ET: 71, LY: 805 };
// 6 nov, cony: El Al's report is last week's 805 AWBs flown on El Al, Monday to Sunday.
const PREVIOUS_WEEK = { LY: true };
// Stations that start unchecked; they can be added with their checkbox.
const UNCHECKED_STATIONS = { ET: ["LGG"] };
// 4 nov, cony: each airline has its own report format, so the module opens with
// one card per client airline. "ready" = its format is built; the others open
// once they have one.
const AIRLINES = [
  { code: "ET", name: "Ethiopian", ready: true },
  { code: "LY", name: "El Al", ready: true },
  { code: "CX", name: "Cathay", ready: true },
  { code: "5X", name: "UPS", ready: true },
  { code: "AV", name: "Avianca", ready: true },
  { code: "4X", name: "Mercury" },
];
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

let data = null;
let carrier = null;
let hiddenStations = new Set();
let requestSeq = 0;

const els = {
  prefix: document.getElementById("prefix"),
  dateFrom: document.getElementById("dateFrom"),
  dateTo: document.getElementById("dateTo"),
  day: document.getElementById("dayFilter"),
  stations: document.getElementById("stations"),
  note: document.getElementById("note"),
  report: document.getElementById("report"),
  status: document.getElementById("statusText"),
};

function user() {
  return getDataforceUser() || {};
}

function signOut() {
  sessionStorage.removeItem("df_user");
  sessionStorage.removeItem("df_permissions");
  window.location.href = "https://dataforce.gsaforce.com/";
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function parseDay(text) {
  const [y, m, d] = String(text).slice(0, 10).split("-").map(Number);
  return new Date(y, m - 1, d);
}

function number(value) {
  return Math.floor(Number(value || 0) + 0.5).toLocaleString("en-US");
}

function flightLabel(carrier, group) {
  const d = parseDay(group.flight_date);
  const date = `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
  const flight = (FLIGHTS[carrier] || {})[group.station];
  return flight ? `${date}-${flight}` : date;
}

function dayName(group) {
  return DAY_NAMES[parseDay(group.flight_date).getDay()];
}

// 19 nov, cony: no Friday/Monday report any more, only the calendar. The API
// is asked for Monday-to-Sunday weeks (they cover every day) and the page
// keeps exactly the days between From and To, in one table.
function baseBlocks() {
  if (!data) return [];
  const { from, to } = data.range;
  const groups = data.blocks.flatMap(block => block.groups)
    .filter(g => from <= String(g.flight_date).slice(0, 10) && String(g.flight_date).slice(0, 10) <= to);
  return [{ start: from, end: to, groups }];
}

function visibleBlocks() {
  const day = els.day.value;
  return baseBlocks()
    .filter(block => day === "ALL" || (block.start <= day && day <= block.end))
    .map(block => ({
      ...block,
      groups: block.groups.filter(g => !hiddenStations.has(g.station) && (day === "ALL" || String(g.flight_date).slice(0, 10) === day)),
    }));
}

function renderDays() {
  const selected = els.day.value;
  const options = [{ value: "ALL", label: "All days" }];
  baseBlocks().forEach(block => {
    for (let d = parseDay(block.start); iso(d) <= block.end; d.setDate(d.getDate() + 1)) {
      options.push({ value: iso(d), label: d.toLocaleDateString("en-US", { weekday: "long", month: "2-digit", day: "2-digit" }) });
    }
  });
  fillSelect(els.day, options, options.some(o => o.value === selected) ? selected : "ALL");
}

function blockTitle(block) {
  const f = d => parseDay(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  return `${f(block.start)} to ${f(block.end)}`;
}

function renderStations() {
  // El Al's report has no station filter: every gateway is always in it.
  const stations = data && !PREVIOUS_WEEK[data.carrier] ? data.stations : [];
  els.stations.innerHTML = stations.length
    ? `<span class="field-label">Station</span>` + stations.map(s =>
        `<label class="chip"><input type="checkbox" data-station="${esc(s)}" ${hiddenStations.has(s) ? "" : "checked"}>${esc(s)}</label>`).join("")
    : "";
}

function money(value) {
  return Number(value).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function usDate(text) {
  const d = parseDay(text);
  return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}/${d.getFullYear()}`;
}

// One line per El Al segment: the rate and the minimum are the ones entered in CargoSystem.
function elAlLines(block) {
  return block.groups.flatMap(group => group.rows.map(row => ({
    awb: row.awb,
    date: usDate(group.flight_date),
    gateway: group.station,
    destination: row.destination,
    chw: Number(row.kilos || 0),
    rate: row.rate == null ? "" : money(row.rate),
    minimum: Number(row.minimum) > 0 ? money(row.minimum) : "",
  })));
}

const EL_AL_COLUMNS = ["AWB", "Flight Date", "Gateway", "Destination", "CHW (Kg)", "Rate $/kg", "Min $"];

function renderElAl() {
  els.report.innerHTML = visibleBlocks().map(block => {
    const lines = elAlLines(block);
    if (!lines.length) {
      return `<section class="panel"><div class="block-title">${esc(blockTitle(block))}</div><div class="empty">No segments for these filters.</div></section>`;
    }
    const body = lines.map(l => `<tr>
        <td>${esc(l.awb)}</td><td>${esc(l.date)}</td><td>${esc(l.gateway)}</td><td>${esc(l.destination)}</td>
        <td class="num">${money(l.chw)}</td><td class="num">${esc(l.rate)}</td><td class="num">${esc(l.minimum)}</td>
      </tr>`).join("");
    return `<section class="panel">
      <div class="block-title">${esc(blockTitle(block))}</div>
      <div class="table-wrap"><table class="df-table">
        <thead><tr>${EL_AL_COLUMNS.map((c, i) => `<th${i > 3 ? ' class="num"' : ""}>${esc(c)}</th>`).join("")}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
  }).join("");
}

function renderReport() {
  if (data && data.carrier === "LY") return renderElAl();
  const carrier = data ? data.carrier : "";
  const blocks = visibleBlocks();
  const html = blocks.map(block => {
    let body = "";
    block.groups.forEach(group => {
      group.rows.forEach((row, i) => {
        const newDest = i === 0 || group.rows[i - 1].destination !== row.destination;
        body += `<tr>
          <td class="day">${i === 0 ? esc(dayName(group)) : ""}</td>
          <td class="st">${i === 0 ? esc(group.station) : ""}</td>
          <td>${i === 0 ? esc(flightLabel(carrier, group)) : ""}</td>
          <td class="dest">${newDest ? esc(row.destination) : ""}</td>
          <td>${esc(row.awb)}</td>
          <td>${esc(row.product)}</td>
          <td class="num">${number(row.kilos)}</td>
          <td class="num">$ ${number(row.revenue)}</td>
          <td></td>
        </tr>`;
      });
      body += `<tr class="total">
        <td class="day"></td>
        <td class="label" colspan="5">${esc(group.station)} Total</td>
        <td class="num">${number(group.kilos)}</td>
        <td class="num">$ ${number(group.revenue)}</td>
        <td class="num">${group.pmc}</td>
      </tr>`;
    });
    if (!block.groups.length) {
      return `<section class="panel"><div class="block-title">${esc(blockTitle(block))}</div><div class="empty">No segments for these filters.</div></section>`;
    }
    return `<section class="panel">
      <div class="block-title">${esc(blockTitle(block))}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Day of the week</th><th>Station</th><th>Flight/Date</th><th>Destination</th><th>AWB</th><th>PRODUCT</th><th class="num">Kilos</th><th class="num">REVENUE</th><th class="num">PMC</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </section>`;
  }).join("");
  els.report.innerHTML = html;
}

function fillSelect(select, options, value) {
  select.innerHTML = options.map(o => `<option value="${esc(o.value)}">${esc(o.label)}</option>`).join("");
  select.value = String(value);
}

async function load() {
  const u = user();
  const seq = ++requestSeq;
  const params = new URLSearchParams({
    email: u.email,
    report_type: "monday",
    date_from: els.dateFrom.value,
    date_to: els.dateTo.value || els.dateFrom.value,
    carrier,
  });
  if (els.prefix.value !== "ALL" && els.prefix.value !== "") params.set("prefix", els.prefix.value);
  else if (els.prefix.value === "" && OWN_PREFIX[carrier]) params.set("prefix", OWN_PREFIX[carrier]);
  els.status.textContent = "Loading";
  try {
    const response = await fetch(`${API_BASE}/api/airline_reports?${params.toString()}`, { headers: { "x-api-key": API_KEY } });
    const body = await response.json();
    if (seq !== requestSeq) return;
    if (!response.ok) throw new Error(body.detail || "Could not load the report");
    data = body;
    data.range = { from: params.get("date_from"), to: params.get("date_to") };
    fillSelect(els.prefix, [{ value: "ALL", label: "All" }].concat(body.prefixes.map(p => ({ value: p, label: String(p).padStart(3, "0") }))), body.prefix ?? "ALL");
    renderDays();
    renderStations();
    renderReport();
    if (body.carrier === "LY") {
      els.note.textContent = body.with_rates ? "" : "Rate and minimum will show once Seg_IntRate and Seg_IntMin reach the database.";
    } else {
      els.note.textContent = (FLIGHTS[body.carrier] ? "" : "CargoSystem has no flight number, so this carrier shows only the date. ");
    }
    els.status.textContent = "Live";
  } catch (error) {
    if (seq !== requestSeq) return;
    data = null;
    renderDays();
    renderStations();
    els.report.innerHTML = "";
    els.note.textContent = error.message;
    els.status.textContent = "Error";
  }
}

function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

}

function exportCsv() {

  const cell = value => `"${String(value ?? "").replace(/"/g, '""')}"`;

// ---------------------------------------------------------------------------
// Ethiopian: POS (payload) per flight (19 nov, cony). The "data PAYLOAD"
// sheet of the ET POS Excel. The flight PDF (manifest + scanned AWBs) is read
// by the API; every number is calculated (CHW = chargeable weight / AWB
// pieces x pieces flown; POS used = AKE 1, PMC 4; POS Maletas = total - used
// - empty). POS vacias, Authorized POS by ET and comments are typed in.
// ---------------------------------------------------------------------------
const ET_ULD_POS = { AKE: 1, PMC: 4 };
const ET_DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
let etFlights = [];
let etRow = null;      // the flight open in the editor
let etMode = "flights";
const etEls = {
  tabs: document.getElementById("etTabs"),
  view: document.getElementById("etPosView"),
  file: document.getElementById("etPdf"),
  note: document.getElementById("etPosNote"),
  editor: document.getElementById("etPosEditor"),
  month: document.getElementById("etMonth"),
  kpis: document.getElementById("etKpis"),
  drop: document.getElementById("etDrop"),
  table: document.getElementById("etPosTable"),
};

function etNum(v) {
  return v === null || v === undefined || v === "" || Number.isNaN(Number(v)) ? null : Number(v);
}

function etFmt(v, decimals = 2) {
  const n = etNum(v);
  return n === null ? "" : n.toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: decimals });
}

// Same rules as _et_pos_compute in the API.
function etCompute(row) {
  let chw = 0;
  const awbs = (row.awbs || []).map(a => {
    const flown = etNum(a.pieces_flown), pieces = etNum(a.awb_pieces) || etNum(a.manifest_pieces_total), cw = etNum(a.chargeable_weight);
    let v = null;
    if (cw !== null) { v = !pieces || flown === null ? cw : cw / pieces * flown; v = Math.round(v * 100) / 100; chw += v; }
    return { ...a, chw: v };
  });
  const cancelled = !!row.cancelled;
  const used = cancelled ? 0 : (row.ulds || []).reduce((s, u) => s + (ET_ULD_POS[String(u.type || "").toUpperCase()] || 0), 0);
  const total = cancelled ? 0 : (etNum(row.total_pos) ?? 28);
  const empty = cancelled ? 0 : (etNum(row.pos_vacias) || 0);
  return { ...row, awbs, total_awbs: cancelled ? 0 : awbs.length, chw: cancelled ? 0 : Math.round(chw * 100) / 100,
           pos_used: used, total_pos: total, pos_maletas: total - used - empty };
}

function etDateInfo(iso) {
  const d = parseDay(iso);
  const utc = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const serial = Math.round((utc - Date.UTC(1899, 11, 30)) / 86400000);
  const t = new Date(utc); const day = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - day + 3);
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const week = 1 + Math.round(((t - firstThu) / 86400000 - 3 + ((firstThu.getUTCDay() + 6) % 7)) / 7);
  return { serial, week, year: d.getFullYear(), month: `${d.getFullYear()}-${d.getMonth() + 1}`,
           day: `${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}`, dow: ET_DOW[d.getDay()] };
}

function etExcelRow(r) {
  const i = etDateInfo(r.flight_date);
  return [i.month, `${r.origin}${i.serial}`, i.week, i.year, r.origin, r.flight, i.day, i.dow, r.total_awbs, etNum(r.neto) ?? 0, "",
          etNum(r.chw) ?? 0, r.total_pos, r.pos_used, etNum(r.pos_vacias) ?? 0, r.pos_maletas, etNum(r.authorized_pos), r.cancelled ? "FLIGHT CANCELLED" : (r.comments || "")];
}
const ET_COLUMNS = ["Year-MONTH", "Code", "W#", "Year", "Origin", "Flight", "Day", "DOW", "#AWBs", "NETO", "CBM", "CHW", "Total POS disponibles", "POS utilizadas", "POS vacias", "POS Maletas", "Authorized POS by ET", "Comments"];

function etApi(path, options = {}) {
  const sep = path.includes("?") ? "&" : "?";
  return fetch(`${API_BASE}${path}${sep}email=${encodeURIComponent(user().email || "")}`, { ...options, headers: { "x-api-key": API_KEY, ...(options.headers || {}) } })
    .then(async r => { const body = await r.json().catch(() => ({})); if (!r.ok) throw new Error(body.detail || "Request failed"); return body; });
}

async function loadEtPos() {
  etEls.note.textContent = "Loading saved flights…";
  try {
    etFlights = (await etApi("/api/airline_reports/et_pos")).flights || [];
    const months = [...new Set(etFlights.map(f => f.flight_date.slice(0, 7)))].sort().reverse();
    const now = iso(new Date()).slice(0, 7);
    if (!months.includes(now)) months.unshift(now);
    fillSelect(etEls.month, months.map(m => ({ value: m, label: m })).concat([{ value: "ALL", label: "All months" }]), etEls.month.value || now);
    etEls.note.textContent = "Upload the flight PDF (manifest + AWBs): it is read and every number is calculated. Check it, type POS vacias and Authorized POS by ET, and save.";
    renderEtTable();
  } catch (error) {
    etEls.note.textContent = error.message;
  }
}

// 19 nov, cony: same columns as the "data PAYLOAD" sheet, laid out to fit the screen.
const ET_VIEW = [
  ["Code", r => esc(`${r.origin}${etDateInfo(r.flight_date).serial}`), "strong"],
  ["W#", r => `<span class="wk">${etDateInfo(r.flight_date).week}</span>`, "c"],
  ["Day", r => esc(etDateInfo(r.flight_date).day), ""],
  ["DOW", r => esc(etDateInfo(r.flight_date).dow.slice(0, 3)), ""],
  ["Origin", r => esc(r.origin), "c"],
  ["Flight", r => esc(r.flight || ""), ""],
  ["#AWBs", r => r.total_awbs, "num"],
  ["NETO", r => etFmt(r.neto ?? 0), "num"],
  ["CBM", () => "", "num"],
  ["CHW", r => etFmt(r.chw ?? 0), "num strong"],
  ["Total POS disponibles", r => r.total_pos, "num"],
  ["POS utilizadas", r => r.pos_used, "num"],
  ["POS vacias", r => etNum(r.pos_vacias) ?? 0, "num"],
  ["POS Maletas", r => r.pos_maletas, "num strong"],
  ["Authorized POS by ET", r => etNum(r.authorized_pos) ?? "", "num"],
  ["Comments", r => r.cancelled ? '<span class="tag-cancel">FLIGHT CANCELLED</span>' : esc(r.comments || ""), "comment"],
];

function renderEtKpis(rows) {
  const flown = rows.filter(r => !r.cancelled);
  const sum = k => flown.reduce((s, r) => s + (etNum(r[k]) || 0), 0);
  const used = sum("pos_used"), total = sum("total_pos");
  const card = (label, value, sub, cls = "") => `<div class="et-kpi ${cls}"><span>${label}</span><b>${value}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
  etEls.kpis.innerHTML = rows.length ? [
    card("Flights", flown.length, `${rows.length - flown.length} cancelled`, rows.length - flown.length ? "red" : ""),
    card("AWBs", etFmt(sum("total_awbs"), 0)),
    card("NETO (kg)", etFmt(sum("neto"), 0)),
    card("CHW (kg)", etFmt(sum("chw"), 0)),
    card("POS used", `${used} / ${total}`, total ? `${Math.round(used / total * 100)}% of the positions` : ""),
    card("POS maletas", etFmt(sum("pos_maletas"), 0)),
  ].join("") : "";
}

function renderEtTable() {
  const month = etEls.month.value;
  const rows = etFlights.filter(f => month === "ALL" || f.flight_date.startsWith(month))
    .sort((x, y) => (x.flight_date + x.origin).localeCompare(y.flight_date + y.origin));
  renderEtKpis(rows);
  etEls.table.innerHTML = rows.length ? `<div class="et-table-head"><div class="block-title">Flights · ${esc(month === "ALL" ? "all months" : month)}</div><small>Click a flight to open it</small></div>
    <div class="table-wrap"><table class="df-table et-table">
    <thead><tr>${ET_VIEW.map(([h, , cls]) => `<th class="${cls.includes("num") ? "num" : cls.includes("c") ? "c" : ""}">${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.cancelled ? "et-cancel" : ""}" data-key="${esc(r.flight_date + "|" + r.origin)}">${ET_VIEW.map(([, f, cls]) => `<td class="${cls}">${f(r)}</td>`).join("")}</tr>`).join("")}</tbody>
  </table></div>` : `<div class="empty">No flights saved for ${esc(month === "ALL" ? "any month" : month)} yet. Upload the first flight PDF above.</div>`;
}

// What the reader verified or corrected on each AWB (19 nov, cony): the
// cross-checks run in the API (rate x CW = total, pieces vs manifest, CW vs gross).
function etStatus(a) {
  const parts = [];
  if (a.verified && !(a.checks || []).length) {
    const rate = etNum(a.awb_rate), total = etNum(a.awb_total), cw = etNum(a.chargeable_weight);
    const byRate = rate && total && cw && Math.abs(rate * cw - total) <= Math.max(1, 0.005 * total);
    parts.push(`<div class="et-ok">✓ verified ${byRate ? `(${etFmt(rate)} × ${etFmt(cw)} = ${etFmt(total)})` : "(CW ≥ gross weight, pieces match the manifest)"}</div>`);
  }
  (a.fixes || []).forEach(f => parts.push(`<div class="et-fix">✎ ${esc(f)}</div>`));
  (a.checks || []).forEach(c => parts.push(`<div class="et-chk">⚠ ${esc(c)}</div>`));
  if (a.edited) parts.push('<div class="et-fix">edited by hand</div>');
  return parts.join("") || "—";
}

function etInput(field, value, type = "number", attrs = "") {
  return `<input type="${type}" data-f="${field}" value="${esc(value ?? "")}" ${attrs}>`;
}

                 etRow.manifest_total_awbs !== null && etRow.manifest_total_awbs !== undefined && Number(etRow.manifest_total_awbs) !== r.total_awbs && !r.cancelled ? `The manifest says ${etRow.manifest_total_awbs} AWBs and ${r.total_awbs} were read.` : ""].filter(Boolean);
  etEls.editor.innerHTML = `
    <div class="block-title">${etRow._saved ? "Edit flight" : "New flight"} ${etRow.file_name ? `<span class="et-file">${esc(etRow.file_name)}</span>` : ""}</div>
    ${notes.length ? `<div class="et-warn">${notes.map(esc).join("<br>")}</div>` : ""}
    <div class="filters et-head">
      <div class="field"><label>Date</label>${etInput("flight_date", etRow.flight_date, "date")}</div>
      <div class="field"><label>Origin</label>${etInput("origin", etRow.origin, "text", 'maxlength="5" style="width:70px"')}</div>
      <div class="field"><label>Flight</label>${etInput("flight", etRow.flight, "text", 'style="width:80px"')}</div>
      <div class="field"><label>NETO (Mani. Wgt)</label>${etInput("neto", etRow.neto, "number", 'step="0.01" style="width:100px"')}</div>
      <div class="field"><label>Total POS</label>${etInput("total_pos", etRow.total_pos ?? 28, "number", 'style="width:70px"')}</div>
      <div class="field"><label>POS vacias</label>${etInput("pos_vacias", etRow.pos_vacias, "number", 'style="width:70px"')}</div>

      <span>POS utilizadas <b>${r.pos_used}</b></span><span>POS Maletas <b>${r.pos_maletas}</b></span>

        ${(etRow.ulds || []).map((u, i) => `<tr><td><input type="text" data-uld="${i}" data-k="uld" value="${esc(u.uld)}"></td><td><input type="text" data-uld="${i}" data-k="type" value="${esc(u.type)}" style="width:60px"></td><td class="num">${ET_ULD_POS[String(u.type || "").toUpperCase()] ?? 0}</td><td><button class="tool-btn et-x" data-del-uld="${i}" type="button">×</button></td></tr>`).join("")}
        </tbody></table><button class="tool-btn" id="etAddUld" type="button">+ ULD</button></div>

        ${r.awbs.map((a, i) => `<tr class="${a.chargeable_weight === null || a.chargeable_weight === undefined || (a.checks || []).length ? "et-missing" : ""}">

    </div>

}

function etDefaultOrigin(isoDate) {
  const dow = parseDay(isoDate).getDay();
  return [1, 3, 6].includes(dow) ? "JFK" : "EWR";
}

function etNewRow() {
  const day = iso(new Date());
  const origin = etDefaultOrigin(day);
  etRow = { flight_date: day, origin, flight: origin === "JFK" ? "ET513" : "ET151", neto: null, ulds: [], awbs: [], total_pos: 28, pos_vacias: null, authorized_pos: null, cancelled: false, comments: "", notes: "", file_name: "" };
  renderEtEditor();
}

async function readEtPdf() {
  const file = etEls.file.files[0];
  if (!file) return;
  etEls.note.textContent = `Reading ${file.name}… this takes a few seconds.`;
  etEls.drop.classList.add("busy");
  els.status.textContent = "Reading PDF";
  const form = new FormData();
  form.append("file", file);
  try {
    const row = await etApi("/api/airline_reports/et_pos/read", { method: "POST", body: form });
    const existing = etFlights.find(f => f.flight_date === row.flight_date && f.origin === row.origin);
    etRow = { ...row, authorized_pos: existing ? existing.authorized_pos : null, pos_vacias: existing ? existing.pos_vacias : null, _saved: !!existing };
    etEls.note.textContent = existing ? "This flight was already saved: saving replaces it with what was read now." : "Read. Check the numbers, type POS vacias and Authorized POS by ET, and save.";
    renderEtEditor();
  } catch (error) {
    etEls.note.textContent = error.message;
  } finally {
    els.status.textContent = "Live";
    etEls.file.value = "";
    etEls.drop.classList.remove("busy");
  }
}

async function saveEtRow(remove) {
  const r = etCompute(etRow);
  if (!r.flight_date || !r.origin) { etEls.note.textContent = "Date and origin are required."; return; }
  if (remove && !confirm(`Delete the flight of ${r.flight_date} ${r.origin}?`)) return;
  const body = { flight_date: r.flight_date, origin: r.origin, flight: r.flight || "", neto: etNum(etRow.neto), manifest_total_awbs: etNum(etRow.manifest_total_awbs),
                 ulds: etRow.ulds || [], awbs: (etRow.awbs || []).map(({ chw, ...a }) => a), total_pos: etNum(etRow.total_pos), pos_vacias: etNum(etRow.pos_vacias),
                 authorized_pos: etNum(etRow.authorized_pos), cancelled: !!etRow.cancelled, comments: etRow.comments || "", notes: etRow.notes || "", file_name: etRow.file_name || "", delete: !!remove };
  try {
    await etApi("/api/airline_reports/et_pos/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    etRow = null;
    renderEtEditor();
    await loadEtPos();
    etEls.note.textContent = remove ? "Flight deleted." : "Flight saved.";
  } catch (error) {
    etEls.note.textContent = error.message;
  }
}

async function exportEtExcel() {
  if (!window.ExcelJS) return;
  const month = etEls.month.value;
  const rows = etFlights.filter(f => month === "ALL" || f.flight_date.startsWith(month));
  const book = new ExcelJS.Workbook();
  const sheet = book.addWorksheet("data PAYLOAD");
  const head = sheet.addRow(ET_COLUMNS);
  head.eachCell(c => { c.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF548235" } }; c.font = { color: { argb: "FFFFFFFF" }, bold: true }; c.alignment = { horizontal: "center", wrapText: true }; });
  ET_COLUMNS.forEach((_, i) => { sheet.getColumn(i + 1).width = i === 17 ? 24 : 12; });
  rows.forEach(r => {
    const line = sheet.addRow(etExcelRow(r));
    line.getCell(10).numFmt = "#,##0.00"; line.getCell(12).numFmt = "#,##0.00";
    if (r.cancelled) line.eachCell({ includeEmpty: true }, c => { c.font = { color: { argb: "FFFF0000" } }; });
  });
  const buffer = await book.xlsx.writeBuffer();
  downloadBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `ET POS ${month}.xlsx`);
}

function setEtMode(mode) {
  etMode = mode;
  etEls.tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
  const pos = mode === "pos";
  document.querySelector("#reportView > .panel").hidden = pos;
  els.report.hidden = pos;
  etEls.view.hidden = !pos;
  if (pos) loadEtPos();
}

etEls.tabs.addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (b) history.replaceState(null, "", b.dataset.mode === "pos" ? "#ET/POS" : "#ET");
  if (b) setEtMode(b.dataset.mode);
});
etEls.file.addEventListener("change", readEtPdf);
["dragenter", "dragover"].forEach(ev => etEls.drop.addEventListener(ev, e => { e.preventDefault(); etEls.drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => etEls.drop.addEventListener(ev, e => { e.preventDefault(); etEls.drop.classList.remove("over"); }));
etEls.drop.addEventListener("drop", e => {
  const f = [...(e.dataTransfer.files || [])].find(x => x.type === "application/pdf" || /\.pdf$/i.test(x.name));
  if (!f) { etEls.note.textContent = "Drop a PDF file."; return; }
  const dt = new DataTransfer(); dt.items.add(f); etEls.file.files = dt.files; readEtPdf();
});
etEls.month.addEventListener("change", renderEtTable);
document.getElementById("etNewBtn").addEventListener("click", etNewRow);
document.getElementById("etExcelBtn").addEventListener("click", exportEtExcel);
etEls.table.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-key]");
  if (!tr) return;
  const f = etFlights.find(x => `${x.flight_date}|${x.origin}` === tr.dataset.key);
  if (f) { etRow = { ...JSON.parse(JSON.stringify(f)), _saved: true }; renderEtEditor(); etEls.editor.scrollIntoView({ behavior: "smooth" }); }
});
etEls.editor.addEventListener("input", e => {
  const t = e.target;
  if (!etRow) return;
  if (t.dataset.f) etRow[t.dataset.f] = t.type === "checkbox" ? t.checked : t.value;
  else if (t.dataset.awb !== undefined) {
    const a = etRow.awbs[Number(t.dataset.awb)];
    a[t.dataset.k] = t.type === "number" ? etNum(t.value) : t.value;
    a.edited = true;
    a.checks = [];
  }
  else if (t.dataset.uld !== undefined) etRow.ulds[Number(t.dataset.uld)][t.dataset.k] = t.value;
  else return;
  // Recalculate without losing the cursor: only the summary and the CHW cells change.
  const pos = t.selectionStart, id = [t.dataset.f, t.dataset.awb, t.dataset.uld, t.dataset.k].join("|");
  if (t.type === "checkbox" || t.dataset.f === "flight_date") { renderEtEditor(); return; }
  renderEtEditor();
  const again = [...etEls.editor.querySelectorAll("input")].find(x => [x.dataset.f, x.dataset.awb, x.dataset.uld, x.dataset.k].join("|") === id);
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (_) {} }
});
etEls.editor.addEventListener("click", e => {
  const t = e.target;
  if (!etRow) return;
  if (t.id === "etAddAwb") etRow.awbs.push({ awb: "071-", uld: "", pieces_flown: null, awb_pieces: null, manifest_pieces_total: null, chargeable_weight: null });
  else if (t.id === "etAddUld") etRow.ulds.push({ uld: "", type: "PMC" });
  else if (t.dataset.delAwb !== undefined) etRow.awbs.splice(Number(t.dataset.delAwb), 1);
  else if (t.dataset.delUld !== undefined) etRow.ulds.splice(Number(t.dataset.delUld), 1);
  else if (t.id === "etSave") return saveEtRow(false);
  else if (t.id === "etDelete") return saveEtRow(true);
  else if (t.id === "etCancelEdit") { etRow = null; renderEtEditor(); return; }
  else return;
  renderEtEditor();
});

// ---------------------------------------------------------------------------
// Avianca: "Mercado SCL" weekly report (19 nov, cony). Same design as the PDF
// sent to Avianca (SCL-MIA, then BOG / JFK / Asia), built from the Isidora
// export data by the API. Every headline is written from the numbers; the
// national context is typed in, and any headline can be edited before the PDF.
// ---------------------------------------------------------------------------
let scl = null;
let sclSeq = 0;
const sclEls = {
  view: document.getElementById("sclView"),
  week: document.getElementById("sclWeek"),
  context: document.getElementById("sclContext"),
  note: document.getElementById("sclNote"),
  report: document.getElementById("sclReport"),
};
const SCL_MONTHS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

function sclN(v, dec = 0) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  return Number(v).toLocaleString("es-CL", { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function sclT(v) { return `${sclN(v)} t`; }
function sclPctTxt(v, dec = 1) { return v === null || v === undefined ? "–" : `${sclN(v, dec)}%`; }
function sclChg(a, b) { return !b ? null : (a - b) / b * 100; }
function sclSigned(v, dec = 0, suffix = "%") {
  if (v === null || v === undefined) return "–";
  return `${v > 0 ? "+" : v < 0 ? "−" : ""}${sclN(Math.abs(v), dec)}${suffix}`;
}
function sclDelta(now, before, wk) {
  if (now === null || now === undefined || before === null || before === undefined) return `<span class="d-flat">– vs W${wk}</span>`;
  const d = now - before;
  if (Math.abs(d) < 0.05) return `<span class="d-flat">= 0,0 pp vs W${wk}</span>`;
  return `<span class="${d > 0 ? "d-up" : "d-down"}">${d > 0 ? "▲" : "▼"} ${sclN(Math.abs(d), 1)} pp vs W${wk}</span>`;
}
function sclTitle(key) {
  const t = (scl.titles_edited || {})[key] ?? scl.titles[key] ?? "";
  return `<span class="scl-edit" contenteditable="true" spellcheck="false" data-title="${key}">${esc(t)}</span>`;
}
function sclDates() {
  const a = parseDay(scl.start), b = parseDay(scl.end);
  const same = a.getMonth() === b.getMonth();
  return `${a.getDate()}${same ? "" : ` de ${SCL_MONTHS[a.getMonth()]}`} al ${b.getDate()} de ${SCL_MONTHS[b.getMonth()]} de ${b.getFullYear()} · vs W${scl.prev_week}`;
}
function sclHeader(title) {
  return `<header class="scl-head"><div><h1>${esc(title)}</h1><p>${esc(sclDates())}</p></div>
    <div class="scl-logos"><img src="img/avianca-cargo.png" alt="Avianca Cargo"><span></span><img src="img/gsa-force.png" alt="GSA Force"></div></header>`;
}

// Weekly bars (market tons) with the Avianca share line, like the PDF.
function sclChart(series, opts = {}) {
  const W = 1100, H = opts.height || 230, L = 52, R = opts.share === false ? 20 : 56, T = 34, B = 30;
  if (!series.length) return "";
  const week = scl.week;
  const maxT = Math.max(1, ...series.map(s => s.tons));
  const step = (W - L - R) / series.length, bw = Math.max(3, step * 0.62);
  const tickT = sclNiceTicks(maxT);
  const yT = v => T + (H - T - B) * (1 - v / tickT[tickT.length - 1]);
  const shares = series.map(s => s.share).filter(v => v !== null && v !== undefined);
  const maxS = opts.share === false ? 1 : Math.max(1, ...shares);
  const tickS = sclNiceTicks(maxS);
  const yS = v => T + (H - T - B) * (1 - v / tickS[tickS.length - 1]);
  let g = tickT.map(v => `<line x1="${L}" x2="${W - R}" y1="${yT(v)}" y2="${yT(v)}" class="grid"/><text x="${L - 8}" y="${yT(v) + 4}" class="axis" text-anchor="end">${sclN(v)}</text>`).join("");
  if (opts.share !== false) g += tickS.slice(1).map(v => `<text x="${W - R + 8}" y="${yS(v) + 4}" class="axis red">${sclN(v)}%</text>`).join("");
  series.forEach((s, i) => {
    const x = L + i * step + (step - bw) / 2;
    const cls = s.week === week ? "bar now" : s.week === week - 1 ? "bar prev" : "bar";
    g += `<rect x="${x}" y="${yT(s.tons)}" width="${bw}" height="${Math.max(0, H - B - yT(s.tons))}" rx="2" class="${cls}"/>`;
    g += `<text x="${x + bw / 2}" y="${H - B + 16}" class="axis" text-anchor="middle" transform="rotate(-45 ${x + bw / 2} ${H - B + 16})">${s.week}</text>`;
  });
  if (opts.share !== false) {
    const pts = series.map((s, i) => s.share === null || s.share === undefined ? null : [L + i * step + step / 2, yS(s.share)]).filter(Boolean);
    g += `<polyline points="${pts.map(p => p.join(",")).join(" ")}" class="line"/>`;
    pts.slice(-2).forEach(p => { g += `<circle cx="${p[0]}" cy="${p[1]}" r="5" class="dot"/>`; });
  }
  const last = series[series.length - 1];
  const lab = `W${week}: ${sclT(last.tons)}${opts.share === false ? "" : ` · ${sclPctTxt(last.share)}`}`;
  return `<div class="scl-legend"><span><i class="lg-bar"></i>Toneladas mercado</span>${opts.share === false ? "" : '<span><i class="lg-line"></i>Share Avianca</span>'}<b>${esc(lab)}</b></div>
    <svg viewBox="0 0 ${W} ${H}" class="scl-chart">${g}</svg>`;
}
function sclNiceTicks(max) {
  const raw = max / 3, mag = 10 ** Math.floor(Math.log10(raw)), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = 0; v <= max + step * 0.999; v += step) out.push(Math.round(v * 100) / 100);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
function sclBars(rows, maxV) {
  return rows.map(r => {
    const wPrev = Math.max(0.6, r.prev / maxV * 78), wNow = Math.max(0.6, r.now / maxV * 78);
    return `<div class="scl-brow">
      <div class="scl-bname">${r.name}</div>
      <div class="scl-bbars"><div><i class="b-prev" style="width:${wPrev}%"></i><em>${sclT(r.prev)}</em></div>
        <div><i class="b-now ${r.cls || ""}" style="width:${wNow}%"></i><b>${sclT(r.now)}</b></div></div>
      <div class="scl-bside">${r.side}</div></div>`;
  }).join("");
}

function sclPage1() {

  const maxFa = Math.max(1, ...fr.airlines.map(a => a.tons)), maxFg = Math.max(1, ...fr.agents.map(a => a.tons)), maxFv = Math.max(1, ...fr.avianca_agents.map(a => a.tons));
  return `<section class="scl-page">${sclHeader(`Mercado SCL–MIA · Semana ${W}`)}
    <h2 class="scl-main">${sclTitle("main")}</h2>
    <div class="scl-kpis">
      <div class="scl-kpi"><span>Mercado SCL–MIA</span><b>${sclT(m.market)}</b><small class="${chgM < 0 ? "t-red" : "t-green"}">${sclSigned(chgM)} vs W${pw}</small></div>
      <div class="scl-kpi"><span>Avianca (729)</span><b>${sclT(m.avianca)}</b><small class="${chgA < 0 ? "t-red" : "t-green"}">${sclSigned(chgA)} vs W${pw} (${sclT(m.avianca_prev)})</small></div>
      <div class="scl-kpi"><span>Market share</span><b>${sclPctTxt(m.share)}</b><small class="${m.share < m.share_prev ? "t-red" : "t-green"}">${sclSigned(m.share - m.share_prev, 1, " pp")} · promedio ${scl.year}: ${sclPctTxt(m.avg_share_year)}</small></div>
      <div class="scl-kpi"><span>Ranking</span><b>${m.rank ?? "–"}.°</b><small>${esc(m.rank_note || "")}</small></div>
    </div>

    <div class="scl-two">

        <div class="scl-legend"><span><i class="lg-prev"></i>W${pw}</span><span><i class="lg-now"></i>W${W}</span></div>${sclBars(airRows, maxAir)}</div>
      <div class="scl-card"><div class="scl-kicker">Desempeño por agencia con Avianca</div><h3>${sclTitle("agencies")}</h3>
        <div class="scl-legend"><span><i class="lg-prev"></i>W${pw}</span><span><i class="lg-now"></i>W${W} · toneladas con Avianca</span></div>${sclBars(agRows, maxAg)}</div>
    </div>
